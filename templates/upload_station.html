<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Upload Station — Crystal Images</title>
<link rel="manifest" href="/u/__PATH__/manifest.json">
<link rel="icon" href="/static/upload-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/upload.css?v=4">
<style>
/* The store desktops' upload page: the upload form, then today's uploads.
   The website's look (bigskyphotos.com): navy page, darker navy bands and cards, gold for headings
   and buttons, Manrope. The upload form's own styles (upload.css, shared with the studio) are
   recolored at the end of this block. */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',system-ui,sans-serif;background:#093A52;color:#fff;min-height:100vh}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid #F5C430;outline-offset:2px}

#st-top{position:sticky;top:0;z-index:50;height:60px;background:#062a3d;border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;align-items:center;gap:.9rem;padding:0 1.5rem}
#st-top img{height:34px;width:auto;display:block}
#st-top h1{color:#fff;font-size:.95rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-right:auto}
.st-who{font-size:.8rem;color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.14);border-radius:100px;padding:.2rem .7rem;white-space:nowrap}

#st-main{padding:1.75rem 1.25rem 4rem;display:flex;flex-direction:column;gap:1.5rem}

/* Today's uploads */
.today-card{background:#0a1e2e;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:1.5rem 1.75rem;width:100%;max-width:820px;margin:0 auto}
.today-head{display:flex;align-items:center;gap:.75rem;margin-bottom:.35rem}
.today-head h2{color:#F5C430;font-size:1.05rem;margin-right:auto}
.today-sub{font-size:.8rem;color:rgba(255,255,255,.45);line-height:1.5;margin-bottom:1rem}
.ghost-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.8);border-radius:7px;
  padding:.32rem .8rem;font-size:.8rem;cursor:pointer}
.ghost-btn:hover:not(:disabled){background:rgba(255,255,255,.12)}
.ghost-btn:disabled{opacity:.45;cursor:not-allowed}
.gold-btn{background:#F5C430;border:none;color:#05212e;border-radius:7px;padding:.36rem .9rem;font-size:.8rem;font-weight:700;cursor:pointer}
.gold-btn:hover:not(:disabled){background:#f7cf55}
.gold-btn:disabled{opacity:.45;cursor:not-allowed}
.red-btn{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.45);color:#f87171;border-radius:7px;padding:.32rem .8rem;font-size:.8rem;cursor:pointer}
.red-btn:hover:not(:disabled){background:rgba(239,68,68,.22)}
.red-btn:disabled{opacity:.45;cursor:not-allowed}

.tg{border-top:1px solid rgba(255,255,255,.07)}
.tg-row{display:flex;align-items:center;gap:.8rem;padding:.7rem 0;flex-wrap:wrap}
.tg-name{font-weight:600;font-size:.92rem;color:#fff}
.tg-meta{font-size:.76rem;color:rgba(255,255,255,.42);margin-top:.15rem}
.tg-count{margin-left:auto;font-size:.8rem;color:rgba(255,255,255,.6);white-space:nowrap}
.tg-body{padding:0 0 1rem}
.tg-tools{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;margin-bottom:.6rem}
.tg-sel{font-size:.78rem;color:rgba(255,255,255,.55);margin-right:auto}
.tg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:5px;max-height:560px;overflow-y:auto}
.tp{position:relative;aspect-ratio:3/2;border-radius:4px;overflow:hidden;cursor:pointer;background:#111;border:2px solid transparent;user-select:none}
.tp img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tp.sel{border-color:#3b82f6}
.tp .tp-check{display:none;position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:#3b82f6;color:#fff;
  font-size:.62rem;align-items:center;justify-content:center;font-weight:700}
.tp.sel .tp-check{display:flex}
.tp .tp-name{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);font-size:.6rem;color:rgba(255,255,255,.8);
  padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp .tp-restore{position:absolute;top:4px;right:4px;background:#F5C430;color:#05212e;border:none;border-radius:5px;font-size:.66rem;
  font-weight:700;padding:.15rem .45rem;cursor:pointer}
.today-empty{font-size:.85rem;color:rgba(255,255,255,.4);padding:.6rem 0 .2rem}
.trash-title{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.45);margin:1.2rem 0 .5rem}
.trash-note{font-size:.76rem;color:rgba(255,255,255,.4);margin-bottom:.6rem;line-height:1.5}

/* Two-button question (upload.js) and the Move window */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal-box{background:#0a1e2e;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:1.6rem;width:420px;max-width:100%;max-height:90vh;overflow:auto}
.modal-box h3{color:#F5C430;font-size:.98rem;margin-bottom:1.2rem}
.modal-field{margin-bottom:.82rem}
.modal-field label{display:block;font-size:.72rem;color:rgba(255,255,255,.4);margin-bottom:.32rem;text-transform:uppercase;letter-spacing:.5px}
.modal-field select,.modal-field input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;padding:.55rem .8rem;color:#fff;font-size:.88rem;outline:none}
.modal-field select:focus,.modal-field input:focus{border-color:#F5C430}
.modal-field select option{background:#0c2336}
.modal-actions{display:flex;gap:.55rem;justify-content:flex-end;margin-top:1.2rem}
.modal-cancel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);color:rgba(255,255,255,.55);
  border-radius:8px;padding:.5rem 1.1rem;cursor:pointer;font-size:.86rem}
.modal-ok{background:#F5C430;color:#05212e;border:none;border-radius:8px;padding:.5rem 1.2rem;font-weight:700;cursor:pointer;font-size:.86rem}
.modal-ok:hover{background:#f7cf55}
.modal-ok:disabled{opacity:.45;cursor:not-allowed}
.move-note{font-size:.78rem;color:rgba(255,255,255,.45);line-height:1.5;margin-top:-.2rem}

#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#0a1e2e;border:1px solid rgba(255,255,255,.14);
  color:#fff;padding:.65rem 1.2rem;border-radius:10px;font-size:.86rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:600;max-width:90vw}
#toast.show{opacity:1}

/* The website's colors on the shared upload form and this page's parts */
.upload-card,.today-card{background:#062a3d;border:1px solid rgba(255,255,255,.07);border-radius:12px}
.upload-card h2,.today-head h2{color:#F5C430;font-size:1rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.field label,.modal-field label{color:rgba(255,255,255,.5);font-weight:700}
.field input,.field select,.modal-field input,.modal-field select{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
.field input:focus,.field select:focus,.modal-field input:focus,.modal-field select:focus{border-color:#F5C430}
.field select option,.modal-field select option{background:#062a3d}
#drop-zone{border-color:rgba(255,255,255,.18)}
#drop-zone:hover,#drop-zone.drag-over{border-color:#F5C430;background:rgba(245,196,48,.05)}
.dz-link{color:#F5C430}
#upload-action-btn,.gold-btn,.modal-ok,.pose-tbtn.primary{background:#F5C430;color:#05212e}
#upload-action-btn:hover:not(:disabled),.gold-btn:hover:not(:disabled),.modal-ok:hover,.pose-tbtn.primary:hover:not(:disabled){background:#f7cf55}
#upload-action-btn:disabled{background:transparent;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.4);opacity:1}
#upload-all-btn{color:#F5C430;border-color:rgba(245,196,48,.55)}
.prog-bar-fill{background:#F5C430}
.race-toggle b{color:#F5C430}
.race-toggle input{accent-color:#F5C430}
#race-panel{border-color:rgba(245,196,48,.3);background:rgba(245,196,48,.04)}
.ghost-btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16)}
.tg{border-top-color:rgba(255,255,255,.08)}
.modal-box{background:#062a3d;border-color:rgba(255,255,255,.1)}
.modal-box h3{color:#F5C430}
#toast{background:#062a3d}
.st-who{border-color:rgba(255,255,255,.18);color:rgba(255,255,255,.65)}

@media (max-width:640px){
  .form-grid{grid-template-columns:1fr}
  .upload-card,.today-card{padding:1.2rem}
}
</style>
</head>
<body>

<header id="st-top">
  <img src="https://bigskyphotos.com/wp-content/uploads/2026/05/New-Logo-Transparent.png?w=300&amp;quality=80" alt="Crystal Images">
  <h1>Upload Station</h1>
  <span class="st-who" title="This computer's name (Settings &gt; Security in the studio)">__STATION_NAME__</span>
</header>

<main id="st-main">
  <!--upload-form-->

  <section class="today-card" aria-labelledby="today-title">
    <div class="today-head">
      <h2 id="today-title">Today's uploads</h2>
      <button type="button" class="ghost-btn" id="today-refresh" onclick="loadToday()">Refresh</button>
    </div>
    <p class="today-sub">Everything uploaded today, from every computer. Open a folder to move photos sent to the wrong place, or to put them in the trash. No need to upload them again.</p>
    <div id="today-list"><div class="today-empty">Loading…</div></div>
    <div id="today-trash"></div>
  </section>
</main>

<div class="modal-overlay" id="choice-modal" role="dialog" aria-modal="true" aria-labelledby="choice-title">
  <div class="modal-box" style="width:440px" onclick="event.stopPropagation()">
    <h3 id="choice-title"></h3>
    <div id="choice-body"></div>
    <div class="modal-actions">
      <button class="modal-cancel" id="choice-no"></button>
      <button class="modal-ok" id="choice-yes"></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="move-modal" role="dialog" aria-modal="true" aria-labelledby="move-title" onclick="closeMove()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3 id="move-title">Move photos</h3>
    <div class="modal-field">
      <label for="mv-date">Date</label>
      <input type="date" id="mv-date">
    </div>
    <div class="modal-field">
      <label for="mv-category">Activity Group</label>
      <select id="mv-category" onchange="moveCategoryChange()"></select>
    </div>
    <div class="modal-field">
      <label for="mv-location">Location</label>
      <select id="mv-location" onchange="moveLocationChange()"></select>
    </div>
    <div class="modal-field" id="mv-folder-wrap" hidden>
      <label for="mv-folder">Family name</label>
      <input id="mv-folder" placeholder="e.g. Smith" autocomplete="off">
    </div>
    <p class="move-note" id="mv-note"></p>
    <div class="modal-actions">
      <button class="modal-cancel" type="button" onclick="closeMove()">Cancel</button>
      <button class="modal-ok" type="button" id="mv-ok" onclick="doMove()">Move</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/static/upload.js?v=6"></script>
<script>
// ── Page helpers the upload form uses ──
let toastTimer = null;
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = type === 'error' ? 'rgba(239,68,68,.5)' : 'rgba(255,255,255,.14)';
  el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// After an upload, today's list shows it
window.uploadHooks = {refresh: () => loadToday(), done: () => loadToday()};

// ── Today's uploads ──
let today = {groups: [], trash: []};
let openKey = null;               // the folder that's open
let picked = new Set();           // its selected photos
let lastPick = -1;
const gKey = g => `${g.date}|${g.location}|${g.folder}`;

function fmtDate(d) {
  const [y, m, day] = d.split('-').map(Number);
  return new Date(y, m - 1, day).toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
}
function fmtTime(iso) {
  try { return new Date(iso).toLocaleTimeString(undefined, {hour: 'numeric', minute: '2-digit'}); } catch (e) { return ''; }
}

async function loadToday() {
  const btn = document.getElementById('today-refresh');
  btn.disabled = true;
  try {
    const r = await fetch('/api/station/today');
    if (!r.ok) throw new Error();
    today = await r.json();
    if (openKey && !today.groups.some(g => gKey(g) === openKey)) { openKey = null; picked = new Set(); }
    if (openKey) {
      const still = new Set(today.groups.find(g => gKey(g) === openKey).photos.map(p => p.path));
      picked = new Set([...picked].filter(p => still.has(p)));
    }
    renderToday();
  } catch (e) {
    document.getElementById('today-list').innerHTML = '<div class="today-empty">Couldn\'t load today\'s uploads. Check the connection, then Refresh.</div>';
  } finally { btn.disabled = false; }
}

function renderToday() {
  const list = document.getElementById('today-list');
  if (!today.groups.length) {
    list.innerHTML = '<div class="today-empty">Nothing uploaded yet today.</div>';
  } else {
    list.innerHTML = today.groups.map(g => {
      const k = gKey(g), open = k === openKey;
      const name = g.folder ? `${esc(g.location)} · ${esc(g.folder)}` : esc(g.location);
      const meta = [fmtDate(g.date), g.by.length ? 'from ' + g.by.map(esc).join(', ') : '', g.last ? 'last at ' + fmtTime(g.last) : '']
        .filter(Boolean).join(' · ');
      return `<div class="tg" data-key="${esc(k)}">
        <div class="tg-row">
          <div><div class="tg-name">${name}</div><div class="tg-meta">${meta}</div></div>
          <span class="tg-count">${g.count} photo${g.count === 1 ? '' : 's'}</span>
          <button type="button" class="ghost-btn" onclick="toggleGroup(this.closest('.tg').dataset.key)" aria-expanded="${open}">${open ? 'Close' : 'Open'}</button>
        </div>
        ${open ? groupBody(g) : ''}
      </div>`;
    }).join('');
  }
  renderTrash();
}

function groupBody(g) {
  const n = picked.size;
  return `<div class="tg-body">
    <div class="tg-tools">
      <span class="tg-sel" id="tg-sel">${n ? `${n} selected` : 'Click photos to select them (Shift-click for a range)'}</span>
      <button type="button" class="ghost-btn" onclick="pickAll()">Select all</button>
      <button type="button" class="ghost-btn" onclick="pickNone()" ${n ? '' : 'disabled'}>Clear</button>
      <button type="button" class="gold-btn" onclick="openMove()" ${n ? '' : 'disabled'}>Move…</button>
      <button type="button" class="red-btn" onclick="trashPicked()" ${n ? '' : 'disabled'}>Move to Trash</button>
    </div>
    <div class="tg-grid">${g.photos.map((p, i) => `<div class="tp${picked.has(p.path) ? ' sel' : ''}" data-i="${i}" onclick="pickPhoto(event, ${i})" title="${esc(p.name)}">
      <img src="${esc(p.thumb)}" alt="${esc(p.name)}" loading="lazy"><span class="tp-check">&#10003;</span><span class="tp-name">${esc(p.name)}</span></div>`).join('')}</div>
  </div>`;
}

function openGroup() { return today.groups.find(g => gKey(g) === openKey); }
function toggleGroup(k) {
  openKey = openKey === k ? null : k;
  picked = new Set(); lastPick = -1;
  renderToday();
}
function refreshPicks() {
  // Only the selection changed: update the marks and buttons without redrawing the photos
  const g = openGroup(); if (!g) return;
  const card = document.querySelector(`.tg[data-key="${CSS.escape(openKey)}"]`); if (!card) return;
  card.querySelectorAll('.tp').forEach(el => el.classList.toggle('sel', picked.has(g.photos[+el.dataset.i].path)));
  const n = picked.size;
  card.querySelector('#tg-sel').textContent = n ? `${n} selected` : 'Click photos to select them (Shift-click for a range)';
  card.querySelectorAll('.tg-tools button').forEach((b, i) => { if (i > 0) b.disabled = !n; });
}
function pickPhoto(e, i) {
  const g = openGroup(); if (!g) return;
  const path = g.photos[i].path;
  if (e.shiftKey && lastPick >= 0) {
    const on = !picked.has(path);                   // the range follows the photo clicked
    const [a, b] = [Math.min(lastPick, i), Math.max(lastPick, i)];
    for (let j = a; j <= b; j++) on ? picked.add(g.photos[j].path) : picked.delete(g.photos[j].path);
  } else if (picked.has(path)) picked.delete(path);
  else picked.add(path);
  lastPick = i;
  refreshPicks();
}
function pickAll() { const g = openGroup(); if (g) { picked = new Set(g.photos.map(p => p.path)); refreshPicks(); } }
function pickNone() { picked = new Set(); lastPick = -1; refreshPicks(); }

async function trashPicked() {
  const paths = [...picked];
  if (!paths.length) return;
  const ok = await askChoice(`Move ${paths.length} photo${paths.length === 1 ? '' : 's'} to the trash?`,
    `<p class="choice-text">${paths.length === 1 ? 'It leaves' : 'They leave'} the site now. Until next week ${paths.length === 1 ? 'it can' : 'they can'} be brought back from "In the trash" below today, or from the studio's Trash after that.</p>`,
    'Move to Trash', 'Cancel');
  if (!ok) return;
  const r = await fetch('/api/station/trash', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({paths})});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { showToast(d.error || 'Couldn\'t move them to the trash', 'error'); return; }
  showToast(`${d.trashed} photo${d.trashed === 1 ? '' : 's'} moved to the trash` + (d.failed ? ` (${d.failed} couldn't be)` : ''), d.failed ? 'error' : undefined);
  picked = new Set(); lastPick = -1;
  loadToday();
}

function renderTrash() {
  const el = document.getElementById('today-trash');
  const t = today.trash || [];
  if (!t.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="trash-title">In the trash (${t.length})</div>
    <p class="trash-note">Today's photos that were put in the trash. Bring one back to where it was with Restore.</p>
    <div class="tg-grid">${t.map((p, i) => `<div class="tp" title="${esc(p.name)} · ${esc(p.folder ? p.location + ' · ' + p.folder : p.location)}">
      <img src="${esc(p.thumb)}" alt="${esc(p.name)}" loading="lazy"><button type="button" class="tp-restore" onclick="restorePhoto(${i}, this)">Restore</button><span class="tp-name">${esc(p.name)}</span></div>`).join('')}</div>`;
}
async function restorePhoto(i, btn) {
  const p = (today.trash || [])[i]; if (!p) return;
  btn.disabled = true;
  const r = await fetch('/api/station/restore', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path: p.path})});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { showToast(d.error || 'Couldn\'t bring it back', 'error'); btn.disabled = false; return; }
  showToast(`${p.name} is back`);
  loadToday();
}

// ── Move window ──
function fillMoveLocations(catName, keep) {
  const cat = _uploadCategories.find(c => c.name === catName);
  const sel = document.getElementById('mv-location');
  sel.innerHTML = (cat?.acts || []).map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join('');
  if (keep && [...sel.options].some(o => o.value === keep)) sel.value = keep;
  moveLocationChange();
}
function moveCategoryChange() { fillMoveLocations(document.getElementById('mv-category').value); }
function moveLocationChange() {
  const loc = document.getElementById('mv-location').value;
  const portrait = PORTRAIT_LOCS.has((loc || '').trim().toLowerCase());
  document.getElementById('mv-folder-wrap').hidden = !portrait;
  document.getElementById('mv-ok').disabled = !loc;
}
function openMove() {
  const g = openGroup(); if (!g || !picked.size) return;
  const cats = _uploadCategories.filter(c => c.active !== false);
  const catSel = document.getElementById('mv-category');
  catSel.innerHTML = cats.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
  const here = cats.find(c => (c.acts || []).includes(g.location));
  if (here) catSel.value = here.name;
  document.getElementById('mv-date').value = g.date;
  fillMoveLocations(catSel.value, g.location);
  document.getElementById('mv-folder').value = g.folder || '';
  document.getElementById('move-title').textContent = `Move ${picked.size} photo${picked.size === 1 ? '' : 's'}`;
  document.getElementById('mv-note').textContent = 'Labels and poses go with them. A photo with the same name already in the new place is left where it is.';
  document.getElementById('move-modal').classList.add('open');
  document.getElementById('mv-date').focus();
}
function closeMove() { document.getElementById('move-modal').classList.remove('open'); }
async function doMove() {
  const new_date = document.getElementById('mv-date').value;
  const new_location = document.getElementById('mv-location').value;
  const portrait = PORTRAIT_LOCS.has((new_location || '').trim().toLowerCase());
  const new_folder = portrait ? document.getElementById('mv-folder').value.trim() : '';
  if (!new_date || !new_location) { showToast('Choose a date and location', 'error'); return; }
  if (portrait && !new_folder) { showToast('Enter the family name', 'error'); return; }
  const ok = document.getElementById('mv-ok'); ok.disabled = true; ok.textContent = 'Moving…';
  try {
    const r = await fetch('/api/station/move', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({paths: [...picked], new_date, new_location, new_folder})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { showToast(d.error || 'Couldn\'t move them', 'error'); return; }
    closeMove();
    const where = new_folder ? `${new_location} · ${new_folder}` : new_location;
    let msg = `${d.moved} photo${d.moved === 1 ? '' : 's'} moved to ${where}`;
    if (d.skipped?.length) msg += ` · ${d.skipped.length} left (same name already there)`;
    if (d.failed) msg += ` · ${d.failed} couldn't be moved`;
    showToast(msg, d.skipped?.length || d.failed ? 'error' : undefined);
    openKey = `${new_date}|${new_location}|${new_folder}`;
    picked = new Set(); lastPick = -1;
    loadToday();
  } finally { ok.disabled = false; ok.textContent = 'Move'; }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMove(); });

document.addEventListener('DOMContentLoaded', () => {
  initUploadForm();
  loadToday();
  // Other computers' uploads show up too: a quiet check every two minutes while nothing is open
  setInterval(() => { if (!openKey && !_uploadActive && !document.hidden) loadToday(); }, 120000);
});
</script>
</body>
</html>

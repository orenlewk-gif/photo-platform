<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Crystal Images</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #093A52;
      font-family: 'DM Sans', sans-serif;
      color: #e8eaf0;
      min-height: 100vh;
    }

    /* ── Header ── */
    .co-header {
      background: #062b3e;
      border-bottom: 1px solid rgba(255,255,255,.07);
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .co-logo {
      color: #F5C518;
      font-family: 'DM Sans', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;
    }
    .co-back {
      color: rgba(255,255,255,.5);
      font-size: 0.85rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.2s;
    }
    .co-back:hover { color: #fff; }

    /* ── Page layout ── */
    .co-page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 2rem;
      align-items: start;
    }
    .co-page h1 {
      font-family: 'DM Sans', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #F5C518;
      margin-bottom: 1.5rem;
      grid-column: 1 / -1;
    }

    /* ── Cards ── */
    .co-card {
      background: #093A53;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 1.75rem;
      margin-bottom: 1.25rem;
    }
    .co-card:last-child { margin-bottom: 0; }
    .co-card-title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,.35);
      margin-bottom: 1.25rem;
    }

    /* ── Form fields ── */
    .co-field { display: flex; flex-direction: column; flex: 1; margin-bottom: 1rem; }
    .co-field:last-child { margin-bottom: 0; }
    .co-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: rgba(255,255,255,.5);
      margin-bottom: 0.4rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .co-input {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #e8eaf0;
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }
    .co-input:focus { border-color: #F5C518; }
    .co-input.invalid { border-color: #e74c3c; }
    .co-input::placeholder { color: rgba(255,255,255,.2); }
    select.co-input option { background: #0a1e2e; color: #e8eaf0; }
    .co-row { display: flex; gap: 0.75rem; }
    .co-error {
      display: none;
      color: #f87171;
      font-size: 0.75rem;
      margin-top: 0.35rem;
    }
    .co-error.show { display: block; }

    /* Same-as-billing */
    .co-same-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      font-size: 0.9rem;
      color: rgba(255,255,255,.7);
      margin-bottom: 1rem;
    }
    .co-same-label input[type="checkbox"] {
      width: 16px; height: 16px;
      cursor: pointer;
      accent-color: #F5C518;
      flex-shrink: 0;
    }

    /* ── Submit button ── */
    .co-submit {
      width: 100%;
      background: #F5C518;
      color: #07151f;
      border: none;
      border-radius: 10px;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: background 0.2s, opacity 0.2s;
    }
    .co-submit:hover:not(:disabled) { background: #ffd700; }
    .co-submit:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Order summary (right column) ── */
    .co-summary { position: sticky; top: 1.5rem; }
    .co-thumbs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 1.25rem;
    }
    .co-thumb-wrap {
      position: relative;
      width: 62px; height: 62px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .co-thumb {
      width: 100%; height: 100%;
      border-radius: 8px;
      object-fit: cover;
      background: #071827;
      display: block;
    }
    .co-thumb-wrap .watermark {
      position: absolute; inset: 0; z-index: 3;
      pointer-events: none;
      background-image: url('/static/watermark-transparent.png'), url('/static/watermark-transparent.png'), url('/static/watermark-transparent.png');
      background-size: 60%, 42%, 38%;
      background-position: center, 12% 18%, 88% 82%;
      background-repeat: no-repeat, no-repeat, no-repeat;
      opacity: 0.3;
    }
    .co-thumb-more {
      width: 62px; height: 62px;
      border-radius: 8px;
      background: rgba(255,255,255,.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255,255,255,.4);
      border: 1px solid rgba(255,255,255,.1);
    }

    /* Line items */
    .co-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0.55rem 0;
      border-bottom: 1px solid rgba(255,255,255,.07);
      font-size: 0.88rem;
    }
    .co-item:last-of-type { border-bottom: none; }
    .co-item-name { color: rgba(255,255,255,.8); flex: 1; padding-right: 1rem; }
    .co-item-sub { font-size: 0.75rem; color: rgba(255,255,255,.35); margin-top: 2px; }
    .co-item-price { font-weight: 700; color: #F5C518; white-space: nowrap; }

    /* Coupon */
    .co-coupon-row { display: flex; gap: 0.5rem; margin-top: 1.25rem; }
    .co-coupon-input {
      flex: 1;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      font-size: 0.88rem;
      font-family: 'DM Sans', sans-serif;
      color: #e8eaf0;
      outline: none;
      letter-spacing: 1px;
      transition: border-color 0.2s;
    }
    .co-coupon-input::placeholder { color: rgba(255,255,255,.2); }
    .co-coupon-input:focus { border-color: #F5C518; }
    .co-coupon-btn {
      background: rgba(245,197,24,.12);
      border: 1px solid rgba(245,197,24,.35);
      color: #F5C518;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .co-coupon-btn:hover { background: rgba(245,197,24,.25); }
    #co-coupon-feedback { font-size: 0.78rem; margin-top: 0.4rem; }
    #co-coupon-feedback.success { color: #4ade80; }
    #co-coupon-feedback.error   { color: #f87171; }

    /* Totals */
    .co-totals { margin-top: 1.25rem; border-top: 1px solid rgba(255,255,255,.12); padding-top: 1rem; }
    .co-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      color: rgba(255,255,255,.45);
      padding: 0.3rem 0;
    }
    .co-total-row .amt { font-weight: 600; color: rgba(255,255,255,.8); }
    .co-total-row.discount .amt { color: #4ade80; }
    .co-total-row.free-ship .amt { color: #4ade80; }
    .co-total-row.co-total-saved { margin-top: .5rem; padding-top: .5rem; border-top: 1px solid rgba(255,255,255,.08); font-size: .85rem; opacity: .8; }
    .co-total-row.co-total-saved .amt { color: #4ade80; }
    .co-total-final {
      display: flex;
      justify-content: space-between;
      font-size: 1rem;
      font-weight: 700;
      color: #e8eaf0;
      padding-top: 0.75rem;
      margin-top: 0.5rem;
      border-top: 1px solid rgba(255,255,255,.2);
    }
    .co-total-final .amt { font-size: 1.2rem; color: #F5C518; }
    .co-tax-note {
      font-size: 0.72rem;
      color: rgba(255,255,255,.25);
      text-align: right;
      margin-top: 0.5rem;
    }

    /* Mobile summary toggle */
    .co-summary-toggle {
      display: none;
      background: #07151f;
      border: 1px solid rgba(255,255,255,.1);
      color: #fff;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      margin-bottom: 1.25rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      justify-content: space-between;
      align-items: center;
    }
    .co-summary-toggle .amt { color: #F5C518; }

    /* Empty / error state */
    .co-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: rgba(255,255,255,.35);
    }
    .co-empty a { color: #F5C518; font-weight: 600; text-decoration: none; }

    /* Responsive */
    @media (max-width: 768px) {
      .co-page {
        grid-template-columns: 1fr;
        padding: 1.25rem 1rem 3rem;
        gap: 0;
      }
      .co-page h1 { font-size: 1.3rem; margin-bottom: 1rem; }
      .co-summary { position: static; order: -1; }
      .co-summary-toggle { display: flex; }
      .co-summary-inner { display: none; }
      .co-summary-inner.open { display: block; }
      .co-row { flex-direction: column; gap: 0; }
      .co-field[style*="flex:0 0"] { flex: 1 !important; max-width: 100% !important; }
    }
  </style>
<link rel="stylesheet" href="/static/theme-frontend.css">
</head>

<script>
// ── Cart state ───────────────────────────────────────────────────────────────
let cartData      = null;
let appliedCoupon = null;
let globalCombos     = [];     // combo deals loaded from /api/pricing
let _lastBundleSavings = 0;    // set in renderSummary, read by placeOrder
let globalActivityGroups = {};  // {groupName: [location, ...]} for bundle matching

let PRINT_SHIPPING = [8, 8, 13, 13];
let FRAME_SHIPPING = [15, 15, 25, 50];
let FREE_SHIP_THRESHOLD = 3;

function calcPriceFor(count, pricing) {
  if (!pricing || !pricing.tiers || count === 0) return 0;
  const tiers      = pricing.tiers;
  const allTier    = tiers.find(t => t.count === 'all');
  const maxTiers   = tiers.filter(t => t.max).sort((a, b) => a.count - b.count);
  const singleTier = tiers.find(t => t.count === 1);
  const singleUnit = singleTier ? singleTier.price : 25;
  let best = count * singleUnit;
  const bundles = tiers
    .filter(t => !t.max && typeof t.count === 'number' && t.count > 1 && t.count <= count)
    .sort((a, b) => b.count - a.count);
  for (const tier of bundles) {
    const cost = Math.floor(count / tier.count) * tier.price + (count % tier.count) * singleUnit;
    if (cost < best) best = cost;
  }
  if (maxTiers.length) {
    const cap = maxTiers.find(t => count <= t.count);
    if (cap && cap.price < best) best = cap.price;
  } else if (allTier && best > allTier.price) {
    best = allTier.price;
  }
  return best;
}

function calcShipping(prints, frames) {
  const framed   = prints.filter(p => p.frame && p.frame !== 'No Frame');
  const unframed = prints.filter(p => !p.frame || p.frame === 'No Frame');
  const frameRates = [
    ...framed.map(p => FRAME_SHIPPING[p.sizeIdx || 0]),
    ...frames.flatMap(f => Array(f.quantity || 1).fill(FRAME_SHIPPING[f.sizeIdx || 0])),
  ].sort((a,b) => b-a);
  if (frameRates.length) return frameRates[0] + frameRates.slice(1).reduce((s,r) => s + r*0.5, 0);
  if (unframed.length >= FREE_SHIP_THRESHOLD) return 0;
  if (unframed.length) return Math.max(...unframed.map(p => PRINT_SHIPPING[p.sizeIdx || 0]));
  return 0;
}

// ── Load cart from localStorage ──────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  // Wire up back link
  try {
    const raw = localStorage.getItem('ci_checkout_cart');
    if (raw) {
      const d = JSON.parse(raw);
      if (d.returnUrl) document.getElementById('back-link').href = d.returnUrl;
    }
  } catch(e) {}

  try {
    const raw = localStorage.getItem('ci_checkout_cart');
    if (!raw) { showEmpty(); return; }
    cartData = JSON.parse(raw);
    const hasPortrait = cartData.portrait_poses?.length || cartData.portrait_singles?.length;
    if (!cartData || (!hasPortrait && !Object.keys(cartData.folderCarts || {}).length &&
        !cartData.printCart?.length && !cartData.frameCart?.length)) {
      showEmpty(); return;
    }
  } catch(e) { showEmpty(); return; }

  // Show shipping card if prints or frames
  const allPrints = getAllPrints();
  const frames    = cartData.frameCart || [];
  if (allPrints.length > 0 || frames.length > 0) {
    document.getElementById('shipping-card').style.display = 'block';
  }

  // Load print shipping rates + combo deals in parallel
  fetch('/api/print-pricing').then(r=>r.json()).then(pp => {
    if (pp.sizes?.length) {
      PRINT_SHIPPING = pp.sizes.map(s => s.ship_print ?? 8);
      FRAME_SHIPPING = pp.sizes.map(s => s.ship_framed ?? 15);
    }
    if (pp.free_ship_threshold) FREE_SHIP_THRESHOLD = pp.free_ship_threshold;
    renderSummary();
  }).catch(()=>{});
  fetch('/api/pricing').then(r => r.json()).then(d => {
    if (d.combos) globalCombos = d.combos;
    if (d.activity_groups) globalActivityGroups = d.activity_groups;
    renderSummary();
    checkBundleUpsell();
  }).catch(() => {});
  if (cartData.portrait_poses?.length || cartData.portrait_singles?.length) {
    fetch('/api/portrait-pricing').then(r=>r.json()).then(pp => {
      window._coPortraitPricing = pp; renderSummary();
    }).catch(() => {});
  }

  // Open summary on desktop
  document.getElementById('summary-inner').classList.add('open');

  renderSummary();
  loadThumbs();
  validateForm();
});

function showEmpty() {
  document.querySelector('.co-form-col').innerHTML = `
    <div class="co-empty">
      <p style="font-size:1.1rem;margin-bottom:1rem;">Your cart is empty.</p>
      <a href="/">← Back to photos</a>
    </div>`;
  document.querySelector('.co-summary').style.display = 'none';

function getAllDigital() {
  const photos = [];
  const fc = cartData.folderCarts || {};
  Object.values(fc).forEach(f => { if (f.selectedPhotos) photos.push(...f.selectedPhotos); });
  return photos;
}

function getAllPrints() {
  const prints = [];
  const fc = cartData.folderCarts || {};
  Object.values(fc).forEach(f => { if (f.printCart) prints.push(...f.printCart); });
  if (cartData.printCart) prints.push(...cartData.printCart);
  // Deduplicate by filename+size
  const seen = new Set();
  return prints.filter(p => {
    const key = p.filename + p.size;
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });
}

// ── Thumbnails ───────────────────────────────────────────────────────────────
async function loadThumbs() {
  const digital = getAllDigital();
  const prints  = getAllPrints();
  const allPhotos = [...digital, ...prints.map(p => ({ path: p.path || p.photoPath }))];
  const show = allPhotos.slice(0, 5);
  const extra = allPhotos.length - show.length;
  const container = document.getElementById('co-thumbs');
  container.innerHTML = '';

  for (const p of show) {
    if (!p?.path) continue;
    const wrap = document.createElement('div');
    wrap.className = 'co-thumb-wrap';
    const img = document.createElement('img');
    img.className = 'co-thumb';
    img.alt = '';
    try {
      const resp = await fetch(`/api/photo?path=${encodeURIComponent(p.path)}&size=thumb`);
      const blob = await resp.blob();
      img.src = URL.createObjectURL(blob);
    } catch(e) { img.src = ''; }
    const wm = document.createElement('div');
    wm.className = 'watermark';
    wrap.appendChild(img);
    wrap.appendChild(wm);
    container.appendChild(wrap);
  }
  if (extra > 0) {
    const more = document.createElement('div');
    more.className = 'co-thumb-more';
    more.textContent = `+${extra}`;
    container.appendChild(more);
  }
}

// ── Shared combo price helper ─────────────────────────────────────────────
// Returns {folderKey -> adjustedPrice} when a combo deal is active, else {}.
function _comboGroupFolders(fc, groups) {
  // For each group name, find folder keys whose location belongs to that group.
  // globalActivityGroups maps category names to their acts (individual location names).
  const result = {};
  for (const g of groups) {
    const gLocs = new Set((globalActivityGroups[g] || []).map(l => l.toLowerCase()));
    result[g] = Object.entries(fc)
      .filter(([, f]) => (f.selectedPhotos?.length || 0) > 0 && gLocs.has((f.location || '').toLowerCase()))
      .map(([k]) => k);
  }
  return result;
}

// Returns true if a group corresponds to portrait activities (portraits live in cartData, not folderCarts)
function _isPortraitGroup(g) {
  const acts = globalActivityGroups[g] || [];
  return g.toLowerCase().includes('portrait') || acts.some(a => a.toLowerCase().includes('portrait'));
}

// Returns true if a group has content — folder entries in folderCarts OR portrait data for portrait groups
function _groupPresent(g, groupFolders) {
  if (groupFolders[g]?.length) return true;
  if (_isPortraitGroup(g)) {
    return (cartData?.portrait_poses?.length || 0) > 0 || (cartData?.portrait_singles?.length || 0) > 0;
  }
  return false;
}

// Returns the active bundle's pct_off, or 0 if no bundle is fully satisfied
function calcComboPctOff(fc) {
  for (const combo of globalCombos) {
    const groups = combo.activity_groups || [];
    const pctOff = combo.pct_off;
    if (!groups.length || pctOff == null) continue;
    const gf = _comboGroupFolders(fc, groups);
    if (groups.every(g => _groupPresent(g, gf))) return pctOff;
  }
  return 0;
}

function calcComboAdjPrices(fc) {
  const comboAdjPrices = {};
  for (const combo of globalCombos) {
    const groups = combo.activity_groups || [];
    const pctOff = combo.pct_off;

    if (groups.length && pctOff != null) {
      // New format: activity_groups + pct_off
      const groupFolders = _comboGroupFolders(fc, groups);
      if (!groups.every(g => _groupPresent(g, groupFolders))) continue;
      groups.forEach(g => {
        groupFolders[g].forEach(k => {
          const n = fc[k].selectedPhotos?.length || 0;
          const base = calcPriceFor(n, fc[k].pricing);
          comboAdjPrices[k] = Math.round(base * (1 - pctOff / 100) * 100) / 100;
        });
      });
      break;
    }

    // Legacy format: locations + flat price
    const locs = combo.locations || [];
    const minEach = combo.min_each || 1;
    if (!locs.length || combo.price == null) continue;
    const locCounts = {}, comboKeys = [];
    Object.entries(fc).forEach(([key, folder]) => {
      const n = folder.selectedPhotos?.length || 0;
      const loc = folder.location || '';
      if (n && locs.includes(loc)) { locCounts[loc] = (locCounts[loc] || 0) + n; comboKeys.push(key); }
    });
    if (comboKeys.length && locs.every(loc => (locCounts[loc] || 0) >= minEach)) {
      const share = Math.round((combo.price / comboKeys.length) * 100) / 100;
      comboKeys.forEach((k, i) => {
        comboAdjPrices[k] = i === comboKeys.length - 1
          ? Math.round((combo.price - share * (comboKeys.length - 1)) * 100) / 100 : share;
      });
      break;
    }
  }
  return comboAdjPrices;
}

// ── Render summary ───────────────────────────────────────────────────────────
function renderSummary() {
  const fc      = cartData.folderCarts || {};
  const frames  = cartData.frameCart || [];
  const prints  = getAllPrints();

  let itemsHtml    = '';
  let digTotal     = 0;
  let printTotal   = 0;
  let frameTotal   = 0;
  let bundleSavings = 0;

  // ── Portrait pose items ───────────────────────────────────────────────────
  const posePricing = window._coPortraitPricing || { single_photo: 40, pose_tiers: [65, 57.5, 50] };
  const poseTiers   = posePricing.pose_tiers || [65, 57.5, 50];
  const poses       = cartData.portrait_poses   || [];
  const pSingles    = cartData.portrait_singles || [];
  const comboPct    = calcComboPctOff(fc);
  if (poses.length || pSingles.length) {
    const basePosePrice = poses.length ? poseTiers[Math.min(poses.length - 1, poseTiers.length - 1)] : 0;
    const baseSingPrice = posePricing.single_photo ?? 40;
    const posePrice = comboPct ? Math.round(basePosePrice * (1 - comboPct / 100) * 100) / 100 : basePosePrice;
    const singPrice = comboPct ? Math.round(baseSingPrice * (1 - comboPct / 100) * 100) / 100 : baseSingPrice;
    bundleSavings += (basePosePrice - posePrice) * poses.length + (baseSingPrice - singPrice) * pSingles.length;
    poses.forEach(pose => {
      const n = pose.files?.length || 0;
      const price = posePrice;
      digTotal += price;
      itemsHtml += `<div class="co-item">
        <div class="co-item-name">Portrait ${pose.pose_label} (${n} photo${n !== 1 ? 's' : ''}) — ${pose.family || ''}
        </div>
        <div class="co-item-price">$${price.toFixed(2)}</div>
      </div>`;
    });
    pSingles.forEach(s => {
      digTotal += singPrice;
      itemsHtml += `<div class="co-item">
        <div class="co-item-name">Portrait Single Photo — ${s.family || ''}
          <div class="co-item-sub">${s.filename || ''}</div>
        </div>
        <div class="co-item-price">$${singPrice.toFixed(2)}</div>
      </div>`;
    });
    const allLogoPaths = new Set(cartData.digitalLogoPaths || []);
    // Build path→filename map for portrait photos
    const posePathToName = {};
    poses.forEach(pose => (pose.paths || []).forEach((path, i) => { posePathToName[path] = (pose.files || [])[i] || path.split('/').pop(); }));
    pSingles.forEach(s => { if (s.path) posePathToName[s.path] = s.path.split('/').pop(); });
    const pLogoEntries = Object.keys(posePathToName).filter(p => allLogoPaths.has(p));
    if (pLogoEntries.length > 0) {
      const pLogoBase = pLogoEntries.length * 2;
      const pLogoFee = comboPct > 0 ? Math.round(pLogoBase * (1 - comboPct / 100) * 100) / 100 : pLogoBase;
      bundleSavings += pLogoBase - pLogoFee;
      digTotal += pLogoFee;
      itemsHtml += `<div class="co-item">
        <div class="co-item-name">Digital logo add-on
          <div class="co-item-sub">${pLogoEntries.map(p => posePathToName[p]).join(', ')}</div>
        </div>
        <div class="co-item-price">$${pLogoFee.toFixed(2)}</div>
      </div>`;
    }
  }

  // ── Pre-calculate combo adjusted prices ──────────────────────────────────
  const comboAdjPrices = calcComboAdjPrices(fc);

  // Digital folders
  const allLogoPaths = new Set(cartData.digitalLogoPaths || []);
  const folderPhotoPaths = new Set(Object.values(fc).flatMap(f => (f.selectedPhotos || []).map(p => p.path)));
  const aLogoCount = [...allLogoPaths].filter(p => folderPhotoPaths.has(p)).length;
  const aLogoBase = aLogoCount * 2;
  const aLogoFeeDsc = comboPct > 0 ? Math.round(aLogoBase * (1 - comboPct / 100) * 100) / 100 : aLogoBase;
  if (aLogoCount > 0) { digTotal += aLogoFeeDsc; bundleSavings += aLogoBase - aLogoFeeDsc; }
  Object.entries(fc).forEach(([key, folder]) => {
    const n = folder.selectedPhotos?.length || 0;
    if (!n) return;
    const basePrice = calcPriceFor(n, folder.pricing);
    const price = comboAdjPrices.hasOwnProperty(key) ? comboAdjPrices[key] : basePrice;
    if (comboAdjPrices.hasOwnProperty(key)) bundleSavings += basePrice - price;
    digTotal += price;
    const label = folder.selectedPhotos?.[0]?.last_name || folder.location || 'Photos';
    itemsHtml += `<div class="co-item">
      <div class="co-item-name">Digital Photos — ${label}
        <div class="co-item-sub">${n} photo${n !== 1 ? 's' : ''}</div>
      </div>
      <div class="co-item-price">$${price.toFixed(2)}</div>
    </div>`;
  });
  if (aLogoCount > 0) {
    // Build filename list for action logo photos
    const actionPathToName = {};
    Object.values(fc).forEach(folder => (folder.selectedPhotos || []).forEach(p => { actionPathToName[p.path] = p.filename || p.path.split('/').pop(); }));
    const aLogoNames = [...allLogoPaths].filter(p => folderPhotoPaths.has(p)).map(p => actionPathToName[p] || p.split('/').pop());
    itemsHtml += `<div class="co-item">
      <div class="co-item-name">Digital logo add-on
        <div class="co-item-sub">${aLogoNames.join(', ')}</div>
      </div>
      <div class="co-item-price">$${aLogoFeeDsc.toFixed(2)}</div>
    </div>`;
  }

  // Prints
  prints.forEach(p => {
    const baseTotal = (p.price || 0) + (p.framePrice || 0);
    const total = comboPct > 0 ? Math.round(baseTotal * (1 - comboPct / 100) * 100) / 100 : baseTotal;
    bundleSavings += baseTotal - total;
    printTotal += total;
    const frameLabel = p.frame && p.frame !== 'No Frame' ? ` + ${p.frame}` : '';
    const logoLabel = p._logo ? ' + Logo' : '';
    itemsHtml += `<div class="co-item">
      <div class="co-item-name">${p.size} Print${frameLabel}${logoLabel}
        <div class="co-item-sub">${p.filename}</div>
      </div>
      <div class="co-item-price">$${total.toFixed(2)}</div>
    </div>`;
  });

  // Frames
  frames.forEach(f => {
    const baseTotal = (f.price || 0) * (f.quantity || 1);
    const total = comboPct > 0 ? Math.round(baseTotal * (1 - comboPct / 100) * 100) / 100 : baseTotal;
    bundleSavings += baseTotal - total;
    frameTotal += total;
    itemsHtml += `<div class="co-item">
      <div class="co-item-name">${f.size} Frame (${f.orientation}) ×${f.quantity}</div>
      <div class="co-item-price">$${total.toFixed(2)}</div>
    </div>`;
  });

  document.getElementById('co-items').innerHTML = itemsHtml;

  // Totals
  const subtotal = digTotal + printTotal + frameTotal;
  const shipping = calcShipping(prints, frames);
  const unframed = prints.filter(p => !p.frame || p.frame === 'No Frame');
  const freeShip = unframed.length >= 3 && !prints.some(p => p.frame && p.frame !== 'No Frame');

  const bundleActive = Object.keys(comboAdjPrices).length > 0 || comboPct > 0;
  if (bundleActive) _lastBundleSavings = Math.round(bundleSavings * 100) / 100;
  let discountAmt = 0;
  if (appliedCoupon && !bundleActive) {
    const at = appliedCoupon.applies_to || 'all';
    const discountBase = at === 'digital' || at === 'portraits' ? digTotal
                       : at === 'prints'  ? printTotal
                       : at === 'frames'  ? frameTotal
                       : subtotal; // 'all' or free_shipping
    discountAmt = appliedCoupon.discount_type === 'percent'
      ? Math.round(discountBase * (appliedCoupon.amount / 100) * 100) / 100
      : Math.min(appliedCoupon.amount, discountBase);
    discountAmt = Math.round(discountAmt * 100) / 100;
  }

  const grandTotal = Math.max(0, subtotal + shipping - discountAmt);

  let totalsHtml = '';
  const showSub = shipping > 0 || freeShip || discountAmt > 0 || bundleActive;
  if (showSub) {
    totalsHtml += `<div class="co-total-row"><span>Subtotal</span><span class="amt">$${subtotal.toFixed(2)}</span></div>`;
  }
  if (shipping > 0) {
    totalsHtml += `<div class="co-total-row"><span>Shipping</span><span class="amt">$${shipping.toFixed(2)}</span></div>`;
  } else if (freeShip) {
    totalsHtml += `<div class="co-total-row free-ship"><span>Shipping</span><span class="amt">Free</span></div>`;
  }
  if (discountAmt > 0) {
    totalsHtml += `<div class="co-total-row discount"><span>Coupon (${appliedCoupon.code.toUpperCase()})</span><span class="amt">-$${discountAmt.toFixed(2)}</span></div>`;
  }
  totalsHtml += `<div class="co-total-final"><span>Total</span><span class="amt">$${grandTotal.toFixed(2)}</span></div>`;
  if (bundleActive && bundleSavings > 0) {
    totalsHtml += `<div class="co-total-row co-total-saved"><span>Total saved</span><span class="amt">$${bundleSavings.toFixed(2)}</span></div>`;
  }

  document.getElementById('co-totals').innerHTML = totalsHtml;
  document.getElementById('mobile-total').textContent = `$${grandTotal.toFixed(2)}`;
}

// ── Coupon ───────────────────────────────────────────────────────────────────
async function applyCoupon() {
  const input    = document.getElementById('co-coupon-input');
  const btn      = document.getElementById('co-coupon-btn');
  const feedback = document.getElementById('co-coupon-feedback');
  const code     = input.value.trim();
  if (!code) return;

  btn.disabled    = true;
  btn.textContent = 'Checking…';
  feedback.className   = '';
  feedback.textContent = '';

  try {
    const resp = await fetch(`/api/validate-coupon?code=${encodeURIComponent(code)}`);
    const data = await resp.json();
    if (!resp.ok || !data.valid) {
      feedback.textContent = data.error || 'Invalid coupon code';
      feedback.className   = 'error';
      appliedCoupon = null;
      btn.disabled    = false;
      btn.textContent = 'Apply';
    } else {
      appliedCoupon   = data;
      input.value     = data.code.toUpperCase();
      input.disabled  = true;
      btn.disabled    = false;
      btn.textContent = 'Remove';
      btn.onclick     = removeCoupon;
      const label = data.discount_type === 'percent'
        ? `✓ ${data.amount}% off applied`
        : `✓ $${data.amount.toFixed(2)} off applied`;
      feedback.textContent = label;
      feedback.className   = 'success';
      renderSummary();
    }
  } catch(e) {
    feedback.textContent = 'Could not verify — try again.';
    feedback.className   = 'error';
    appliedCoupon = null;
    btn.disabled    = false;
    btn.textContent = 'Apply';
  }
}

function removeCoupon() {
  appliedCoupon = null;
  const input    = document.getElementById('co-coupon-input');
  const btn      = document.getElementById('co-coupon-btn');
  const feedback = document.getElementById('co-coupon-feedback');
  input.value    = '';
  input.disabled = false;
  btn.textContent = 'Apply';
  btn.onclick     = applyCoupon;
  btn.disabled    = false;
  feedback.className    = '';
  feedback.textContent  = '';
  renderSummary();
}

function validateForm() {
  const email      = document.getElementById('co-email')?.value.trim() || '';
  const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

  const billIds = ['bill-first','bill-last','bill-address','bill-city','bill-state','bill-zip'];
  const billValid = billIds.every(id => (document.getElementById(id)?.value.trim() || '') !== '');

  const shipCard = document.getElementById('shipping-card');
  const needsShip = shipCard && shipCard.style.display !== 'none';
  const shipSame  = document.getElementById('ship-same')?.checked ?? true;
  let shipValid   = true;
  if (needsShip && !shipSame) {
    const shipIds = ['ship-first','ship-last','ship-address','ship-city','ship-state','ship-zip'];
    shipValid = shipIds.every(id => (document.getElementById(id)?.value.trim() || '') !== '');
  }

  const valid = emailValid && billValid && shipValid;
  const btn   = document.getElementById('co-submit-btn');
  btn.disabled      = !valid;
}

// ── Bundle upsell notice ──────────────────────────────────────────────────────
function checkBundleUpsell() {
  const el = document.getElementById('bundle-upsell');
  if (!el || !globalCombos.length) return;
  const fc = cartData?.folderCarts || {};
  for (const combo of globalCombos) {
    const groups = combo.activity_groups || [];
    const pctOff = combo.pct_off;
    if (!groups.length || pctOff == null) continue;
    const groupFolders = _comboGroupFolders(fc, groups);
    const present = groups.filter(g => _groupPresent(g, groupFolders));
    const missing = groups.filter(g => !_groupPresent(g, groupFolders));
    if (present.length > 0 && missing.length > 0) {
      const _displayName = g => g.replace(/^(Winter|Summer|Fall|Spring|Autumn)\s+/i, '');
      const missingLabel = missing.map(_displayName).join(' or ');
      const msg = `Did you get any <strong>${missingLabel}</strong> photos taken?<br>
        Add them to your cart and receive <strong>${pctOff}% off your order!</strong><br>
        <span style="font-size:.82em;opacity:.65">Cannot be combined with discount codes.</span>`;
      document.getElementById('bundle-upsell-msg').innerHTML = msg;
      const backLink = document.getElementById('bundle-upsell-back');
      if (backLink) backLink.href = cartData.returnUrl || '/';
      el.style.display = 'flex';
      return;
    }
  }
}
function dismissBundleUpsell() {
  const el = document.getElementById('bundle-upsell');
  if (el) el.style.display = 'none';
}

// ── Place Order ──────────────────────────────────────────────────────────────
async function placeOrder() {
  const btn = document.getElementById('co-submit-btn');
  btn.textContent = 'Processing…';
  btn.disabled    = true;

  const email = document.getElementById('co-email').value.trim();
  const billing = {
    first_name: document.getElementById('bill-first').value.trim(),
    last_name:  document.getElementById('bill-last').value.trim(),
    address_1:  document.getElementById('bill-address').value.trim(),
    address_2:  document.getElementById('bill-address2')?.value.trim() || '',
    city:       document.getElementById('bill-city').value.trim(),
    state:      document.getElementById('bill-state').value.trim(),
    postcode:   document.getElementById('bill-zip').value.trim(),
    country:    'US',
    email:      email,
  };

  const shipSame = document.getElementById('ship-same')?.checked ?? true;
  const shipping = shipSame ? { ...billing } : {
    first_name: document.getElementById('ship-first').value.trim(),
    last_name:  document.getElementById('ship-last').value.trim(),
    address_1:  document.getElementById('ship-address').value.trim(),
    address_2:  document.getElementById('ship-address2')?.value.trim() || '',
    city:       document.getElementById('ship-city').value.trim(),
    state:      document.getElementById('ship-state').value.trim(),
    postcode:   document.getElementById('ship-zip').value.trim(),
    country:    'US',
  };

  // Build payload
  const fc      = cartData.folderCarts || {};
  const frames  = cartData.frameCart || [];
  const prints  = getAllPrints();

  const allDigital = getAllDigital();
  const comboAdj   = calcComboAdjPrices(fc);
  let digPrice = 0;
  Object.entries(fc).forEach(([key, f]) => {
    const n = f.selectedPhotos?.length || 0;
    digPrice += comboAdj.hasOwnProperty(key)
      ? comboAdj[key]
      : calcPriceFor(n, f.pricing);
  });

  const loc      = cartData.location || allDigital[0]?.location || prints[0]?.location || '';
  const date     = cartData.date     || allDigital[0]?.date     || prints[0]?.date     || '';
  const lastName = cartData.family   || allDigital[0]?.last_name || '';

  // Coupon discount — bundle and coupon are mutually exclusive; bundle takes priority
  const comboPctOff  = calcComboPctOff(fc);
  const bundleActive2 = Object.keys(comboAdj).length > 0 || comboPctOff > 0;
  const printTotal2 = prints.reduce((s,p) => s+(p.price||0), 0);
  const frameTotal2 = prints.reduce((s,p) => s+(p.framePrice||0), 0) + frames.reduce((s,f) => s+(f.price||0)*(f.quantity||1), 0);
  const subtotal    = digPrice + printTotal2 + frameTotal2;
  let discountAmt   = 0;
  if (appliedCoupon && !bundleActive2) {
    const at2 = appliedCoupon.applies_to || 'all';
    const discountBase2 = at2 === 'digital' || at2 === 'portraits' ? digPrice
                        : at2 === 'prints'  ? printTotal2
                        : at2 === 'frames'  ? frameTotal2
                        : subtotal;
    discountAmt = appliedCoupon.discount_type === 'percent'
      ? Math.round(discountBase2 * (appliedCoupon.amount / 100) * 100) / 100
      : Math.min(appliedCoupon.amount, discountBase2);
    discountAmt = Math.round(discountAmt * 100) / 100;
  }

  // Build per-album digital data for separate line items
  const digitalAlbums = [];
  Object.entries(fc).forEach(([key, folder]) => {
    const n = folder.selectedPhotos?.length || 0;
    if (!n) return;
    const price = calcPriceFor(n, folder.pricing);
    const label = folder.selectedPhotos?.[0]?.last_name || folder.location || 'Photos';
    digitalAlbums.push({
      last_name: label,
      location:  folder.location || '',
      count:     n,
      price:     price,
      filenames: folder.selectedPhotos.map(p => p.filename),
      paths:     folder.selectedPhotos.map(p => p.path),
    });
  });

  const payload = {
    portrait_poses:    cartData.portrait_poses   || [],
    portrait_singles:  cartData.portrait_singles || [],
    digital_albums:    digitalAlbums,
    digital_filenames: allDigital.map(p => p.filename),
    digital_paths:     allDigital.map(p => p.path),
    prints: prints.map(p => {
      const disc = comboPctOff > 0 ? 1 - comboPctOff / 100 : 1;
      return {
        filename:    p.filename,
        size:        p.size,
        size_idx:    p.sizeIdx || 0,
        orientation: p.orientation || 'landscape',
        price:       Math.round((p.price || 0) * disc * 100) / 100,
        frame:       p.frame || '',
        frame_price: Math.round((p.framePrice || 0) * disc * 100) / 100,
      };
    }),
    frames: frames.map(f => ({
      variation_id: f.variation_id,
      size:         f.size,
      sizeIdx:      f.sizeIdx || 0,
      orientation:  f.orientation,
      price:        comboPctOff > 0 ? Math.round((f.price || 0) * (1 - comboPctOff / 100) * 100) / 100 : (f.price || 0),
      quantity:     f.quantity,
    })),
    location:        loc,
    date:            date,
    email:           email,
    last_name:       lastName,
    billing:         billing,
    shipping:        shipping,
    coupon_code:         appliedCoupon && !bundleActive2 ? appliedCoupon.code : '',
    coupon_discount:     discountAmt,
    bundle_discount_pct:    comboPctOff || 0,
    bundle_savings_amount:  comboPctOff > 0 ? _lastBundleSavings : 0,
  };

  try {
    const resp = await fetch('/api/checkout', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(payload),
    });
    const data = await resp.json();
    if (data.checkout_url) {
      localStorage.removeItem('ci_checkout_cart');
      localStorage.removeItem('bsp_cart_v1');
      window.location.href = data.checkout_url;
    } else {
      throw new Error(data.error || 'Unknown error');
    }
  } catch(e) {
    alert('Checkout failed — please try again.');
    btn.textContent = 'Continue to Payment →';
    btn.disabled    = false;
  }
}
</script>
</body>
</html>

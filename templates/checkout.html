<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Crystal Images</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #093A52;
      font-family: 'DM Sans', sans-serif;
      color: #e8eaf0;
      min-height: 100vh;
    }

    /* ── Header ── */
    .co-header {
      background: #062b3e;
      border-bottom: 1px solid rgba(255,255,255,.07);
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .co-logo {
      color: #F5C518;
      font-family: 'DM Sans', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;
    }
    .co-back {
      color: rgba(255,255,255,.5);
      font-size: 0.85rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.2s;
    }
    .co-back:hover { color: #fff; }

    /* ── Page layout ── */
    .co-page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 2rem;
      align-items: start;
    }
    .co-page h1 {
      font-family: 'DM Sans', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #F5C518;
      margin-bottom: 1.5rem;
      grid-column: 1 / -1;
    }

    /* ── Cards ── */
    .co-card {
      background: #093A53;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 1.75rem;
      margin-bottom: 1.25rem;
    }
    .co-card:last-child { margin-bottom: 0; }
    .co-card-title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,.35);
      margin-bottom: 1.25rem;
    }

    /* ── Form fields ── */
    .co-field { display: flex; flex-direction: column; flex: 1; margin-bottom: 1rem; }
    .co-field:last-child { margin-bottom: 0; }
    .co-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: rgba(255,255,255,.5);
      margin-bottom: 0.4rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .co-input {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #e8eaf0;
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }
    .co-input:focus { border-color: #F5C518; }
    .co-input.invalid { border-color: #e74c3c; }
    .co-input::placeholder { color: rgba(255,255,255,.2); }
    select.co-input option { background: #0a1e2e; color: #e8eaf0; }
    .co-row { display: flex; gap: 0.75rem; }
    .co-error {
      display: none;
      color: #f87171;
      font-size: 0.75rem;
      margin-top: 0.35rem;
    }
    .co-error.show { display: block; }

    /* Same-as-billing */
    .co-same-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      font-size: 0.9rem;
      color: rgba(255,255,255,.7);
      margin-bottom: 1rem;
    }
    .co-same-label input[type="checkbox"] {
      width: 16px; height: 16px;
      cursor: pointer;
      accent-color: #F5C518;
      flex-shrink: 0;
    }

    /* ── Submit button ── */
    .co-submit {
      width: 100%;
      background: #F5C518;
      color: #07151f;
      border: none;
      border-radius: 10px;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: background 0.2s, opacity 0.2s;
    }
    .co-submit:hover:not(:disabled) { background: #ffd700; }
    .co-submit:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Order summary (right column) ── */
    .co-summary { position: sticky; top: 1.5rem; }
    .co-thumbs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 1.25rem;
    }
    .co-thumb-wrap {
      position: relative;
      width: 62px; height: 62px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .co-thumb {
      width: 100%; height: 100%;
      border-radius: 8px;
      object-fit: cover;
      background: #071827;
      display: block;
    }
    .co-thumb-wrap .watermark {
      position: absolute; inset: 0; z-index: 3;
      pointer-events: none;
      background-image: url('/static/watermark-transparent.png'), url('/static/watermark-transparent.png'), url('/static/watermark-transparent.png');
      background-size: 60%, 42%, 38%;
      background-position: center, 12% 18%, 88% 82%;
      background-repeat: no-repeat, no-repeat, no-repeat;
      opacity: 0.3;
    }
    .co-thumb-more {
      width: 62px; height: 62px;
      border-radius: 8px;
      background: rgba(255,255,255,.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255,255,255,.4);
      border: 1px solid rgba(255,255,255,.1);
    }

    /* Line items */
    .co-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0.55rem 0;
      border-bottom: 1px solid rgba(255,255,255,.07);
      font-size: 0.88rem;
    }
    .co-item:last-of-type { border-bottom: none; }
    .co-item-name { color: rgba(255,255,255,.8); flex: 1; padding-right: 1rem; }
    .co-item-sub { font-size: 0.75rem; color: rgba(255,255,255,.35); margin-top: 2px; }
    .co-item-price { font-weight: 700; color: #F5C518; white-space: nowrap; }

    /* Coupon */
    .co-coupon-row { display: flex; gap: 0.5rem; margin-top: 1.25rem; }
    .co-coupon-input {
      flex: 1;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      font-size: 0.88rem;
      font-family: 'DM Sans', sans-serif;
      color: #e8eaf0;
      outline: none;
      letter-spacing: 1px;
      transition: border-color 0.2s;
    }
    .co-coupon-input::placeholder { color: rgba(255,255,255,.2); }
    .co-coupon-input:focus { border-color: #F5C518; }
    .co-coupon-btn {
      background: rgba(245,197,24,.12);
      border: 1px solid rgba(245,197,24,.35);
      color: #F5C518;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .co-coupon-btn:hover { background: rgba(245,197,24,.25); }
    #co-coupon-feedback { font-size: 0.78rem; margin-top: 0.4rem; }
    #co-coupon-feedback.success { color: #4ade80; }
    #co-coupon-feedback.error   { color: #f87171; }

    /* Totals */
    .co-totals { margin-top: 1.25rem; border-top: 1px solid rgba(255,255,255,.12); padding-top: 1rem; }
    .co-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      color: rgba(255,255,255,.45);
      padding: 0.3rem 0;
    }
    .co-total-row .amt { font-weight: 600; color: rgba(255,255,255,.8); }
    .co-total-row.discount .amt { color: #4ade80; }
    .co-total-row.free-ship .amt { color: #4ade80; }
    .co-total-row.co-total-saved { margin-top: .5rem; padding-top: .5rem; border-top: 1px solid rgba(255,255,255,.08); font-size: .85rem; opacity: .8; }
    .co-total-row.co-total-saved .amt { color: #4ade80; }
    .co-total-final {
      display: flex;
      justify-content: space-between;
      font-size: 1rem;
      font-weight: 700;
      color: #e8eaf0;
      padding-top: 0.75rem;
      margin-top: 0.5rem;
      border-top: 1px solid rgba(255,255,255,.2);
    }
    .co-total-final .amt { font-size: 1.2rem; color: #F5C518; }
    .co-tax-note {
      font-size: 0.72rem;
      color: rgba(255,255,255,.25);
      text-align: right;
      margin-top: 0.5rem;
    }

    /* Mobile summary toggle */
    .co-summary-toggle {
      display: none;
      background: #07151f;
      border: 1px solid rgba(255,255,255,.1);
      color: #fff;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      margin-bottom: 1.25rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      justify-content: space-between;
      align-items: center;
    }
    .co-summary-toggle .amt { color: #F5C518; }

    /* Empty / error state */
    .co-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: rgba(255,255,255,.35);
    }
    .co-empty a { color: #F5C518; font-weight: 600; text-decoration: none; }

    /* Responsive */
    @media (max-width: 768px) {
      .co-page {
        grid-template-columns: 1fr;
        padding: 1.25rem 1rem 3rem;
        gap: 0;
      }
      .co-page h1 { font-size: 1.3rem; margin-bottom: 1rem; }
      .co-summary { position: static; order: -1; }
      .co-summary-toggle { display: flex; }
      .co-summary-inner { display: none; }
      .co-summary-inner.open { display: block; }
      .co-row { flex-direction: column; gap: 0; }
      .co-field[style*="flex:0 0"] { flex: 1 !important; max-width: 100% !important; }
    }
  </style>
<link rel="stylesheet" href="/static/theme-frontend.css">
</head>

<header class="co-header">
  <a class="co-logo" href="/">Crystal Images</a>

<!-- ── Bundle upsell notice ── -->

    <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap">
      <a id="bundle-upsell-back" href="/" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.8);padding:.65rem 1.4rem;border-radius:8px;font-size:.9rem;font-weight:600;text-decoration:none;cursor:pointer">Continue Shopping</a>

<div class="co-page">
  <h1>Checkout</h1>

  <!-- ── LEFT: Form ── -->

    <!-- Billing -->

              <option>KY</option><option>LA</option><option>ME</option><option>MD</option>

              <option>MO</option><option>MT</option><option>NE</option><option>NV</option>
              <option>NH</option><option>NJ</option><option>NM</option><option>NY</option>
              <option>NC</option><option>ND</option><option>OH</option><option>OK</option>

<script>
// ── Cart state ───────────────────────────────────────────────────────────────
let cartData      = null;
let appliedCoupon = null;
let _quote        = null;   // the server's prices for this cart: exactly what checkout charges

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// ── Load cart from localStorage ──────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  // Wire up back link
  try {
    const raw = localStorage.getItem('ci_checkout_cart');
    if (raw) {
      const d = JSON.parse(raw);
      if (d.returnUrl) document.getElementById('back-link').href = d.returnUrl;
    }
  } catch(e) {}

  try {
    const raw = localStorage.getItem('ci_checkout_cart');
    if (!raw) { showEmpty(); return; }
    cartData = JSON.parse(raw);
    const hasPortrait = cartData.portrait_poses?.length || cartData.portrait_singles?.length;
    if (!cartData || (!hasPortrait && !Object.keys(cartData.folderCarts || {}).length &&
        !cartData.printCart?.length && !cartData.frameCart?.length)) {
      showEmpty(); return;
    }
  } catch(e) { showEmpty(); return; }

  // Show shipping card if prints or frames
  const allPrints = getAllPrints();
  const frames    = cartData.frameCart || [];
  if (allPrints.length > 0 || frames.length > 0) {
    document.getElementById('shipping-card').style.display = 'block';
  }

  // Open summary on desktop
  document.getElementById('summary-inner').classList.add('open');

  renderSummary();
  loadThumbs();
  validateForm();
});

function showEmpty() {
  document.querySelector('.co-form-col').innerHTML = `
    <div class="co-empty">
      <p style="font-size:1.1rem;margin-bottom:1rem;">Your cart is empty.</p>
      <a href="/">← Back to photos</a>
    </div>`;
  document.querySelector('.co-summary').style.display = 'none';
}

function getAllDigital() {
  const photos = [];
  const fc = cartData.folderCarts || {};
  Object.values(fc).forEach(f => { if (f.selectedPhotos) photos.push(...f.selectedPhotos); });
  return photos;
}

function getAllPrints() {
  const prints = [];
  const fc = cartData.folderCarts || {};
  Object.values(fc).forEach(f => {
    if (f.printCart) prints.push(...f.printCart.map(p => ({ ...p, location: p.location || f.location || '' })));
  });
  if (cartData.printCart) prints.push(...cartData.printCart.map(p => ({ ...p, location: p.location || cartData.location || '' })));
  // Deduplicate by filename+size
  const seen = new Set();
  return prints.filter(p => {
    const key = p.filename + p.size;
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });
}

// ── Thumbnails ───────────────────────────────────────────────────────────────
async function loadThumbs() {
  const digital = getAllDigital();
  const prints  = getAllPrints();
  const allPhotos = [...digital, ...prints.map(p => ({ path: p.path || p.photoPath }))];
  const show = allPhotos.slice(0, 5);
  const extra = allPhotos.length - show.length;
  const container = document.getElementById('co-thumbs');
  container.innerHTML = '';

  for (const p of show) {
    if (!p?.path) continue;
    const wrap = document.createElement('div');
    wrap.className = 'co-thumb-wrap';
    const img = document.createElement('img');
    img.className = 'co-thumb';
    img.alt = '';
    try {
      const resp = await fetch(`/api/photo?path=${encodeURIComponent(p.path)}&size=thumb`);
      const blob = await resp.blob();
      img.src = URL.createObjectURL(blob);
    } catch(e) { img.src = ''; }
    const wm = document.createElement('div');
    wm.className = 'watermark';
    wrap.appendChild(img);
    wrap.appendChild(wm);
    container.appendChild(wrap);
  }
  if (extra > 0) {
    const more = document.createElement('div');
    more.className = 'co-thumb-more';
    more.textContent = `+${extra}`;
    container.appendChild(more);
  }
}

// ── What's in the cart, for the server to price ───────────────────────────────
// Only what was picked is sent; every price, discount and bundle is the server's.
function buildOrderPayload() {
  const fc         = cartData.folderCarts || {};
  const allDigital = getAllDigital();
  const prints     = getAllPrints();
  const digitalAlbums = [];
  Object.values(fc).forEach(folder => {
    const n = folder.selectedPhotos?.length || 0;
    if (!n) return;
    digitalAlbums.push({
      last_name: folder.selectedPhotos?.[0]?.last_name || folder.location || 'Photos',
      location:  folder.location || '',
      date:      folder.date || folder.selectedPhotos?.[0]?.date || '',   // this folder's own date (its prices)
      count:     n,
      filenames: folder.selectedPhotos.map(p => p.filename),
      paths:     folder.selectedPhotos.map(p => p.path),
    });
  });
  return {
    portrait_poses:     cartData.portrait_poses   || [],
    portrait_singles:   cartData.portrait_singles || [],
    digital_albums:     digitalAlbums,
    digital_filenames:  allDigital.map(p => p.filename),
    digital_paths:      allDigital.map(p => p.path),
    digital_logo_paths: cartData.digitalLogoPaths || [],
    prints: prints.map(p => ({
      filename:    p.filename,
      size:        p.size,
      size_idx:    p.sizeIdx || 0,
      orientation: p.orientation || 'landscape',
      frame:       p.frame || '',
      path:        p.photoPath || p.path || '',
      location:    p.location || '',
      logo:        !!p._logo,
    })),
    frames: (cartData.frameCart || []).map(f => ({ variation_id: f.variation_id, quantity: f.quantity || 1 })),
    location:    cartData.location || allDigital[0]?.location || prints[0]?.location || '',
    date:        cartData.date     || allDigital[0]?.date     || '',
    last_name:   cartData.family   || allDigital[0]?.last_name || '',
    coupon_code: appliedCoupon ? appliedCoupon.code : '',
  };
}

// ── Render summary (the server's quote) ─────────────────────────────────────
let _quoteSeq = 0;
let _upsellShown = false;
async function renderSummary() {
  const seq      = ++_quoteSeq;
  const itemsEl  = document.getElementById('co-items');
  const totalsEl = document.getElementById('co-totals');
  if (!_quote) totalsEl.innerHTML = '<div class="co-total-row"><span>Working out your total…</span></div>';
  let q;
  try {
    const resp = await fetch('/api/checkout/quote', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ ...buildOrderPayload(), email: document.getElementById('co-email')?.value.trim() || '' }),
    });
    q = await resp.json();
    if (!resp.ok) throw new Error(q.error || 'Could not work out your total');
  } catch (e) {
    if (seq !== _quoteSeq) return;
    _quote = null;
    itemsEl.innerHTML  = '';
    totalsEl.innerHTML = `<div class="co-total-row" style="color:#f87171"><span>${escHtml(e.message)}</span></div>`;
    document.getElementById('mobile-total').textContent = '—';
    validateForm();
    return;
  }
  if (seq !== _quoteSeq) return;        // a newer quote is on its way
  _quote = q;

  itemsEl.innerHTML = q.rows.map(r => `<div class="co-item">
      <div class="co-item-name">${escHtml(r.name)}
        ${r.sub ? `<div class="co-item-sub">${escHtml(r.sub)}</div>` : ''}
      </div>
      <div class="co-item-price">${r.price < r.full ? `<s style="opacity:.45;font-weight:400;margin-right:.35rem">$${r.full.toFixed(2)}</s>` : ''}$${r.price.toFixed(2)}</div>
    </div>`).join('');

  let totalsHtml = '';
  if (q.shipping > 0 || q.free_shipping || q.coupon || q.bundle) {
    totalsHtml += `<div class="co-total-row"><span>Subtotal</span><span class="amt">$${q.subtotal.toFixed(2)}</span></div>`;
  }
  if (q.shipping > 0) {
    totalsHtml += `<div class="co-total-row"><span>Shipping</span><span class="amt">$${q.shipping.toFixed(2)}</span></div>`;
  } else if (q.free_shipping) {
    totalsHtml += `<div class="co-total-row free-ship"><span>Shipping</span><span class="amt">Free</span></div>`;
  }
  if (q.coupon && q.coupon.discount > 0) {
    totalsHtml += `<div class="co-total-row discount"><span>Coupon (${escHtml(q.coupon.code)})</span><span class="amt">-$${q.coupon.discount.toFixed(2)}</span></div>`;
  }
  totalsHtml += `<div class="co-total-final"><span>Total</span><span class="amt">$${q.total.toFixed(2)}</span></div>`;
  if (q.bundle) {
    totalsHtml += `<div class="co-total-row co-total-saved"><span>${escHtml(q.bundle.label)} (${q.bundle.pct}% off) saved</span><span class="amt">$${q.bundle.savings.toFixed(2)}</span></div>`;
  }
  totalsEl.innerHTML = totalsHtml;
  document.getElementById('mobile-total').textContent = `$${q.total.toFixed(2)}`;

  // A code that can't be used (or that a bundle beats) says why
  const feedback = document.getElementById('co-coupon-feedback');
  if (appliedCoupon && !q.coupon && q.coupon_note) {
    feedback.textContent = q.coupon_note;
    feedback.className   = 'error';
  }
  if (!_upsellShown && q.upsell) { _upsellShown = true; checkBundleUpsell(q.upsell); }
  validateForm();
}

// ── Coupon ───────────────────────────────────────────────────────────────────
async function applyCoupon() {
  const input    = document.getElementById('co-coupon-input');
  const btn      = document.getElementById('co-coupon-btn');
  const feedback = document.getElementById('co-coupon-feedback');
  const code     = input.value.trim();
  if (!code) return;

  btn.disabled    = true;
  btn.textContent = 'Checking…';
  feedback.className   = '';
  feedback.textContent = '';

  try {
    const resp = await fetch(`/api/validate-coupon?code=${encodeURIComponent(code)}`);
    const data = await resp.json();
    if (!resp.ok || !data.valid) {
      feedback.textContent = data.error || 'Invalid coupon code';
      feedback.className   = 'error';
      appliedCoupon = null;
      btn.disabled    = false;
      btn.textContent = 'Apply';
    } else {
      appliedCoupon   = data;
      input.value     = data.code.toUpperCase();
      input.disabled  = true;
      btn.disabled    = false;
      btn.textContent = 'Remove';
      btn.onclick     = removeCoupon;
      const label = data.discount_type === 'percent'
        ? `✓ ${data.amount}% off applied`
        : `✓ $${data.amount.toFixed(2)} off applied`;
      feedback.textContent = label;
      feedback.className   = 'success';
      renderSummary();
    }
  } catch(e) {
    feedback.textContent = 'Could not verify — try again.';
    feedback.className   = 'error';
    appliedCoupon = null;
    btn.disabled    = false;
    btn.textContent = 'Apply';
  }
}

function removeCoupon() {
  appliedCoupon = null;
  const input    = document.getElementById('co-coupon-input');
  const btn      = document.getElementById('co-coupon-btn');
  const feedback = document.getElementById('co-coupon-feedback');
  input.value    = '';
  input.disabled = false;
  btn.textContent = 'Apply';
  btn.onclick     = applyCoupon;
  btn.disabled    = false;
  feedback.className    = '';
  feedback.textContent  = '';
  renderSummary();
}

// ── Validation ───────────────────────────────────────────────────────────────
function validateForm() {
  const email      = document.getElementById('co-email')?.value.trim() || '';
  const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

  const billIds = ['bill-first','bill-last','bill-address','bill-city','bill-state','bill-zip'];
  const billValid = billIds.every(id => (document.getElementById(id)?.value.trim() || '') !== '');

  const shipCard = document.getElementById('shipping-card');
  const needsShip = shipCard && shipCard.style.display !== 'none';
  const shipSame  = document.getElementById('ship-same')?.checked ?? true;
  let shipValid   = true;
  if (needsShip && !shipSame) {
    const shipIds = ['ship-first','ship-last','ship-address','ship-city','ship-state','ship-zip'];
    shipValid = shipIds.every(id => (document.getElementById(id)?.value.trim() || '') !== '');
  }

  const valid = emailValid && billValid && shipValid && !!_quote;
  const btn   = document.getElementById('co-submit-btn');
  btn.disabled      = !valid;
}

function toggleShipping() {
  const same   = document.getElementById('ship-same')?.checked ?? true;
  const fields = document.getElementById('ship-fields');
  if (fields) fields.style.display = same ? 'none' : 'block';
  validateForm();
}

function toggleMobileSummary() {
  document.getElementById('summary-inner').classList.toggle('open');
}

// ── Bundle upsell notice ──────────────────────────────────────────────────────
function checkBundleUpsell(upsell) {
  const el = document.getElementById('bundle-upsell');
  if (!el || !upsell || !upsell.missing?.length) return;
  const msg = `Did you have any <strong>${upsell.missing.map(escHtml).join(' or ')}</strong> photos taken?<br>
    Add them to your cart and receive <strong>${upsell.pct}% off your order!</strong><br>
    <span style="font-size:.82em;opacity:.65">If a discount code would take more off an item, you get the bigger discount.</span>`;
  document.getElementById('bundle-upsell-msg').innerHTML = msg;
  const backLink = document.getElementById('bundle-upsell-back');
  if (backLink) backLink.href = cartData.returnUrl || '/';
  el.style.display = 'flex';
}
function dismissBundleUpsell() {
  const el = document.getElementById('bundle-upsell');
  if (el) el.style.display = 'none';
}

// ── Place Order ──────────────────────────────────────────────────────────────
async function placeOrder() {
  const btn = document.getElementById('co-submit-btn');
  btn.textContent = 'Processing…';
  btn.disabled    = true;

  const email = document.getElementById('co-email').value.trim();
  const billing = {
    first_name: document.getElementById('bill-first').value.trim(),
    last_name:  document.getElementById('bill-last').value.trim(),
    address_1:  document.getElementById('bill-address').value.trim(),
    address_2:  document.getElementById('bill-address2')?.value.trim() || '',
    city:       document.getElementById('bill-city').value.trim(),
    state:      document.getElementById('bill-state').value.trim(),
    postcode:   document.getElementById('bill-zip').value.trim(),
    country:    'US',
    email:      email,
  };

  const shipSame = document.getElementById('ship-same')?.checked ?? true;
  const shipping = shipSame ? { ...billing } : {
    first_name: document.getElementById('ship-first').value.trim(),
    last_name:  document.getElementById('ship-last').value.trim(),
    address_1:  document.getElementById('ship-address').value.trim(),
    address_2:  document.getElementById('ship-address2')?.value.trim() || '',
    city:       document.getElementById('ship-city').value.trim(),
    state:      document.getElementById('ship-state').value.trim(),
    postcode:   document.getElementById('ship-zip').value.trim(),
    country:    'US',
  };

  const payload = { ...buildOrderPayload(), email, billing, shipping };

  try {
    const resp = await fetch('/api/checkout', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(payload),
    });
    const data = await resp.json();
    if (data.checkout_url) {
      localStorage.removeItem('ci_checkout_cart');
      localStorage.removeItem('bsp_cart_v1');
      window.location.href = data.checkout_url;
    } else {
      throw new Error(resp.status === 400 && data.error ? data.error : '');
    }
  } catch(e) {
    alert(e.message ? `Checkout couldn't continue: ${e.message}` : 'Checkout failed — please try again.');
    btn.textContent = 'Continue to Payment →';
    btn.disabled    = false;
  }
}
</script>

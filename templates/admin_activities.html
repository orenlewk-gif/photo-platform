<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Activities — Crystal Images Admin</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#e8eaf0;font-family:'Inter',system-ui,sans-serif;font-size:14px;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
#topbar{height:52px;background:#0a1320;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;padding:0 1.4rem;flex-shrink:0}
#topbar .logo{font-size:13px;font-weight:700;letter-spacing:.5px;color:#a0aec0;margin-right:auto}
#topbar a.signout{font-size:12px;color:rgba(255,255,255,.35);padding:.3rem .6rem;border-radius:5px}
#topbar a.signout:hover{color:rgba(255,255,255,.65);background:rgba(255,255,255,.05)}
#layout{display:flex;flex:1;height:calc(100vh - 52px);overflow:hidden}
#sidebar{width:240px;flex-shrink:0;background:#0a1320;border-right:1px solid rgba(255,255,255,.07);overflow-y:auto}
#sidebar-nav{padding:.4rem 0}
#date-quicknav{border-top:1px solid rgba(255,255,255,.07);padding:.4rem 0}
.date-qn-hdr{padding:.5rem .9rem .3rem;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.22)}
.date-qn-item{display:block;padding:.38rem .9rem;border-radius:6px;margin:.05rem .45rem;font-size:.79rem;font-weight:600;color:rgba(255,255,255,.5);text-decoration:none;cursor:pointer;transition:background .12s,color .12s}
.date-qn-item:hover{background:rgba(255,255,255,.06);color:#F5C518}
.nav-sec-label{padding:.85rem .9rem .3rem;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.22)}
.nav-link{display:block;padding:.52rem .9rem;border-radius:6px;margin:.05rem .45rem;font-size:16px;color:rgba(255,255,255,.55);text-decoration:none;transition:background .12s,color .12s}
.nav-link:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85)}
.nav-link.active-page{color:#F5C430;background:rgba(245,197,24,.09);box-shadow:inset 3px 0 0 #F5C430}
.nav-sub{padding-left:1.4rem!important;font-size:14px}
.nav-group-hdr{display:flex;align-items:center;justify-content:space-between;padding:.52rem .9rem;border-radius:6px;margin:.05rem .45rem;font-size:16px;color:rgba(255,255,255,.5);cursor:pointer;user-select:none;transition:background .12s,color .12s}
.nav-group-hdr:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85)}
.nav-group-hdr.open{color:#e8eaf0}
.ng-arr{font-size:10px;color:rgba(255,255,255,.3);transition:transform .15s;flex-shrink:0}
.ng-arr.open{transform:rotate(90deg)}
.nav-children{display:none}
.nav-children.open{display:block}
#main{flex:1;overflow-y:auto;padding:2rem 2.5rem}

/* Page header */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem}
.page-header h1{font-size:22px;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .85rem;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#F5C518;color:#07151f;font-weight:700}
.btn-sm{padding:.3rem .65rem;font-size:12px}
.btn-ghost{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.1)}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-danger{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.btn-back{background:none;border:none;color:rgba(255,255,255,.45);font-size:13px;cursor:pointer;padding:.3rem 0;display:inline-flex;align-items:center;gap:.4rem;margin-bottom:1.25rem}
.btn-back:hover{color:#fff}

/* Activity list */
.act-table{width:100%;max-width:900px}
.act-header-row{display:grid;grid-template-columns:1fr 90px 90px 90px 24px;gap:.5rem;padding:.35rem 1rem;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.28);border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:.5rem}
.act-wrap{margin-bottom:.3rem}
.act-row{display:grid;grid-template-columns:1fr 90px 90px 90px 24px;gap:.5rem;align-items:center;padding:.65rem 1rem .65rem 2rem;border-radius:7px;background:#1a1d27;border:1px solid rgba(255,255,255,.06);cursor:pointer;transition:border-color .15s,border-radius .1s}
.act-row:hover{border-color:rgba(255,255,255,.15)}
.act-row.open{border-color:rgba(255,255,255,.18);border-radius:7px 7px 0 0;border-bottom-color:transparent}
.act-name{font-weight:600;font-size:13px;color:#e8eaf0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-badge{font-size:10px;font-weight:700;letter-spacing:.5px;padding:.22rem .6rem;border-radius:5px;text-transform:uppercase}
.badge-custom{background:rgba(52,211,153,.12);color:#34d399}
.badge-default{background:rgba(99,179,237,.12);color:#63b3ed}
.badge-zip{background:rgba(245,197,24,.12);color:#F5C518}
.badge-none{background:rgba(255,255,255,.06);color:rgba(255,255,255,.35)}
.act-stat{font-size:13px;color:rgba(255,255,255,.5)}
.act-chev{font-size:11px;color:rgba(255,255,255,.28);text-align:right;transition:transform .18s}
.act-row.open .act-chev{transform:rotate(90deg)}

/* Add-location form (per tab) */
.cat-add-row{margin-top:.75rem;padding-top:.5rem}
.cat-add-form{display:flex;align-items:center;gap:.5rem;margin-top:.4rem;flex-wrap:wrap}
.cat-add-form input{flex:1;min-width:180px;background:#1e2330;border:1px solid rgba(255,255,255,.12);border-radius:7px;color:#e8eaf0;padding:.38rem .7rem;font-size:12px;outline:none;transition:border-color .15s}
.cat-add-form input:focus{border-color:#F5C518}

/* Category tabs */
.act-tabs-bar{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:1rem;flex-wrap:wrap}
.act-tab{background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.45);font-size:13px;font-weight:500;padding:.55rem 1.1rem;cursor:pointer;transition:color .12s,border-color .12s;white-space:nowrap;margin-bottom:-1px;font-family:inherit;display:inline-flex;align-items:center;gap:.45rem}
.act-tab:hover{color:rgba(255,255,255,.75)}
.act-tab.active{color:#F5C518;border-bottom-color:#F5C518}
.act-tab.inactive{color:rgba(255,255,255,.22)}
.act-tab.inactive.active{color:rgba(245,197,24,.55);border-bottom-color:rgba(245,197,24,.35)}
.tab-active-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background .15s}
.tab-active-dot.on{background:#4ade80}
.tab-active-dot.off{background:#ef4444;opacity:.7}
.act-tab-panel{display:none}
.act-tab-panel.active{display:block}
.cat-empty{font-size:12px;color:rgba(255,255,255,.2);padding:.5rem 0 .8rem}
.empty-state{color:rgba(255,255,255,.3);font-size:13px;padding:2rem 0;text-align:center}

/* Expandable detail panel */
.act-detail{background:#12161f;border:1px solid rgba(255,255,255,.18);border-top:none;border-radius:0 0 8px 8px;overflow:hidden}

/* Items section */
.det-section{padding:1rem 1.2rem;border-bottom:1px solid rgba(255,255,255,.07)}
.det-section:last-child{border-bottom:none}
.det-label{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.28);margin-bottom:.75rem}

/* Item option checkboxes */
.items-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem .75rem}
@media(max-width:720px){.items-grid{grid-template-columns:repeat(2,1fr)}}
.item-check{display:flex;align-items:center;gap:.5rem;cursor:pointer;user-select:none;padding:.3rem .1rem}
.item-check input[type="checkbox"]{width:15px;height:15px;accent-color:#F5C518;cursor:pointer;flex-shrink:0}
.item-check span{font-size:12px;color:rgba(255,255,255,.65)}
.item-check:hover span{color:#e8eaf0}

/* Feature flags (toggles) */
.flags-row{display:flex;flex-wrap:wrap;gap:1.25rem;align-items:center}
.flag-toggle{display:flex;align-items:center;gap:.55rem;cursor:pointer;user-select:none}
.toggle{width:32px;height:17px;background:rgba(255,255,255,.15);border-radius:9px;position:relative;transition:background .2s;flex-shrink:0}
.toggle.on{background:#3b82f6}
.toggle::after{content:'';position:absolute;width:13px;height:13px;background:#fff;border-radius:7px;top:2px;left:2px;transition:left .2s}
.toggle.on::after{left:17px}
.flag-label{font-size:13px;color:rgba(255,255,255,.65)}

/* Bottom two-column section */
.det-bottom{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid rgba(255,255,255,.07)}
@media(max-width:720px){.det-bottom{grid-template-columns:1fr}}
.det-col{padding:1rem 1.2rem}
.det-col+.det-col{border-left:1px solid rgba(255,255,255,.07)}

/* Location groups */
.groups-tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem;min-height:24px}
.group-tag{display:inline-flex;align-items:center;gap:.35rem;background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.3);border-radius:5px;padding:.22rem .55rem;font-size:12px;color:#F5C518}
.group-tag-remove{background:none;border:none;color:rgba(245,197,24,.5);cursor:pointer;font-size:14px;line-height:1;padding:0;transition:color .12s}
.group-tag-remove:hover{color:#F5C518}
.group-add-row{display:flex;gap:.5rem;align-items:center;margin-top:.5rem}
.group-add-row input{flex:1;background:#1e2330;border:1px solid rgba(255,255,255,.12);border-radius:7px;color:#e8eaf0;padding:.38rem .7rem;font-size:12px;outline:none;transition:border-color .15s}
.group-add-row input:focus{border-color:#F5C518}

/* Gallery list */
.gallery-rows{max-height:200px;overflow-y:auto}
.gallery-row{display:grid;grid-template-columns:100px 1fr 50px 52px;gap:.4rem;align-items:center;padding:.38rem .3rem;border-radius:5px}
.gallery-row:hover{background:rgba(255,255,255,.04)}
.gal-date{font-size:12px;color:rgba(255,255,255,.45);font-variant-numeric:tabular-nums}
.gal-name{font-size:12px;color:rgba(255,255,255,.65);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal-photos{font-size:12px;color:rgba(255,255,255,.4);text-align:right}
.gal-link{font-size:11px;color:#63b3ed;text-align:right;text-decoration:none}
.gal-link:hover{color:#93c5fd}
.gallery-empty{font-size:12px;color:rgba(255,255,255,.25);padding:.5rem .3rem}

/* Rename row (subtle, inside bottom section) */
.rename-row{display:flex;gap:.5rem;margin-top:.85rem;padding-top:.85rem;border-top:1px solid rgba(255,255,255,.06)}
.rename-row input{flex:1;background:#1e2330;border:1px solid rgba(255,255,255,.12);border-radius:7px;color:#e8eaf0;padding:.35rem .65rem;font-size:12px;outline:none;transition:border-color .15s}
.rename-row input:focus{border-color:#F5C518}
.rename-hint{font-size:11px;color:rgba(255,255,255,.22);margin-top:.35rem;line-height:1.5}

/* Create form */
#create-view{display:none;max-width:520px}
.card{background:#1a1d27;border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:1.4rem 1.6rem}
.card h3{font-size:14px;font-weight:600;margin-bottom:1.25rem;color:#e8eaf0}
.field-group{margin-bottom:1.1rem}
.field-label{font-size:12px;color:rgba(255,255,255,.45);margin-bottom:.45rem;display:block}
input[type="text"]{width:100%;background:#252836;border:1px solid rgba(255,255,255,.12);border-radius:7px;color:#e8eaf0;padding:.5rem .75rem;font-size:14px;outline:none;transition:border-color .15s}
input[type="text"]:focus{border-color:#F5C518}
.pricing-options{display:flex;flex-direction:column;gap:.6rem;margin-top:.25rem}
.pricing-opt{display:flex;align-items:center;gap:.75rem;padding:.7rem .9rem;border-radius:7px;border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:border-color .15s,background .15s}
.pricing-opt:hover{background:rgba(255,255,255,.04)}
.pricing-opt.selected{border-color:#F5C518;background:rgba(245,197,24,.06)}
.opt-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25);flex-shrink:0;transition:border-color .15s,background .15s}
.pricing-opt.selected .opt-dot{border-color:#F5C518;background:#F5C518}
.opt-text{font-size:13px;color:rgba(255,255,255,.75)}
.pricing-opt.selected .opt-text{color:#e8eaf0}
.btn-row{display:flex;gap:.6rem;margin-top:1.1rem}

/* Toast */
#toast{position:fixed;bottom:1.5rem;right:1.5rem;padding:.6rem 1.1rem;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:opacity .25s;z-index:9999;pointer-events:none}
#toast.show{opacity:1;background:#16a34a;color:#fff}
#toast.err{opacity:1;background:#dc2626;color:#fff}
html.embedded #topbar,html.embedded #sidebar{display:none}
html.embedded #layout{height:100vh}
</style>
<link rel="stylesheet" href="/static/theme-admin.css">
</head>
<body>

<div id="topbar">
  <span class="logo">Crystal Images — Dashboard</span>
  <a href="/admin/logout" class="signout">Sign out</a>
</div>

<div id="layout">
  <div id="sidebar">
    <div id="sidebar-nav">
      <a href="/admin/dashboard" class="nav-link">Dashboard</a>
      <a href="/admin/pricing" class="nav-link">Pricing</a>
      <a href="/admin/photographers" class="nav-link">Admin</a>
      <div style="border-top:1px solid rgba(255,255,255,.07);margin:.5rem 0"></div>
      <a href="/admin/orders" class="nav-link">Orders</a>
      <a href="/admin/links" class="nav-link">Links</a>
      <a href="/admin/settings" class="nav-link">Settings</a>
      <a href="/admin/activities" class="nav-link active-page">Activities</a>
      <div style="border-top:1px solid rgba(255,255,255,.07);margin:.5rem 0"></div>
      <a href="/admin/trash" class="nav-link">Trash</a>
    </div>
    <div id="date-quicknav">
      <div class="date-qn-hdr">Dates</div>
      <div id="date-qn-list"><div style="padding:.3rem .9rem;font-size:.75rem;color:rgba(255,255,255,.2)">Loading…</div></div>
    </div>
  </div>

  <div id="main">

    <!-- List view -->
    <div id="list-view">
      <div class="page-header">
        <h1>Activities</h1>
        <button class="btn btn-primary" onclick="showCreate()">+ New Activity</button>
      </div>

      <div class="act-table">
        <div id="act-list-body">
          <div class="empty-state">Loading…</div>
        </div>
      </div>
    </div>

    <!-- Create view -->
    <div id="create-view">
      <button class="btn-back" onclick="showList()">← Back to Activities</button>
      <div class="card">
        <h3>New Activity</h3>
        <div class="field-group">
          <label class="field-label">Activity Name</label>
          <input type="text" id="new-act-name" placeholder="e.g. Ski Photos" onkeydown="if(event.key==='Enter')createActivity()">
        </div>
        <div class="field-group">
          <label class="field-label">Pricing Type</label>
          <div class="pricing-options">
            <div class="pricing-opt selected" id="opt-standard" onclick="selectType('standard')">
              <div class="opt-dot"></div>
              <span class="opt-text">Standard Digital — per-photo tiers (1 photo, 3 photos, etc.)</span>
            </div>
            <div class="pricing-opt" id="opt-zip" onclick="selectType('zip')">
              <div class="opt-dot"></div>
              <span class="opt-text">Zip / Group Size — priced by group, not photo count</span>
            </div>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="createActivity()">Create Activity</button>
          <button class="btn btn-ghost" onclick="showList()">Cancel</button>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
// ── Category groupings (parent → child activities) ──────────────────────────
const DEFAULT_CATEGORIES = [
  {name:'Zip Lines',        acts:['Adventure Zip','Nature Zip']},
  {name:'Mountain Biking',  acts:['Mountain Biking','Dirt Days']},
  {name:'Summer Portraits', acts:['Lone Peak Portraits','Explorer Gondola','Ramcharger Portraits']},
  {name:'Winter Portraits', acts:[]},
  {name:'Winter Action',    acts:['Mr K Action']},
];

// ── Constants ──────────────────────────────────────────────────────────────────
const ALL_ITEMS = [
  {key:'action_digital',    label:'Action Photos (Digital)'},
  {key:'portrait_digital',  label:'Portrait Photos (Digital)'},
  {key:'prints',            label:'Prints'},
  {key:'mats',              label:'Mats'},
  {key:'big_sky_frames',    label:'Big Sky Rustic Frames'},
  {key:'satin_black_frames',label:'Satin Black Frames'},
];

const ALL_FLAGS = [
  {key:'time_search', label:'Time Search'},
  {key:'clip',        label:'Fashion CLIP'},
];

// ── State ─────────────────────────────────────────────────────────────────────
let pricingData    = null;
let allFolders     = [];
let activityGroups = {};
let _actType       = 'standard';
let _activeTab     = null;

// ── Data loading ──────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const [pr, fr, gr] = await Promise.all([
      fetch('/api/admin/pricing').then(r => r.json()),
      fetch('/api/admin/folders').then(r => r.json()),
      fetch('/api/admin/activity-groups').then(r => r.json()),
    ]);
    pricingData    = pr;
    allFolders     = fr.folders || [];
    activityGroups = gr.activity_groups || {};
    renderList();
  } catch(e) {
    document.getElementById('act-list-body').innerHTML = '<div class="empty-state">Failed to load — try refreshing</div>';
  }
}

// ── Build item list ────────────────────────────────────────────────────────────
function buildItems() {
  const acts     = pricingData.activities || {};
  const groups   = activityGroups;

  // Stats per location name (from folders)
  const statsMap = {};
  for (const f of allFolders) {
    const key = f.location.toLowerCase();
    if (!statsMap[key]) statsMap[key] = {name: f.location, galleries: 0, photos: 0};
    statsMap[key].galleries++;
    statsMap[key].photos += f.photo_count || 0;
  }

  const seen  = new Set();
  const items = [];

  // First: activities defined in pricing.json
  for (const [actName, cfg] of Object.entries(acts)) {
    const key = actName.toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    const direct = statsMap[key] || {galleries: 0, photos: 0};
    // Add in stats from grouped locations
    const groupLocs = groups[actName] || [];
    let galleries = direct.galleries, photos = direct.photos;
    for (const loc of groupLocs) {
      const s = statsMap[loc.toLowerCase()];
      if (s) { galleries += s.galleries; photos += s.photos; }
    }
    items.push({name: actName, cfg, galleries, photos, groupCount: groupLocs.length});
  }

  // Second: activities only referenced in activity_groups (no pricing entry yet)
  for (const [actName, locs] of Object.entries(groups)) {
    const key = actName.toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    let galleries = 0, photos = 0;
    for (const loc of locs) {
      const s = statsMap[loc.toLowerCase()];
      if (s) { galleries += s.galleries; photos += s.photos; }
    }
    items.push({name: actName, cfg: null, galleries, photos, groupCount: locs.length});
  }

  // Third: locations from folders not yet assigned to any activity
  for (const [key, stats] of Object.entries(statsMap)) {
    if (seen.has(key)) continue;
    seen.add(key);
    items.push({name: stats.name, cfg: null, galleries: stats.galleries, photos: stats.photos, groupCount: 0});
  }

  return items.sort((a, b) => a.name.localeCompare(b.name));
}

function renderList() {
  const all    = buildItems();
  const byName = Object.fromEntries(all.map(it => [it.name, it]));

  if (!pricingData.activity_categories || !pricingData.activity_categories.length) {
    pricingData.activity_categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
  }
  const cats = pricingData.activity_categories;

  const categorized = new Set();
  const tabData = [];

  for (const cat of cats) {
    const catActs = (cat.acts || []).filter(Boolean);
    catActs.forEach(n => categorized.add(n));
    tabData.push({
      name: cat.name,
      acts: catActs.map(n => byName[n] || {name:n,cfg:null,galleries:0,photos:0,groupCount:0}),
    });
  }

  const uncat = all.filter(it => !categorized.has(it.name));
  if (uncat.length) tabData.push({name: 'Uncategorized', acts: uncat});

  if (!tabData.length) {
    document.getElementById('act-list-body').innerHTML = '<div class="empty-state">No activities found.</div>';
    return;
  }

  const firstTab = (_activeTab && tabData.some(t => t.name === _activeTab))
    ? _activeTab : tabData[0].name;

  const tabsHtml = `<div class="act-tabs-bar">${
    tabData.map(t => {
      const catObj = cats.find(c => c.name === t.name);
      const isActive = !catObj || catObj.active !== false;
      const dotHtml = catObj  // no dot for Uncategorized
        ? `<span class="tab-active-dot ${isActive ? 'on' : 'off'}" title="${isActive ? 'Active in upload' : 'Hidden from upload — click to enable'}" onclick="event.stopPropagation();toggleCatActive('${esc(t.name)}')"></span>`
        : '';
      return `<button class="act-tab${t.name === firstTab ? ' active' : ''}${!isActive ? ' inactive' : ''}" onclick="selectTab('${esc(t.name)}')">${esc(t.name)}${dotHtml}</button>`;
    }).join('')
  }</div>`;

  const CAT_ADD_LOCATION = ['Winter Portraits', 'Winter Action'];

  const panelsHtml = tabData.map(t => {
    const actsHtml = t.acts.length
      ? t.acts.map(it => actRowHtml(it)).join('')
      : '<div class="cat-empty">No activities added yet</div>';
    const sid = slugId(t.name);
    const addHtml = CAT_ADD_LOCATION.includes(t.name) ? `
      <div class="cat-add-row">
        <button class="btn btn-ghost btn-sm" onclick="showAddLocation('${esc(t.name)}')">+ Add Location</button>
        <div class="cat-add-form" id="cat-add-form-${sid}" style="display:none">
          <input type="text" id="cat-add-inp-${sid}" placeholder="Location name…" onkeydown="if(event.key==='Enter')createLocationInCat('${esc(t.name)}')">
          <button class="btn btn-primary btn-sm" onclick="createLocationInCat('${esc(t.name)}')">Create</button>
          <button class="btn btn-ghost btn-sm" onclick="hideAddLocation('${esc(t.name)}')">Cancel</button>
        </div>
      </div>` : '';
    return `<div class="act-tab-panel${t.name === firstTab ? ' active' : ''}" data-cat="${esc(t.name)}">${actsHtml}${addHtml}</div>`;
  }).join('');

  document.getElementById('act-list-body').innerHTML = tabsHtml + panelsHtml;
}

function selectTab(catName) {
  _activeTab = catName;
  document.querySelectorAll('.act-tab').forEach(t => {
    t.classList.toggle('active', t.textContent === catName);
  });
  document.querySelectorAll('.act-tab-panel').forEach(p => {
    p.classList.toggle('active', p.dataset.cat === catName);
  });
}

function showAddLocation(catName) {
  const sid = slugId(catName);
  const form = document.getElementById('cat-add-form-' + sid);
  if (form) { form.style.display = 'flex'; document.getElementById('cat-add-inp-' + sid)?.focus(); }
}
function hideAddLocation(catName) {
  const sid = slugId(catName);
  const form = document.getElementById('cat-add-form-' + sid);
  if (form) form.style.display = 'none';
  const inp = document.getElementById('cat-add-inp-' + sid);
  if (inp) inp.value = '';
}
async function createLocationInCat(catName) {
  const sid = slugId(catName);
  const inp = document.getElementById('cat-add-inp-' + sid);
  const name = inp ? inp.value.trim() : '';
  if (!name) { showToast('Enter a location name', 'err'); return; }
  if (!pricingData) return;
  if (!pricingData.activities) pricingData.activities = {};
  if (pricingData.activities[name]) { showToast(`"${name}" already exists`, 'err'); return; }

  if (catName === 'Winter Action') {
    pricingData.activities[name] = {
      use_default: false,
      tiers: [
        {label: '1 Photo',    count: 1,     price: 25},
        {label: 'All Photos', count: 'all', price: 115, max: true},
      ],
      items: ['action_digital'],
      flags: {time_search: true, clip: true},
    };
  } else {
    pricingData.activities[name] = {use_default: false, tiers: [], items: ['portrait_digital'], flags: {}};
  }

  if (!pricingData.activity_categories || !pricingData.activity_categories.length) {
    pricingData.activity_categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
  }
  const cat = pricingData.activity_categories.find(c => c.name === catName);
  if (cat) { if (!cat.acts) cat.acts = []; if (!cat.acts.includes(name)) cat.acts.push(name); }

  try {
    const r = await fetch('/api/admin/pricing', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(pricingData),
    });
    if (!r.ok) throw new Error(await r.text());
    showToast(`"${name}" created`);
    hideAddLocation(catName);
    await loadData();
  } catch(e) {
    showToast('Save failed: ' + e, 'err');
  }
}

function actRowHtml(item) {
  const {name, cfg, galleries, photos, groupCount} = item;
  const sid = slugId(name);
  const locs = groupCount ? `<span class="act-badge badge-custom">${groupCount} loc</span>`
                           : `<span class="act-badge badge-none">—</span>`;
  return `<div class="act-wrap" id="wrap-${sid}">
    <div class="act-row" id="row-${sid}" onclick="toggleDetail('${esc(name)}')">
      <span class="act-name">${esc(name)}</span>
      <span class="act-stat">${locs}</span>
      <span class="act-stat">${galleries}</span>
      <span class="act-stat">${photos.toLocaleString()}</span>
      <span class="act-chev">›</span>
    </div>
  </div>`;
}

// ── Detail panel ───────────────────────────────────────────────────────────────
function toggleDetail(name) {
  const sid      = slugId(name);
  const row      = document.getElementById('row-' + sid);
  const wrap     = document.getElementById('wrap-' + sid);
  const detId    = 'detail-' + sid;
  const existing = document.getElementById(detId);

  if (existing) {
    row.classList.remove('open');
    existing.remove();
    return;
  }
  row.classList.add('open');

  const acts    = pricingData.activities || {};
  const cfg     = acts[name] || {};
  const enabledItems = new Set(cfg.items || []);
  const flags        = cfg.flags || {};

  // Item option checkboxes
  const itemsHtml = ALL_ITEMS.map(it =>
    `<label class="item-check">
      <input type="checkbox" id="item-${sid}-${it.key}" ${enabledItems.has(it.key) ? 'checked' : ''}>
      <span>${esc(it.label)}</span>
    </label>`
  ).join('');

  // Feature flag toggles
  const flagsHtml = ALL_FLAGS.map(fl =>
    `<div class="flag-toggle" onclick="toggleFlag('${esc(name)}','${fl.key}')">
      <div class="toggle${flags[fl.key] ? ' on' : ''}" id="flag-${sid}-${fl.key}"></div>
      <span class="flag-label">${esc(fl.label)}</span>
    </div>`
  ).join('');

  // Location groups
  const groupedLocs = activityGroups[name] || [];
  const groupTagsHtml = groupedLocs.length
    ? groupedLocs.map(loc =>
        `<span class="group-tag">${esc(loc)}<button class="group-tag-remove" onclick="removeFromGroup('${esc(name)}','${esc(loc)}')">×</button></span>`
      ).join('')
    : '<span style="font-size:12px;color:rgba(255,255,255,.25)">No locations added yet</span>';

  // Gallery rows (direct matches only)
  const myFolders = allFolders
    .filter(f => f.location.toLowerCase() === name.toLowerCase())
    .sort((a, b) => b.date.localeCompare(a.date));
  const galleryRows = myFolders.length
    ? myFolders.map(f => {
        const u = '/admin/dashboard?od=' + encodeURIComponent(f.date) +
                  '&ol=' + encodeURIComponent(f.location) +
                  '&of=' + encodeURIComponent(f.name || '');
        return `<div class="gallery-row">
          <span class="gal-date">${esc(f.date)}</span>
          <span class="gal-name">${esc(f.name || '—')}</span>
          <span class="gal-photos">${f.photo_count}</span>
          <a class="gal-link" href="${u}">Open →</a>
        </div>`;
      }).join('')
    : '<div class="gallery-empty">No direct galleries — add locations below to link folders</div>';

  const detail = document.createElement('div');
  detail.className = 'act-detail';
  detail.id = detId;
  detail.innerHTML = `
    <div class="det-section">
      <div class="det-label">Items Available in Store</div>
      <div class="items-grid">${itemsHtml}</div>
    </div>
    <div class="det-section">
      <div class="det-label">Settings</div>
      <div class="flags-row">${flagsHtml}</div>
      <div style="margin-top:.85rem">
        <button class="btn btn-primary btn-sm" onclick="saveActivityConfig('${esc(name)}')">Save Config</button>
      </div>
    </div>
    <div class="det-bottom">
      <div class="det-col">
        <div class="det-label">Locations — folders here use ${esc(name)} pricing automatically</div>
        <div class="groups-tags" id="gtags-${sid}">${groupTagsHtml}</div>
        <div class="group-add-row">
          <input type="text" id="gadd-${sid}" placeholder="e.g. Mr K Action" onkeydown="if(event.key==='Enter')addToGroup('${esc(name)}')">
          <button class="btn btn-ghost btn-sm" onclick="addToGroup('${esc(name)}')">+ Add</button>
        </div>
        <div class="rename-row">
          <input type="text" id="ri-${sid}" value="${esc(name)}" placeholder="Rename activity" onkeydown="if(event.key==='Enter')doRename('${esc(name)}')">
          <button class="btn btn-ghost btn-sm" onclick="doRename('${esc(name)}')">Rename</button>
        </div>
        <div class="rename-hint">Renaming to an existing activity merges all photos into it.</div>
      </div>
      <div class="det-col">
        <div class="det-label">Galleries (${myFolders.length})</div>
        <div class="gallery-rows">${galleryRows}</div>
      </div>
    </div>`;
  wrap.appendChild(detail);
}

// ── Flag toggle ────────────────────────────────────────────────────────────────
function toggleFlag(actName, flagKey) {
  const sid = slugId(actName);
  const el  = document.getElementById(`flag-${sid}-${flagKey}`);
  if (!el) return;
  const on = el.classList.toggle('on');
  // Update in-memory so save picks it up
  if (!pricingData.activities) pricingData.activities = {};
  if (!pricingData.activities[actName]) pricingData.activities[actName] = {};
  if (!pricingData.activities[actName].flags) pricingData.activities[actName].flags = {};
  pricingData.activities[actName].flags[flagKey] = on;
}

// ── Save activity config (items + flags) ───────────────────────────────────────
async function saveActivityConfig(actName) {
  const sid = slugId(actName);
  if (!pricingData.activities) pricingData.activities = {};
  if (!pricingData.activities[actName]) pricingData.activities[actName] = {};

  // Collect checked items
  const items = ALL_ITEMS
    .filter(it => document.getElementById(`item-${sid}-${it.key}`)?.checked)
    .map(it => it.key);

  // Collect flags (already updated in pricingData by toggleFlag)
  const flags = pricingData.activities[actName].flags || {};

  pricingData.activities[actName].items  = items;
  pricingData.activities[actName].flags  = flags;

  // Always persist the category structure too
  if (!pricingData.activity_categories || !pricingData.activity_categories.length) {
    pricingData.activity_categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
  }

  try {
    const r = await fetch('/api/admin/pricing', {
      method:  'POST',
      headers: {'Content-Type':'application/json'},
      body:    JSON.stringify(pricingData),
    });
    if (!r.ok) throw new Error(await r.text());
    showToast('Config saved');
  } catch(e) {
    showToast('Save failed: ' + e, 'err');
  }
}

// ── Rename ─────────────────────────────────────────────────────────────────────
async function doRename(oldName) {
  const sid     = slugId(oldName);
  const input   = document.getElementById('ri-' + sid);
  const newName = input ? input.value.trim() : '';
  if (!newName || newName === oldName) return;
  input.disabled = true;
  try {
    const r = await fetch('/api/admin/rename-activity', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({old_name: oldName, new_name: newName}),
    });
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    showToast(`Renamed — ${d.photos_updated} photos updated`);
    await loadData();
  } catch(e) {
    showToast('Rename failed: ' + e, 'err');
    if (input) input.disabled = false;
  }
}

// ── Location groups ────────────────────────────────────────────────────────────
async function addToGroup(actName) {
  const sid = slugId(actName);
  const inp = document.getElementById('gadd-' + sid);
  const loc = inp ? inp.value.trim() : '';
  if (!loc) return;
  if (!activityGroups[actName]) activityGroups[actName] = [];
  if (activityGroups[actName].some(l => l.toLowerCase() === loc.toLowerCase())) {
    showToast('Location already in this group', 'err'); return;
  }
  activityGroups[actName].push(loc);
  await saveGroups();
  if (inp) inp.value = '';
  refreshGroupTags(actName);
}

async function removeFromGroup(actName, loc) {
  if (!activityGroups[actName]) return;
  activityGroups[actName] = activityGroups[actName].filter(l => l !== loc);
  if (!activityGroups[actName].length) delete activityGroups[actName];
  await saveGroups();
  refreshGroupTags(actName);
}

async function saveGroups() {
  try {
    const r = await fetch('/api/admin/activity-groups', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({activity_groups: activityGroups}),
    });
    if (!r.ok) throw new Error(await r.text());
    showToast('Saved');
  } catch(e) {
    showToast('Save failed: ' + e, 'err');
  }
}

async function toggleCatActive(catName) {
  if (!pricingData?.activity_categories) return;
  const cat = pricingData.activity_categories.find(c => c.name === catName);
  if (!cat) return;
  cat.active = cat.active === false ? true : false;
  try {
    const r = await fetch('/api/admin/pricing', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(pricingData),
    });
    if (!r.ok) throw new Error(await r.text());
    showToast(cat.active ? `"${catName}" enabled` : `"${catName}" hidden from upload`);
    renderList();
  } catch(e) {
    showToast('Save failed: ' + e, 'err');
  }
}

function refreshGroupTags(actName) {
  const sid  = slugId(actName);
  const el   = document.getElementById('gtags-' + sid);
  if (!el) return;
  const locs = activityGroups[actName] || [];
  el.innerHTML = locs.map(loc =>
    `<span class="group-tag">${esc(loc)}<button class="group-tag-remove" onclick="removeFromGroup('${esc(actName)}','${esc(loc)}')">×</button></span>`
  ).join('') || '<span style="font-size:12px;color:rgba(255,255,255,.25)">No locations added yet</span>';
}

// ── Fix duplicates ─────────────────────────────────────────────────────────────
async function fixDuplicates() {
  const btn = document.getElementById('fix-btn');
  btn.disabled = true;
  btn.textContent = 'Fixing…';
  try {
    const r = await fetch('/api/admin/normalize-locations', {method: 'POST'});
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    showToast(`Done — ${d.duplicates_removed} duplicates removed, ${d.total} photos remaining`);
    await loadData();
  } catch(e) {
    showToast('Fix failed: ' + e, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Fix Duplicates';
  }
}

// ── Create ─────────────────────────────────────────────────────────────────────
function showCreate() {
  document.getElementById('list-view').style.display = 'none';
  document.getElementById('create-view').style.display = 'block';
  document.getElementById('new-act-name').focus();
}
function showList() {
  document.getElementById('create-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';
}
function selectType(type) {
  _actType = type;
  document.getElementById('opt-standard').classList.toggle('selected', type === 'standard');
  document.getElementById('opt-zip').classList.toggle('selected', type === 'zip');
}
async function createActivity() {
  const name = document.getElementById('new-act-name').value.trim();
  if (!name) { showToast('Enter an activity name', 'err'); return; }
  if (!pricingData) { showToast('Pricing data not loaded', 'err'); return; }
  if (!pricingData.activities) pricingData.activities = {};
  if (pricingData.activities[name]) { showToast(`"${name}" already exists`, 'err'); return; }
  pricingData.activities[name] = {use_default: false, tiers: [], items: [], flags: {}};
  try {
    const r = await fetch('/api/admin/pricing', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(pricingData),
    });
    if (!r.ok) throw new Error(await r.text());
    showToast(`"${name}" created`);
    document.getElementById('new-act-name').value = '';
    selectType('standard');
    showList();
    loadData();
  } catch(e) {
    showToast('Save failed: ' + e, 'err');
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────────
function slugId(s) { return String(s).replace(/[^a-zA-Z0-9]/g, '-'); }
function esc(s)    { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
let _tt;
function showToast(msg, type='show') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = type;
  clearTimeout(_tt); _tt = setTimeout(() => t.className = '', 3000);
}

loadData();

// ── Date quick-nav ─────────────────────────────────────────────────────────────
(async () => {
  try {
    const res = await fetch('/api/admin/folders');
    if (!res.ok) return;
    const d = await res.json();
    const dates = [...new Set((d.folders||[]).map(f=>f.date))].sort((a,b)=>b.localeCompare(a));
    const el = document.getElementById('date-qn-list');
    if (!dates.length) { el.innerHTML = '<div style="padding:.3rem .9rem;font-size:.75rem;color:rgba(255,255,255,.2)">No dates</div>'; return; }
    el.innerHTML = dates.map(dt =>
      `<a class="date-qn-item" href="/admin/dashboard?date=${encodeURIComponent(dt)}">${dt}</a>`
    ).join('');
  } catch(e) {}
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin Folders — Crystal Images</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0c2336;color:#fff;font-family:'DM Sans',sans-serif;min-height:100vh}
.topbar{background:#091928;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:1rem;padding:0 1.5rem;height:56px;flex-wrap:wrap}
.topbar-logo{font-size:.85rem;letter-spacing:.1em;color:#F5C518;font-weight:700}
.topbar-spacer{flex:1}
.topbar a{color:rgba(255,255,255,.45);font-size:.8rem;text-decoration:none}
.topbar a:hover{color:#F5C518}
.topbar-scan{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);border-radius:6px;padding:.35rem .9rem;font-size:.8rem;cursor:pointer;font-family:inherit}
.topbar-scan:hover{background:rgba(255,255,255,.12)}
.topbar-scan:disabled{opacity:.4;cursor:not-allowed}

.main{max-width:960px;margin:0 auto;padding:1.5rem 1.5rem 4rem}

/* R2 unindexed section */
.r2-section{background:rgba(251,146,60,.05);border:1px solid rgba(251,146,60,.2);border-radius:10px;margin-bottom:1.75rem;overflow:hidden;display:none}
.r2-header{padding:.65rem 1rem;font-size:.72rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#fb923c;border-bottom:1px solid rgba(251,146,60,.15)}

/* Date sections */
.date-section{margin-bottom:1.25rem}
.date-header{display:flex;align-items:center;gap:.75rem;padding:.55rem 0;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:.5rem;user-select:none}
.date-header:hover .date-label{color:#fff}
.date-label{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5);flex:1}
.date-toggle{font-size:.7rem;color:rgba(255,255,255,.25)}
.date-pills{display:flex;gap:.4rem}
.pill{font-size:.68rem;padding:2px 8px;border-radius:10px;font-weight:600}
.pill-draft{background:rgba(251,146,60,.12);border:1px solid rgba(251,146,60,.3);color:#fb923c}
.pill-live{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.2);color:#4ade80}
.date-body{padding-bottom:.25rem}

/* Location group */
.loc-group{margin-bottom:.75rem}
.loc-label{font-size:.68rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.22);padding:.3rem 0 .5rem .25rem}

/* Folder row */
.folder-row{display:flex;align-items:center;gap:.65rem;padding:.6rem .85rem;border-radius:8px;background:#0a1e2e;border:1px solid rgba(255,255,255,.06);margin-bottom:.4rem;flex-wrap:wrap}
.folder-row.is-draft{border-color:rgba(251,146,60,.15)}
.folder-row.is-live{border-color:rgba(74,222,128,.1)}
.folder-row.is-r2{border-color:rgba(251,146,60,.15);background:rgba(251,146,60,.04)}

.status-badge{font-size:.65rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:4px;white-space:nowrap;flex-shrink:0}
.badge-draft{background:rgba(251,146,60,.12);color:#fb923c;border:1px solid rgba(251,146,60,.25)}
.badge-live{background:rgba(74,222,128,.08);color:#4ade80;border:1px solid rgba(74,222,128,.2)}
.badge-r2{background:rgba(251,146,60,.1);color:#fb923c;border:1px solid rgba(251,146,60,.2)}

.folder-name{font-size:.9rem;font-weight:600;color:#fff;flex:1;min-width:120px}
.folder-count{font-size:.75rem;color:rgba(255,255,255,.3);white-space:nowrap}

.group-select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:6px;color:#fff;padding:.35rem .65rem;font-size:.8rem;outline:none;max-width:180px}
.group-select:focus{border-color:#F5C518}
.group-select option{background:#0a1e2e}

.btn{border:none;border-radius:6px;padding:.35rem .8rem;font-size:.78rem;cursor:pointer;font-weight:600;font-family:inherit;white-space:nowrap;transition:background .15s}
.btn-live{background:#4ade80;color:#0c2336}
.btn-live:hover{background:#22c55e}
.btn-live:disabled{opacity:.4;cursor:not-allowed}
.btn-index{background:#fb923c;color:#0c2336}
.btn-index:hover{background:#f97316}
.btn-index:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6)}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-discard{background:transparent;border:1px solid rgba(248,113,113,.3);color:#f87171}
.btn-discard:hover{background:rgba(248,113,113,.08)}
.btn-delete{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#ef4444}
.btn-delete:hover{background:rgba(239,68,68,.25)}
.btn-delete:disabled{opacity:.4;cursor:not-allowed}
.btn-classify-colors{background:rgba(26,92,200,.15);border:1px solid rgba(26,92,200,.5);color:#6ea8ff}
.btn-classify-colors:hover{background:rgba(26,92,200,.28)}
.btn-classify-colors:disabled{opacity:.4;cursor:not-allowed}
.btn-select-photos{background:rgba(100,100,100,.15);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6)}
.btn-select-photos:hover{background:rgba(255,255,255,.1)}
.photo-selector{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:.75rem;margin:.25rem 0 .5rem}
.photo-selector-grid{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem}
.photo-sel-item{position:relative;width:80px;height:80px;cursor:pointer;border-radius:5px;overflow:hidden;border:2px solid transparent;flex-shrink:0}
.photo-sel-item img{width:100%;height:100%;object-fit:cover;display:block}
.photo-sel-item.selected{border-color:#F5C518}
.photo-sel-item .sel-check{position:absolute;top:3px;right:3px;width:16px;height:16px;background:#F5C518;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:10px;color:#000;font-weight:900}
.photo-sel-item.selected .sel-check{display:flex}
.photo-sel-item .sel-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);font-size:8px;color:rgba(255,255,255,.7);padding:1px 3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo-sel-actions{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.sel-count{font-size:.78rem;color:rgba(255,255,255,.45)}
.photo-sel-item .edit-btn{position:absolute;top:3px;left:3px;width:18px;height:18px;background:rgba(0,0,0,.65);border-radius:3px;display:none;align-items:center;justify-content:center;font-size:10px;cursor:pointer;color:#fff;z-index:2}
.photo-sel-item:hover .edit-btn{display:flex}
.color-editor{background:rgba(10,20,35,.97);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:.75rem;margin:.5rem 0;font-size:.78rem}
.color-editor-row{display:flex;align-items:center;gap:.4rem;margin-bottom:.5rem;flex-wrap:wrap}
.color-editor-label{color:rgba(255,255,255,.4);font-size:.65rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;width:52px;flex-shrink:0}
.color-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);cursor:pointer;font-size:.67rem;color:rgba(255,255,255,.55)}
.color-pill:hover{border-color:rgba(255,255,255,.3)}
.color-pill.on{border-color:#F5C518;background:rgba(245,197,24,.12);color:#F5C518}
.color-pill-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.sport-pill{padding:2px 10px;border-radius:12px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);cursor:pointer;font-size:.67rem;color:rgba(255,255,255,.55)}
.sport-pill:hover{border-color:rgba(255,255,255,.3)}
.sport-pill.on{border-color:#F5C518;background:rgba(245,197,24,.12);color:#F5C518}

.empty{color:rgba(255,255,255,.3);padding:3rem;text-align:center;font-size:.9rem}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1a3347;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:.65rem 1.25rem;font-size:.875rem;color:#fff;z-index:2000;pointer-events:none;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
</style>
<link rel="stylesheet" href="/static/theme-admin.css">
</head>
<body>
<div class="topbar">
  <div class="topbar-logo">CRYSTAL IMAGES — FOLDERS</div>
  <div class="topbar-spacer"></div>
  <a href="/admin/upload">Upload</a>
  <a href="/admin/zip-pricing">Pricing</a>
  <a href="/admin/dashboard">Dashboard</a>
  <button class="topbar-scan" id="scan-btn" onclick="scanR2()">Scan R2 for Unindexed</button>
</div>

<div class="main">
  <div class="r2-section" id="r2-section">
    <div class="r2-header">Found in R2 — Not yet indexed</div>
    <div id="r2-rows"></div>
  </div>
  <div id="content"><div class="empty">Loading…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
let allFolders  = [];
let pricingTiers = [];

window.addEventListener('load', async () => {
  const [fRes, pRes] = await Promise.all([
    fetch('/api/admin/folders'),
    fetch('/api/zip-pricing')
  ]);
  const fd = await fRes.json();
  const pd = await pRes.json();
  allFolders   = fd.folders || [];
  pricingTiers = pd.tiers  || [];
  render(allFolders);
});

function formatDate(d) {
  return new Date(d + 'T12:00:00').toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
}

function render(folders) {
  const el = document.getElementById('content');
  if (!folders.length) { el.innerHTML = '<div class="empty">No folders found.</div>'; return; }

  const byDate = {};
  folders.forEach(f => {
    if (!byDate[f.date]) byDate[f.date] = {};
    if (!byDate[f.date][f.location]) byDate[f.date][f.location] = [];
    byDate[f.date][f.location].push(f);
  });

  el.innerHTML = Object.keys(byDate).sort((a,b) => b.localeCompare(a)).map(date => {
    const locs = byDate[date];
    const allF = Object.values(locs).flat();
    const draftCount = allF.filter(f => f.draft_count > 0).length;
    const liveCount  = allF.filter(f => f.draft_count === 0).length;
    const pills = [
      draftCount ? `<span class="pill pill-draft">${draftCount} draft</span>` : '',
      liveCount  ? `<span class="pill pill-live">${liveCount} live</span>`   : '',
    ].join('');

    const locHtml = Object.keys(locs).sort().map(loc => {
      const rows = locs[loc].map(f => folderRow(f)).join('');
      return `<div class="loc-group">
        <div class="loc-label">${loc}</div>
        ${rows}
      </div>`;
    }).join('');

    return `<div class="date-section">
      <div class="date-header" onclick="toggleDate(this)">
        <span class="date-label">${formatDate(date)}</span>
        <span class="date-pills">${pills}</span>
        <span class="date-toggle">▼</span>
      </div>
      <div class="date-body">${locHtml}</div>
    </div>`;
  }).join('');
}

function folderRow(f) {
  const isDraft = f.draft_count > 0;
  const statusCls  = isDraft ? 'is-draft' : 'is-live';
  const badgeCls   = isDraft ? 'badge-draft' : 'badge-live';
  const badgeText  = isDraft ? `Draft · ${f.draft_count} unpublished` : 'Live';

  const groupSizeHtml = f.is_zip ? `
    <select class="group-select" onchange="setGroupSize('${f.folder_key}','${f.date}','${esc(f.location)}','${esc(f.name)}', this.value, this)">
      <option value="">— Group size —</option>
      ${pricingTiers.map(t => `<option value="${t.people}" ${String(f.group_size) === String(t.people) ? 'selected' : ''}>${t.people} ${t.people==1?'Person':'People'}</option>`).join('')}
    </select>` : '';

  const previewHtml = f.is_zip
    ? `<a href="/admin/zip-preview/${f.date}/${encodeURIComponent(f.name)}" target="_blank"><button class="btn btn-ghost">Preview →</button></a>`
    : `<a href="/?date=${f.date}&location=${encodeURIComponent(f.location)}&${f.is_portrait?'family':'group'}=${encodeURIComponent(f.name)}" target="_blank"><button class="btn btn-ghost">View →</button></a>`;

  const pushLiveHtml = isDraft
    ? `<button class="btn btn-live" onclick="pushLive('${esc(f.folder_key)}', this)">Push Live</button>
       <button class="btn btn-discard" onclick="discardDraft('${esc(f.folder_key)}', this)">Discard</button>`
    : '';
  const deleteHtml = `<button class="btn btn-delete" onclick="deleteFolder('${esc(f.folder_key)}', this)">Delete</button>`;
  const classifyHtml = (!f.is_portrait && !f.is_zip && !isDraft)
    ? `<button class="btn btn-classify-colors" onclick="classifyFolderColors('${esc(f.folder_key)}', this)" title="Run Haiku color classification on this folder">Classify Colors</button>
       <button class="btn btn-select-photos" onclick="togglePhotoSelector('${esc(f.folder_key)}', this)">Select Photos</button>`
    : '';

  const rowId = `frow_${btoa(f.folder_key).replace(/=/g,'')}`;
  return `<div class="folder-row ${statusCls}" id="${rowId}">
    <span class="status-badge ${badgeCls}">${badgeText}</span>
    <span class="folder-name">${f.name || '—'}</span>
    <span class="folder-count">${f.photo_count} photos</span>
    ${groupSizeHtml}
    ${pushLiveHtml}
    ${classifyHtml}
    ${deleteHtml}
    ${previewHtml}
  </div>
  <div class="photo-selector" id="sel_${rowId}" style="display:none"></div>`;
}

function toggleDate(header) {
  const body   = header.nextElementSibling;
  const toggle = header.querySelector('.date-toggle');
  const hidden = body.style.display === 'none';
  body.style.display   = hidden ? '' : 'none';
  toggle.textContent   = hidden ? '▼' : '▶';
}

async function pushLive(folderKey, btn) {
  const f = allFolders.find(x => x.folder_key === folderKey);
  if (!f) return;
  btn.disabled = true;
  btn.textContent = 'Pushing…';
  const res = await fetch('/api/admin/push-live', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({date: f.date, location: f.location, folder: f.name})
  });
  if (!res.ok) {
    showToast('Push live failed');
    btn.disabled = false;
    btn.textContent = 'Push Live';
    return;
  }
  const d = await res.json();
  const idx = allFolders.findIndex(x => x.folder_key === folderKey);
  if (idx !== -1) allFolders[idx].draft_count = 0;

  if (d.job_id) {
    btn.textContent = `Classifying 0/${d.classify_total}…`;
    await pollPushLiveClassify(d.job_id, d.classify_total, btn);
  } else {
    render(allFolders);
    showToast(`${d.pushed} photo${d.pushed !== 1 ? 's' : ''} are now live`);
  }
}

async function pollPushLiveClassify(jobId, total, btn) {
  try {
    const r = await fetch(`/api/admin/embed-status?job_id=${jobId}`);
    const s = await r.json();
    if (s.finished) {
      render(allFolders);
      showToast(`${total} photo${total !== 1 ? 's' : ''} live — color classification done`);
    } else {
      btn.textContent = `Classifying ${s.done}/${s.total}…`;
      setTimeout(() => pollPushLiveClassify(jobId, total, btn), 2000);
    }
  } catch(e) {
    setTimeout(() => pollPushLiveClassify(jobId, total, btn), 3000);
  }
}

async function discardDraft(folderKey, btn) {
  const f = allFolders.find(x => x.folder_key === folderKey);
  if (!f) return;
  if (!confirm(`Discard ${f.draft_count} draft photos for ${f.name}? This removes them from the index (R2 files stay).`)) return;
  btn.disabled = true;
  btn.textContent = 'Discarding…';
  const res = await fetch('/api/admin/discard-draft', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({date: f.date, location: f.location, folder: f.name})
  });
  if (res.ok) {
    const d = await res.json();
    showToast(`${d.removed} draft entries removed`);
    const idx = allFolders.findIndex(x => x.folder_key === folderKey);
    if (idx !== -1) allFolders[idx].draft_count = 0;
    render(allFolders);
  } else {
    showToast('Discard failed');
    btn.disabled = false;
    btn.textContent = 'Discard';
  }
}

async function deleteFolder(folderKey, btn) {
  const f = allFolders.find(x => x.folder_key === folderKey);
  if (!f) return;
  if (!confirm(`Permanently delete all ${f.photo_count} photos for "${f.name}"?\n\nThis removes them from R2 and the index and cannot be undone.`)) return;
  btn.disabled = true;
  btn.textContent = 'Deleting…';
  const res = await fetch('/api/admin/delete-folder', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({date: f.date, location: f.location, folder: f.name})
  });
  if (res.ok) {
    const d = await res.json();
    showToast(`${d.deleted} photos deleted from R2`);
    allFolders = allFolders.filter(x => x.folder_key !== folderKey);
    render(allFolders);
  } else {
    showToast('Delete failed');
    btn.disabled = false;
    btn.textContent = 'Delete';
  }
}

async function setGroupSize(folderKey, date, location, name, groupSize, el) {
  const res = await fetch('/api/zip-folder/set-group-size', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({folder_key: folderKey, group_size: groupSize || null})
  });
  if (res.ok) {
    const idx = allFolders.findIndex(x => x.folder_key === folderKey);
    if (idx !== -1) allFolders[idx].group_size = groupSize || null;
    showToast(groupSize ? `Set to ${groupSize} people` : 'Group size cleared');
  } else {
    showToast('Failed to save');
  }
}

// ── R2 Scan ──────────────────────────────────────────────────────────────────

async function scanR2() {
  const btn = document.getElementById('scan-btn');
  btn.disabled = true;
  btn.textContent = 'Scanning R2…';
  try {
    const res = await fetch('/api/admin/r2-scan');
    const d   = await res.json();
    btn.textContent = 'Scan R2 for Unindexed';
    btn.disabled = false;
    renderR2(d.folders || []);
  } catch(e) {
    showToast('Scan failed');
    btn.disabled = false;
    btn.textContent = 'Scan R2 for Unindexed';
  }
}

function renderR2(folders) {
  const section = document.getElementById('r2-section');
  const rows    = document.getElementById('r2-rows');
  if (!folders.length) {
    section.style.display = '';
    rows.innerHTML = '<div class="empty" style="padding:1rem;font-size:.82rem;color:rgba(255,255,255,.4)">No unindexed folders found in R2.</div>';
    return;
  }
  section.style.display = '';
  rows.innerHTML = folders.map(f => `
    <div class="folder-row is-r2" id="r2row_${f.folder_key.replace(/[^a-z0-9]/gi,'_')}">
      <span class="status-badge badge-r2">R2 Only</span>
      <span class="folder-name">${f.name || f.folder_slug || '—'}</span>
      <span class="folder-count">${f.photo_count} photos · ${f.date} · ${f.location}</span>
      <button class="btn btn-index" onclick="indexR2Folder(${JSON.stringify(f)}, this)">Index as Draft</button>
    </div>`).join('');
}

async function indexR2Folder(f, btn) {
  btn.disabled = true;
  btn.textContent = 'Indexing…';
  const res = await fetch('/api/admin/reindex-folder', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({date: f.date, location: f.location, folder: f.name})
  });
  const d = await res.json();
  if (d.indexed >= 0) {
    showToast(`${d.indexed} photos indexed as draft`);
    // Add to allFolders so it shows in the main list
    allFolders.push({
      folder_key:  f.folder_key,
      date:        f.date,
      location:    f.location,
      name:        f.name,
      photo_count: d.indexed,
      draft_count: d.indexed,
      is_zip:      false,
      group_size:  null,
    });
    render(allFolders);
    // Remove from R2 section
    const row = document.getElementById('r2row_' + f.folder_key.replace(/[^a-z0-9]/gi,'_'));
    if (row) row.remove();
  } else {
    showToast('Indexing failed');
    btn.disabled = false;
    btn.textContent = 'Index as Draft';
  }
}

function esc(s) { return (s||'').replace(/'/g, "\\'"); }

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

async function classifyFolderColors(folderKey, btn) {
  const f = allFolders.find(x => x.folder_key === folderKey);
  if (!f) return;
  btn.disabled = true;
  btn.textContent = 'Classifying…';
  try {
    const res = await fetch('/api/admin/classify-folder', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ date: f.date, location: f.location, folder: f.name })
    });
    const d = await res.json();
    if (res.ok) {
      if (d.queued === 0) {
        showToast(d.message || 'Already classified');
        btn.textContent = 'Classify Colors';
        btn.disabled = false;
      } else {
        showToast(`Classifying ${d.queued} photos…`);
        pollFolderClassify(d.job_id, btn);
      }
    } else {
      showToast(d.error || 'Classification failed');
      btn.textContent = 'Classify Colors';
      btn.disabled = false;
    }
  } catch(e) {
    showToast('Request failed');
    btn.textContent = 'Classify Colors';
    btn.disabled = false;
  }
}

async function pollFolderClassify(jobId, btn) {
  try {
    const r = await fetch(`/api/admin/embed-status?job_id=${jobId}`);
    const d = await r.json();
    if (d.finished) {
      showToast(`Done — ${d.done} photos classified`);
      btn.textContent = 'Classify Colors';
      btn.disabled = false;
    } else {
      btn.textContent = `${d.done}/${d.total}…`;
      setTimeout(() => pollFolderClassify(jobId, btn), 3000);
    }
  } catch(e) {
    btn.textContent = 'Classify Colors';
    btn.disabled = false;
  }
}

// ── Photo selector for targeted re-classification ─────────────────────────────
const _selState = {}; // folderKey → Set of selected paths

async function togglePhotoSelector(folderKey, btn) {
  const rowId  = `frow_${btoa(folderKey).replace(/=/g,'')}`;
  const panel  = document.getElementById('sel_' + rowId);
  if (!panel) return;
  if (panel.style.display !== 'none') {
    panel.style.display = 'none';
    btn.textContent = 'Select Photos';
    return;
  }
  btn.textContent = 'Loading…';
  btn.disabled = true;
  const f = allFolders.find(x => x.folder_key === folderKey);
  if (!f) return;
  const params = new URLSearchParams({date: f.date, location: f.location, group: f.name || ''});
  try {
    const r = await fetch('/api/admin/folder-photos?' + params);
    const d = await r.json();
    if (!_selState[folderKey]) _selState[folderKey] = new Set();
    const photos = d.photos || [];
    if (f) f._photos = photos;
    panel.innerHTML = renderPhotoSelector(folderKey, photos);
    panel.style.display = '';
    btn.textContent = 'Select Photos';
    btn.disabled = false;
  } catch(e) {
    showToast('Failed to load photos');
    btn.textContent = 'Select Photos';
    btn.disabled = false;
  }
}

function renderPhotoSelector(folderKey, photos) {
  if (!photos.length) return '<div style="color:rgba(255,255,255,.4);font-size:.8rem">No photos found</div>';
  const sel = _selState[folderKey] || new Set();
  const thumbBase = 'https://photos.bigskyphotos.com/';
  const COLORS = ['red','orange','yellow','green','blue','purple','pink','white','black','gray','brown','tan','teal','camo'];
  const HEX = {red:'#e04',orange:'#f70',yellow:'#fc0',green:'#3a5',blue:'#38f',purple:'#84c',pink:'#f6a',white:'#eee',black:'#333',gray:'#888',brown:'#964B00',tan:'#c8a96e',teal:'#0aa',camo:'#556b2f'};
  const grid = photos.map(p => {
    const isSel = sel.has(p.path);
    const safeKey = folderKey.replace(/'/g,"\\'");
    const safePath = p.path.replace(/'/g,"\\'");
    return `<div class="photo-sel-item${isSel?' selected':''}" id="psi_${btoa(p.path).replace(/[^a-zA-Z0-9]/g,'')}" onclick="toggleSelPhoto('${safeKey}','${safePath}',this)">
      <img src="${thumbBase}${p.path}" loading="lazy">
      <span class="sel-check">✓</span>
      <span class="edit-btn" onclick="event.stopPropagation();openColorEditor('${safeKey}','${safePath}')">✎</span>
      <span class="sel-label">${p.file.replace(/\.[^.]+$/,'')}</span>
    </div>`;
  }).join('');
  return `<div class="photo-selector-grid">${grid}</div>
    <div class="photo-sel-actions">
      <button class="btn btn-ghost" onclick="selectAllSel('${folderKey}')">Select All</button>
      <button class="btn btn-ghost" onclick="clearAllSel('${folderKey}')">Clear</button>
      <span class="sel-count" id="selcount_${folderKey}">0 selected</span>
      <button class="btn btn-classify-colors" id="selbtn_${folderKey}" onclick="reclassifySelected('${folderKey}')" disabled>Re-classify Selected</button>
    </div>`;
}

function toggleSelPhoto(folderKey, path, el) {
  if (!_selState[folderKey]) _selState[folderKey] = new Set();
  const sel = _selState[folderKey];
  if (sel.has(path)) { sel.delete(path); el.classList.remove('selected'); }
  else               { sel.add(path);    el.classList.add('selected'); }
  updateSelCount(folderKey);
}

function selectAllSel(folderKey) {
  const panel = document.querySelector(`[id^="sel_frow_"]`);
  document.querySelectorAll('.photo-sel-item').forEach(el => {
    const onclick = el.getAttribute('onclick') || '';
    const match = onclick.match(/'([^']+)','([^']+)'/);
    if (match && match[1] === folderKey) {
      _selState[folderKey].add(match[2]);
      el.classList.add('selected');
    }
  });
  updateSelCount(folderKey);
}

function clearAllSel(folderKey) {
  if (_selState[folderKey]) _selState[folderKey].clear();
  document.querySelectorAll('.photo-sel-item').forEach(el => el.classList.remove('selected'));
  updateSelCount(folderKey);
}

function updateSelCount(folderKey) {
  const n    = (_selState[folderKey] || new Set()).size;
  const cnt  = document.getElementById('selcount_' + folderKey);
  const btn  = document.getElementById('selbtn_'   + folderKey);
  if (cnt) cnt.textContent = `${n} selected`;
  if (btn) { btn.disabled = n === 0; btn.textContent = n ? `Re-classify ${n} Photo${n===1?'':'s'}` : 'Re-classify Selected'; }
}

async function reclassifySelected(folderKey) {
  const sel = _selState[folderKey];
  if (!sel || !sel.size) return;
  const btn = document.getElementById('selbtn_' + folderKey);
  btn.disabled = true;
  btn.textContent = 'Starting…';
  try {
    const r = await fetch('/api/admin/reclassify-photos', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({paths: [...sel]}),
    });
    const d = await r.json();
    if (!r.ok) { showToast(d.error || 'Failed'); btn.disabled = false; return; }
    showToast(`Re-classifying ${d.queued} photos…`);
    pollReclassify(d.job_id, folderKey, btn);
  } catch(e) {
    showToast('Request failed');
    btn.disabled = false;
    updateSelCount(folderKey);
  }
}

// ── Manual color editor ───────────────────────────────────────────────────────
const _ALL_COLORS = ['red','orange','yellow','green','blue','purple','pink','white','black','gray','brown','tan','teal','camo'];
const _HEX = {red:'#e04',orange:'#f70',yellow:'#fc0',green:'#3a5',blue:'#38f',purple:'#84c',pink:'#f6a',white:'#eee',black:'#333',gray:'#888',brown:'#964B00',tan:'#c8a96e',teal:'#0aa',camo:'#556b2f'};
let _editState = {};  // path → {jacket, pants, sport}

function openColorEditor(folderKey, path) {
  // Close any other open editor
  document.querySelectorAll('.color-editor').forEach(el => el.remove());
  const itemId = 'psi_' + btoa(path).replace(/[^a-zA-Z0-9]/g,'');
  const item = document.getElementById(itemId);
  if (!item) return;

  const photos = (allFolders.find(f => f.folder_key === folderKey)?._photos) || [];
  const p = photos.find(x => x.path === path) || {jacket:[], pants:[], sport:null};
  const cur = _editState[path] || {jacket:[...(p.jacket||[])], pants:[...(p.pants||[])], sport:p.sport||null};
  _editState[path] = cur;

  const colorRow = (label, key) => {
    const pills = _ALL_COLORS.map(c => {
      const on = cur[key].includes(c) ? ' on' : '';
      return `<span class="color-pill${on}" onclick="toggleEditColor('${path}','${key}','${c}',this)">
        <span class="color-pill-dot" style="background:${_HEX[c]||'#888'}"></span>${c}</span>`;
    }).join('');
    return `<div class="color-editor-row"><span class="color-editor-label">${label}</span>${pills}</div>`;
  };
  const sportRow = ['ski','snowboard'].map(s => {
    const on = cur.sport === s ? ' on' : '';
    return `<span class="sport-pill${on}" onclick="toggleEditSport('${path}','${s}',this)">${s}</span>`;
  }).join('');

  const div = document.createElement('div');
  div.className = 'color-editor';
  div.id = 'editor_' + itemId;
  div.innerHTML = `
    <div style="font-size:.72rem;font-weight:600;color:rgba(255,255,255,.5);margin-bottom:.5rem">${path.split('/').pop()}</div>
    ${colorRow('jacket','jacket')}
    ${colorRow('pants','pants')}
    <div class="color-editor-row"><span class="color-editor-label">sport</span>${sportRow}</div>
    <div style="display:flex;gap:.5rem;margin-top:.5rem">
      <button class="btn btn-classify-colors" onclick="saveColorEdit('${folderKey}','${path}',this)">Save</button>
      <button class="btn btn-ghost" onclick="this.closest('.color-editor').remove()">Cancel</button>
    </div>`;
  item.after(div);
}

function toggleEditColor(path, key, color, el) {
  const cur = _editState[path];
  if (!cur) return;
  const idx = cur[key].indexOf(color);
  if (idx >= 0) { cur[key].splice(idx,1); el.classList.remove('on'); }
  else          { cur[key].push(color);   el.classList.add('on'); }
}

function toggleEditSport(path, sport, el) {
  const cur = _editState[path];
  if (!cur) return;
  if (cur.sport === sport) { cur.sport = null; el.classList.remove('on'); }
  else {
    cur.sport = sport;
    el.closest('.color-editor-row').querySelectorAll('.sport-pill').forEach(e => e.classList.remove('on'));
    el.classList.add('on');
  }
}

async function saveColorEdit(folderKey, path, btn) {
  const cur = _editState[path];
  if (!cur) return;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const r = await fetch('/api/admin/set-photo-colors', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({path, jacket_colors: cur.jacket, pants_colors: cur.pants, sport: cur.sport}),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    showToast('Saved');
    btn.closest('.color-editor').remove();
    delete _editState[path];
  } catch(e) {
    showToast('Save failed: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}

async function pollReclassify(jobId, folderKey, btn) {
  try {
    const r = await fetch(`/api/admin/embed-status?job_id=${jobId}`);
    const d = await r.json();
    if (d.finished) {
      showToast(`Done — ${d.done} photos re-classified`);
      _selState[folderKey] = new Set();
      updateSelCount(folderKey);
    } else {
      btn.textContent = `${d.done}/${d.total}…`;
      setTimeout(() => pollReclassify(jobId, folderKey, btn), 2000);
    }
  } catch(e) {
    updateSelCount(folderKey);
  }
}
</script>

<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>__PARTNER__ Photos — Crystal Images</title>
<link href="/static/fonts/fonts.css" rel="stylesheet">
<style>
/* The gallery's look (templates/index.html): same container, day cards, photo cards and enlarged view */
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body { background:#0c2336; font-family:'DM Sans', sans-serif; color:#fff; min-height:100vh; }
.container { max-width:1400px; margin:0 auto; padding:2rem 1rem 4rem; }
@media(max-width:640px){ .container { padding:1rem .5rem 4rem; } }
button { font-family:inherit; }

.intro { margin-bottom:1.6rem; }
.intro h1 { color:#F5C518; font-size:1.5rem; font-weight:700; margin-bottom:.35rem; }
.welcome { font-size:.95rem; color:rgba(255,255,255,.75); line-height:1.55; }
.code { margin-top:.9rem; padding:.8rem 1rem; border:1px solid rgba(245,197,24,.3); border-radius:10px;
  background:rgba(245,197,24,.06); font-size:.9rem; line-height:1.5; color:rgba(255,255,255,.85); }
.code b { color:#F5C518; letter-spacing:.04em; }

.breadcrumb { display:none; align-items:center; gap:8px; margin-bottom:1.5rem; font-size:.85rem; color:rgba(255,255,255,.72); flex-wrap:wrap; }
.breadcrumb.show { display:flex; }
.crumb { cursor:pointer; color:#F5C518; text-decoration:underline; text-underline-offset:3px; background:none; border:none; font-size:inherit; padding:0; }
.sep { color:rgba(255,255,255,.6); }
.current { color:rgba(255,255,255,.75); }
.msg { text-align:center; color:rgba(255,255,255,.55); padding:2.5rem 0; font-size:.95rem; line-height:1.6; }

/* Day cards (the gallery's first page) */
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2rem; }
@media(max-width:900px){ .grid{ grid-template-columns:repeat(2,1fr); } }
@media(max-width:560px){ .grid{ grid-template-columns:1fr; } }
.grid-card { cursor:pointer; transition:transform .2s; }
.grid-card:hover { transform:translateY(-3px); }
.grid-card:hover .collage-inner { border-color:rgba(242,201,76,.5); }
.collage-inner { border:2px solid rgba(255,255,255,.08); border-radius:6px; overflow:hidden; margin-bottom:.75rem; transition:border-color .2s; }
.collage-2x2 { display:grid; grid-template-columns:1fr 1fr; gap:2px; background:#0a1e2e; }
.collage-2x2 img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#0a1e2e; }
.collage-single img { width:100%; aspect-ratio:3/2; object-fit:cover; display:block; background:#0a1e2e; }
.collage-placeholder { width:100%; aspect-ratio:1/1; background:#0a1e2e; }
.card-title { font-size:1rem; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:#fff; margin-bottom:.25rem; text-align:center; text-decoration:underline; text-underline-offset:3px; }
.card-sub { font-size:.8rem; color:rgba(255,255,255,.72); text-align:center; }

/* One day */
.gallery-header { display:flex; align-items:center; gap:1rem; margin-bottom:1rem; flex-wrap:wrap; }
.gallery-title { font-size:1.1rem; font-weight:600; }
.results-count { background:rgba(242,201,76,.15); border:1px solid rgba(242,201,76,.3); color:#F5C518; font-size:.8rem; font-weight:600; padding:3px 12px; border-radius:20px; }
.dl-box { display:flex; align-items:center; gap:.8rem 1rem; flex-wrap:wrap; margin-bottom:1.2rem;
  background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:.8rem 1rem; }
.dl-text { flex:1; min-width:220px; font-size:.86rem; color:rgba(255,255,255,.72); line-height:1.5; }
.dl-actions { display:flex; align-items:center; gap:.9rem; flex-wrap:wrap; }
.text-btn { background:none; border:none; color:#F5C518; font-size:.84rem; cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:0; }
.btn-main { background:#F5C518; color:#0c2336; font-weight:700; font-size:.92rem; border:none; border-radius:8px;
  padding:.62rem 1.3rem; cursor:pointer; white-space:nowrap; transition:background .2s; }
.btn-main:hover { background:#ffd700; }
.btn-main:disabled { opacity:.5; cursor:default; }
.btn-ghost { background:transparent; border:1px solid rgba(255,255,255,.25); color:rgba(255,255,255,.8);
  font-size:.88rem; font-weight:500; border-radius:8px; padding:.55rem 1.1rem; cursor:pointer; white-space:nowrap; }
.btn-ghost:hover { border-color:rgba(255,255,255,.5); color:#fff; }
@media(max-width:640px){ .dl-actions { width:100%; } .dl-actions .btn-main { flex:1; } }

/* Photo cards (the gallery's) */
.gallery { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
@media(max-width:640px){ .gallery { gap:4px; } }
.thumb-card { background:rgba(255,255,255,.04); border:2px solid rgba(255,255,255,.08); border-radius:4px; overflow:hidden;
  cursor:pointer; transition:transform .2s, border-color .2s, box-shadow .2s; position:relative; }
.thumb-card:hover { transform:translateY(-4px); border-color:rgba(242,201,76,.45); box-shadow:0 14px 36px rgba(0,0,0,.55); }
.thumb-card img { width:100%; height:100%; object-fit:cover; display:block; background:#0a1e2e; user-select:none; -webkit-user-drag:none; pointer-events:none; }
.thumb-card.portrait { grid-row:span 2; }
.thumb-card.selected { border-color:#F5C518; box-shadow:0 0 0 1px rgba(242,201,76,.4), 0 8px 24px rgba(0,0,0,.5); }
.card-btn-row { position:absolute; bottom:8px; left:8px; z-index:5; display:flex; opacity:0; transition:opacity .15s; }
.card-acts { position:absolute; bottom:8px; right:8px; z-index:5; display:flex; gap:5px; opacity:0; transition:opacity .15s; }
.thumb-card:hover .card-btn-row, .thumb-card:hover .card-acts,
.thumb-card.selected .card-btn-row, .thumb-card.selected .card-acts { opacity:1; }
.select-check { width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,.55); border:2px solid rgba(255,255,255,.55);
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:bold; color:#fff; cursor:pointer; padding:0; line-height:1; }
.thumb-card.selected .select-check { background:#F5C518; border-color:#F5C518; color:#0c2336; }
.card-btn { background:#F5C518; color:#0c2336; border:none; border-radius:6px; padding:.3rem .7rem; font-size:.75rem; font-weight:700;
  cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:4px; }
.card-btn.alt { background:rgba(0,0,0,.6); color:#fff; border:1px solid rgba(255,255,255,.35); }
.card-btn svg { flex-shrink:0; }
.select-check:focus-visible, .card-btn:focus-visible { outline:3px solid #fff; outline-offset:2px; }
@media(hover:none) and (pointer:coarse) {
  /* Phones and tablets: always shown, as small round buttons */
  .card-btn-row, .card-acts { opacity:1; bottom:6px; }
  .card-btn-row { left:6px; } .card-acts { right:6px; }
  .card-btn { padding:0; width:28px; height:28px; border-radius:50%; justify-content:center; }
  .card-btn .lbl { display:none; }
}
.range-on .thumb-card { cursor:crosshair; }

/* Enlarged view (the gallery's) */
.lb-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:99999; align-items:center; justify-content:center; flex-direction:column; }
.lb-overlay.open { display:flex; }
.lb-inner { position:relative; display:flex; flex-direction:column; align-items:center; width:92vw; max-width:1080px; }
.lb-img-wrap { position:relative; width:100%; display:flex; align-items:center; justify-content:center; min-height:30vh; }
#lb-photo { max-width:100%; max-height:74vh; object-fit:contain; border-radius:8px; box-shadow:0 0 80px rgba(0,0,0,.9); display:block; user-select:none; }
.lb-arrow { position:absolute; top:50%; transform:translateY(-50%); background:rgba(242,201,76,.92); color:#0c2336; border:none; border-radius:50%;
  width:50px; height:50px; font-size:22px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:10; }
.lb-arrow:hover { background:#F5C518; }
.lb-arrow.left { left:-64px; } .lb-arrow.right { right:-64px; }
@media(max-width:820px){ .lb-arrow.left{ left:6px; } .lb-arrow.right{ right:6px; } }
.lb-close { position:fixed; top:max(16px, env(safe-area-inset-top, 0px) + 8px); right:20px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
  color:#fff; border-radius:50%; width:42px; height:42px; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:100001; }
.lb-close:hover { background:rgba(255,255,255,.22); }
@media(hover:none) and (pointer:coarse) {
  .lb-close { width:52px; height:52px; font-size:22px; top:max(20px, env(safe-area-inset-top, 0px) + 12px); right:16px; background:rgba(0,0,0,.5); border-color:rgba(255,255,255,.4); }
}
.lb-btn-row { display:flex; gap:.6rem; justify-content:center; margin-top:14px; flex-wrap:wrap; }
.lb-select-btn { background:transparent; border:1px solid rgba(242,201,76,.5); color:#F5C518; font-weight:600; font-size:.85rem;
  border-radius:8px; padding:.5rem 1.4rem; cursor:pointer; }
.lb-select-btn:hover { background:rgba(242,201,76,.12); }
.lb-select-btn.selected-btn { background:#F5C518; color:#0c2336; border-color:#F5C518; }
.lb-shop-btn { background:#F5C518; color:#0c2336; font-weight:700; font-size:.85rem; border:none; border-radius:8px; padding:.5rem 1.4rem; cursor:pointer; }
.lb-shop-btn:hover { background:#e6b800; }
.lb-filename { color:rgba(255,255,255,.35); font-size:.74rem; margin-top:10px; }
.lb-counter { margin-top:6px; color:rgba(255,255,255,.28); font-size:.74rem; letter-spacing:1px; }

/* Print list bar (the gallery's cart bar) */
.cart-bar { display:none; position:fixed; bottom:0; left:0; right:0; z-index:9998; background:#0c2336; border-top:2px solid rgba(242,201,76,.4);
  padding:.9rem 2rem; align-items:center; gap:1rem; flex-wrap:wrap; }
.cart-bar.show { display:flex; }
.cart-count-text { font-weight:600; font-size:.95rem; }
.cart-note { flex:1; font-size:.78rem; color:rgba(255,255,255,.55); min-width:160px; }
.cart-actions { display:flex; gap:.6rem; margin-left:auto; }
@media(max-width:640px){ .cart-bar { padding:.75rem 1rem; } .cart-note { display:none; } }

/* Panels: prints, the prints question, Save to Photos */
.modal { position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:100005; display:none; align-items:flex-start; justify-content:center;
  overflow-y:auto; padding:2rem 1rem; }
.modal.open { display:flex; }
.modal.bottom { align-items:flex-end; padding-bottom:6rem; }
.box { background:#12283a; border:1px solid rgba(245,197,24,.3); border-radius:14px; width:100%; max-width:640px; padding:1.1rem 1.1rem 1rem; }
.box.small { max-width:440px; }
.box-title { color:#F5C518; font-weight:700; font-size:1.08rem; }
.box-sub { color:rgba(255,255,255,.7); font-size:.85rem; line-height:1.5; margin-top:.3rem; }
.box-foot { display:flex; align-items:center; justify-content:flex-end; gap:.6rem; margin-top:.9rem; flex-wrap:wrap; }
/* Prints: the gallery's shop panel (templates/index.html .qs-*), with a quantity for each print */
.qs-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:100006; align-items:center; justify-content:center; padding:1rem; }
.qs-overlay.open { display:flex; }
.qs-modal { background:#0e2a3a; border:1px solid rgba(255,255,255,.1); border-radius:16px; max-width:700px; width:100%; max-height:88vh; overflow:hidden; box-shadow:0 28px 80px rgba(0,0,0,.75); display:flex; position:relative; }
.qs-photo-panel { width:44%; flex-shrink:0; display:flex; flex-direction:column; background:#060f18; position:relative; }
.qs-modal.cart-only .qs-photo-panel { display:none; }
.qs-photo { display:block; width:100%; flex:1; object-fit:cover; min-height:180px; }
.qs-photo-meta { padding:.55rem .85rem; background:rgba(0,0,0,.5); border-top:1px solid rgba(255,255,255,.06); display:flex; align-items:center; gap:.5rem; }
.qs-filename { font-size:.68rem; color:rgba(255,255,255,.45); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pm-nav { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#fff; border-radius:6px; padding:.15rem .55rem; cursor:pointer; font-size:.8rem; }
.qs-body { flex:1; overflow-y:auto; padding:1rem 1.25rem 1.1rem; }
.qs-close { background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.18); color:#fff; border-radius:50%; width:28px; height:28px; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; position:absolute; top:.75rem; right:.75rem; z-index:10; }
.qs-section { margin-bottom:1rem; }
.qs-section-label { font-size:.62rem; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:rgba(255,255,255,.4); margin-bottom:.55rem; }
.qs-row { display:flex; align-items:center; justify-content:space-between; padding:.45rem 0; border-bottom:1px solid rgba(255,255,255,.05); gap:.5rem; }
.qs-row-label { font-size:.86rem; flex:1; }
.qs-row-prices { display:flex; align-items:center; gap:.4rem; flex-shrink:0; }
.qs-price { font-weight:700; color:#F5C518; font-size:.9rem; }
.qs-price-was { text-decoration:line-through; color:rgba(255,255,255,.35); font-size:.75rem; }
.qs-add-btn { background:#F5C518; color:#0c2336; font-weight:700; font-size:.75rem; border:none; border-radius:5px; padding:.3rem .8rem; cursor:pointer; }
.qs-add-btn:hover { background:#ffd700; }
.qs-logo-row { display:flex; align-items:center; gap:.6rem; padding:.55rem 0 .2rem; cursor:pointer; user-select:none; }
.qs-logo-row span { font-size:.82rem; color:rgba(255,255,255,.75); flex:1; }
.qs-logo-accent { color:#F5C518; font-weight:600; }
.qs-logo-toggle-track { width:34px; height:19px; border-radius:10px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.2); position:relative; flex-shrink:0; }
.qs-logo-toggle-track.on { background:#F5C518; border-color:#F5C518; }
.qs-logo-toggle-track::after { content:''; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#fff; transition:transform .2s; }
.qs-logo-toggle-track.on::after { transform:translateX(15px); background:#0c2336; }
.print-discount-banner { background:rgba(245,197,24,.1); border:1px solid rgba(245,197,24,.3); border-radius:6px; padding:.45rem .75rem; margin-bottom:.5rem; font-size:.78rem; color:#F5C518; }
.pm-ship { font-size:.75rem; color:#4ade80; margin:0 0 .4rem; }
.pm-frame-ask { text-align:center; padding:.3rem 0 .5rem; }
.pm-frame-ask img { width:100%; max-height:170px; object-fit:contain; border-radius:8px; background:#060f18; margin-bottom:.6rem; }
@media(max-height:520px){ .pm-frame-ask img { max-height:80px; } }   /* phones held sideways: keep Yes / No in view */
.pm-frame-q { font-weight:700; font-size:.95rem; }
.pm-frame-sub { font-size:.78rem; color:rgba(255,255,255,.6); margin:.25rem 0 .7rem; line-height:1.45; }
.pm-frame-btns { display:flex; gap:.5rem; justify-content:center; }
.pm-line { display:flex; align-items:center; gap:.6rem; padding:.4rem 0; border-bottom:1px solid rgba(255,255,255,.05); font-size:.82rem; }
.pm-line img { width:54px; height:38px; object-fit:cover; border-radius:4px; background:#0a1e2e; }
.pm-line-txt { flex:1; min-width:0; }
.pm-line-fn { font-size:.7rem; color:rgba(255,255,255,.45); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pm-qty { display:flex; align-items:center; gap:6px; }
.pm-qty button { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2); border-radius:5px; width:26px; height:26px; font-size:1rem; cursor:pointer; padding:0; line-height:1; }
.pm-qty span { min-width:18px; text-align:center; font-weight:600; }
.pm-line-price { min-width:58px; text-align:right; font-weight:600; }
.pm-empty { font-size:.8rem; color:rgba(255,255,255,.45); padding:.3rem 0; }
.pm-foot { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-top:.4rem; padding-top:.7rem; border-top:1px solid rgba(255,255,255,.1); }
.pm-total { flex-basis:100%; font-weight:700; }
.pm-foot .btn-ghost, .pm-foot .btn-main { flex:1; }
.toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#F5C518; color:#0c2336; font-weight:700; padding:.6rem 1.4rem; border-radius:8px; z-index:100010; font-size:.9rem; pointer-events:none; }
@media(max-width:560px){
  .qs-modal { flex-direction:column; max-height:92vh; overflow-y:auto; }
  .qs-photo-panel { width:100%; }
  .qs-photo { max-height:42vw; }
  .qs-body { overflow:visible; }
}
.save-status { font-size:.85rem; color:rgba(255,255,255,.75); margin-top:.6rem; line-height:1.5; min-height:1.3em; }
.save-prints { margin-top:.8rem; padding-top:.7rem; border-top:1px solid rgba(255,255,255,.1); font-size:.84rem; color:rgba(255,255,255,.75); }
img { -webkit-touch-callout:none; }
.gallery { user-select:none; -webkit-user-select:none; }    /* shift-click picks a range, not text */

/* On the store's screens (/store/<slug>): the store's header, no downloads, a form for the link */
.st-head { position:sticky; top:0; z-index:9000; display:flex; align-items:center; gap:1.5rem; padding:0 40px; height:96px;
  background:#063249; box-shadow:0 2px 14px rgba(0,0,0,.35); }
.st-logo img { height:72px; display:block; }
.st-title { flex:1; text-align:center; font-size:1.3rem; font-weight:700; color:#F5C518; }
.st-tools { display:flex; gap:.6rem; }
.st-btn { display:inline-flex; align-items:center; background:transparent; border:1px solid rgba(255,255,255,.3); color:#fff; font-size:.95rem;
  font-weight:600; border-radius:8px; padding:.55rem 1rem; cursor:pointer; text-decoration:none; font-family:inherit; }
.st-btn:hover { border-color:#fff; }
.st-btn:focus-visible { outline:3px solid #fff; outline-offset:2px; }
@media(max-width:700px){ .st-head { padding:.6rem 16px; height:auto; flex-wrap:wrap; gap:.6rem; } .st-title { order:3; flex-basis:100%; } .st-logo img { height:52px; } }
.st-prints { margin:1rem 0 0; padding:1.1rem 1.3rem; border-radius:12px; text-align:center;
  background:linear-gradient(90deg, rgba(245,197,24,.12), rgba(245,197,24,.22), rgba(245,197,24,.12)); border:2px solid rgba(245,197,24,.55); }
.st-prints-big { font-size:1.9rem; font-weight:800; color:#F5C518; line-height:1.2; }
.st-prints-sub { font-size:1.05rem; color:#fff; margin-top:.3rem; }
.store .card-acts, .store #lb-get, .store #lb-print, .store .cart-bar { display:none !important; }
.store .card-btn-row { opacity:1; }
.store .select-check { width:34px; height:34px; font-size:16px; }
.field { display:block; margin-top:.8rem; }
.field span { display:block; font-size:.78rem; color:rgba(255,255,255,.65); margin-bottom:.3rem; }
.field input { width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18); border-radius:8px; color:#fff;
  padding:.75rem .9rem; font-size:1rem; font-family:inherit; outline:none; }
.field input:focus { border-color:#F5C518; }
.field-row { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
@media(max-width:480px){ .field-row { grid-template-columns:1fr; } }
.send-err { color:#ff8a80; font-size:.85rem; min-height:1.2em; margin-top:.6rem; }
.send-done { text-align:center; }
.send-done img { width:240px; height:240px; background:#fff; border-radius:10px; padding:8px; margin:.8rem auto; display:block; }
.send-done .box-sub { text-align:center; }
.send-prints { margin-top:1rem; padding:.8rem 1rem; border-radius:10px; background:rgba(245,197,24,.1); border:1px solid rgba(245,197,24,.4);
  font-size:1.05rem; color:#fff; text-align:center; }
.send-prints b { color:#F5C518; }
</style>
<link rel="stylesheet" href="/static/theme-frontend.css">
</head>
<body>
__SITE_HEADER__
<div class="container" id="main">
  <div class="intro">
    <h1>__PARTNER__ Photos</h1>
    <div class="welcome">__WELCOME__</div>
    <div class="code" id="code" style="display:none"></div>
    <div class="st-prints" id="st-prints" style="display:none"></div>
  </div>
  <nav class="breadcrumb" id="crumbs" aria-label="Breadcrumb"></nav>
  <div id="view-days"><div class="msg">Loading photos...</div></div>
  <div id="view-day" style="display:none">
    <div class="gallery-header">
      <span class="gallery-title" id="day-title"></span>
      <span class="results-count" id="day-count"></span>
    </div>
    <div class="dl-box">
      <div class="dl-text" id="dl-text"></div>
      <div class="dl-actions">
        <button class="text-btn" id="dl-range" onclick="toggleRange()">Select a range</button>
        <button class="text-btn" id="dl-clear" onclick="clearSel()" style="display:none">Clear</button>
        <button class="btn-main" id="dl-main" onclick="bulkAction()"></button>
      </div>
    </div>
    <div class="gallery" id="gallery"></div>
  </div>
</div>
__SITE_FOOTER__

<div class="cart-bar" id="cart-bar">
  <span class="cart-count-text" id="cart-text"></span>
  <span class="cart-note" id="cart-note"></span>
  <div class="cart-actions">
    <button class="btn-ghost" onclick="openPrints([])">Review prints</button>
    <button class="btn-main" onclick="printCheckout()">Checkout</button>
  </div>
</div>

<div class="lb-overlay" id="lb" onclick="if(event.target === this) closeLb()">
  <button class="lb-close" onclick="closeLb()" aria-label="Close">✕</button>
  <div class="lb-inner">
    <div class="lb-img-wrap">
      <button class="lb-arrow left" onclick="lbStep(-1)" aria-label="Previous photo">&#8592;</button>
      <img id="lb-photo" src="" alt="">
      <button class="lb-arrow right" onclick="lbStep(1)" aria-label="Next photo">&#8594;</button>

    <div class="lb-btn-row">
      <button class="lb-select-btn" id="lb-select" onclick="lbToggleSelect()"></button>
      <button class="lb-shop-btn" id="lb-get" onclick="getOne(photos[lbIdx].path)"></button>
      <button class="lb-select-btn" id="lb-print" style="display:none" onclick="openPrints([photos[lbIdx].path])">Order prints</button>
    </div>
    <div class="lb-filename" id="lb-fn"></div>
    <div class="lb-counter" id="lb-ct"></div>
  </div>
</div>

<div class="qs-overlay" id="pm" onclick="if(event.target === this) closePrints()">
  <div class="qs-modal" id="pm-modal">
    <button class="qs-close" onclick="closePrints()" aria-label="Close">✕</button>
    <div class="qs-photo-panel">
      <img class="qs-photo" id="pm-photo" src="" alt="">
      <div class="qs-photo-meta">
        <button class="pm-nav" id="pm-prev" onclick="pmStep(-1)" aria-label="Previous photo">‹</button>
        <span class="qs-filename" id="pm-fn"></span>
        <button class="pm-nav" id="pm-next" onclick="pmStep(1)" aria-label="Next photo">›</button>
      </div>
    </div>
    <div class="qs-body" id="pm-body"></div>
  </div>
</div>

<div class="modal bottom" id="ask" onclick="if(event.target === this) noPrints()">
  <div class="box small">
    <div class="box-title">Would you like prints?</div>
    <div class="box-sub" id="ask-sub"></div>
    <div class="box-foot">
      <button class="btn-ghost" onclick="noPrints()">No thanks</button>
      <button class="btn-main" onclick="choosePrints()">Choose prints</button>

  <div class="box small">

    <div class="box-foot">
      <button class="btn-ghost" onclick="closeSaver()">Close</button>
      <button class="btn-main" id="saver-btn" onclick="saverTap()"></button>
    </div>
  </div>

<div class="modal" id="send" onclick="if(event.target === this && !sendBusy) closeSend()" role="dialog" aria-modal="true" aria-labelledby="send-title">
  <div class="box small" id="send-box"></div>
</div>

<form id="zipform" method="post" action="/partner/__SLUG__/zip" style="display:none">
  <input type="hidden" name="paths" id="zip-paths"><input type="hidden" name="date" id="zip-date">
</form>

<script>
const SLUG = '__SLUG__';
const STORE = __STORE__;        // on a store screen: pick photos, get a link (QR + email); no downloads here
if(STORE) document.body.classList.add('store');
let days = [];                   // [{date, photos:[{path, filename}]}], newest day first
let day = null;                  // the day that's open
let photos = [];                 // that day's photos, in the order taken
const selected = new Set();      // paths picked on the open day
let anchor = null;               // index of the last photo picked (for a range)
let rangeMode = false;           // "Select a range": the next two taps pick everything in between
const orient = {};               // path -> 'portrait' once its thumbnail has loaded

// Phones and tablets save into the Photos app (the share sheet's "Save Images"); a plain
// download lands in Files, where many people never find it.
const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const SAVE_OK = IS_MOBILE && (() => {
  try {
    const f = new File([new Blob(['x'], {type: 'image/jpeg'})], 't.jpg', {type: 'image/jpeg'});
    return !!(navigator.canShare && navigator.canShare({files: [f]}));
  } catch(e) { return false; }
})();
const ICON_DL = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';
const ICON_PRINT = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function plural(n, w){ return `${n} ${w}${n === 1 ? '' : 's'}`; }
function prettyDate(iso, weekday){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-US', weekday
    ? {weekday:'long', month:'long', day:'numeric', year:'numeric'} : {month:'long', day:'numeric', year:'numeric'});
}
function thumb(path){ return `/partner/${SLUG}/thumb?path=${encodeURIComponent(path)}`; }
function large(path){ return `/partner/${SLUG}/view?path=${encodeURIComponent(path)}`; }

// ── Loading and moving between pages (?day=YYYY-MM-DD, so Back works like the gallery) ──
async function load(){
  const r = await fetch(`/api/partner/${SLUG}/photos`);
  if(r.status === 401){ location.reload(); return; }
  const d = await r.json();
  if(d.family_code_message){
    const c = document.getElementById('code');
    // the code in bold; {gallery} (and an older message's site address) as a link to the gallery
    const gallery = STORE ? 'our photo gallery' : '<a href="/" style="color:#F5C518">our photo gallery</a>';
    c.innerHTML = esc(d.family_code_message).split(esc(d.family_code)).join(`<b>${esc(d.family_code)}</b>`)
      .split('{gallery}').join(gallery)
      .split('online at photos.bigskyphotos.com').join('online in photos.bigskyphotos.com')
      .split('photos.bigskyphotos.com').join(gallery);
    c.style.display = '';
  }
  PRINT_PCT = Number(d.print_pct) || 0;
  if(STORE && PRINT_PCT > 0){
    const b = document.getElementById('st-prints');
    b.innerHTML = `<div class="st-prints-big">${PRINT_PCT}% off prints of your photos</div>
      <div class="st-prints-sub">Pick your favorites and ask us at the counter.</div>`;
    b.style.display = '';
  }
  days = d.days;
  renderCartBar();
  route();
}
function go(date){
  history.pushState({}, '', date ? `?day=${date}` : location.pathname);
  route();
  window.scrollTo(0, 0);
}
window.addEventListener('popstate', route);
function route(){
  const want = new URLSearchParams(location.search).get('day');
  const found = days.find(x => x.date === want);
  if(found) showDay(found); else showDays();
}
function setCrumbs(current){
  const el = document.getElementById('crumbs');
  el.classList.toggle('show', !!current);
  el.innerHTML = current ? `<button class="crumb" onclick="go('')">All Days</button><span class="sep" aria-hidden="true">›</span><span class="current">${esc(current)}</span>` : '';
}

function showDays(){
  day = null; closeLb();
  document.getElementById('view-day').style.display = 'none';
  const el = document.getElementById('view-days');
  el.style.display = '';
  setCrumbs('');
  if(!days.length){
    el.innerHTML = '<div class="msg">No photos yet. They will show up here after your next day on the mountain.</div>';
    return;
  }
  el.innerHTML = `<div class="grid">${days.map(d => {
    const ph = d.photos;
    const collage = ph.length >= 4
      ? `<div class="collage-2x2">${ph.slice(0, 4).map(p => `<img src="${thumb(p.path)}" alt="" loading="lazy">`).join('')}</div>`
      : `<div class="collage-single"><img src="${thumb(ph[0].path)}" alt="" loading="lazy"></div>`;
    return `<div class="grid-card" role="link" tabindex="0" onclick="go('${d.date}')" onkeydown="if(event.key==='Enter')go('${d.date}')">
      <div class="collage-inner">${collage}</div>
      <div class="card-title">${esc(prettyDate(d.date, true))}</div>
      <div class="card-sub">${plural(ph.length, 'photo')}</div>
    </div>`;
  }).join('')}</div>`;
}

function showDay(d){
  closeLb();
  if(day !== d){ if(!STORE) selected.clear(); anchor = null; rangeMode = false; }
  day = d; photos = d.photos;
  document.getElementById('view-days').style.display = 'none';
  document.getElementById('view-day').style.display = '';
  setCrumbs(prettyDate(d.date, true));
  document.getElementById('day-title').textContent = prettyDate(d.date, true);
  document.getElementById('day-count').textContent = plural(photos.length, 'photo');
  const g = document.getElementById('gallery');
  g.innerHTML = photos.map((p, i) => `
    <div class="thumb-card${selected.has(p.path) ? ' selected' : ''}" id="card${i}" onclick="cardTap(event, ${i})">
      <img src="${thumb(p.path)}" alt="${esc(p.filename)}" loading="lazy" decoding="async" onload="thumbLoaded(this, ${i})">
      <div class="card-btn-row">
        <button type="button" class="select-check" onclick="event.stopPropagation(); pick(event, ${i})"
          aria-label="Select photo ${esc(p.filename)}" aria-pressed="${selected.has(p.path)}">✓</button>
      </div>
      ${STORE ? '' : `<div class="card-acts">
        ${PRINT_PCT > 0 ? `<button type="button" class="card-btn alt" onclick="event.stopPropagation(); openPrints([photos[${i}].path])"
          aria-label="Order prints of ${esc(p.filename)}">${ICON_PRINT}<span class="lbl">Prints</span></button>` : ''}
        <button type="button" class="card-btn" onclick="event.stopPropagation(); getOne(photos[${i}].path)"
          aria-label="${SAVE_OK ? 'Save' : 'Download'} ${esc(p.filename)}">${ICON_DL}<span class="lbl">${SAVE_OK ? 'Save' : 'Download'}</span></button>
      </div>`}
    </div>`).join('');
  layout();
  updateBox();
}
function thumbLoaded(img, i){
  if(img.naturalHeight > img.naturalWidth){
    orient[photos[i] && photos[i].path] = 'portrait';
    document.getElementById('card' + i)?.classList.add('portrait');
  }
}
function layout(){
  // The gallery's grid: 4 across (2 on phones), rows 2:3 of a column, portraits two rows tall
  const g = document.getElementById('gallery');
  const mobile = window.innerWidth <= 640;
  const cols = mobile ? 2 : 4, gap = mobile ? 4 : 10;
  g.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  const w = g.offsetWidth || (mobile ? 360 : 960);
  g.style.gridAutoRows = Math.round(((w - (cols - 1) * gap) / cols) * 2 / 3) + 'px';
}
let _rt;
window.addEventListener('resize', () => { clearTimeout(_rt); _rt = setTimeout(() => { if(day) layout(); }, 150); });

// ── Picking photos ──
function setSel(i, on){
  const p = photos[i];
  if(on) selected.add(p.path); else selected.delete(p.path);
  const c = document.getElementById('card' + i);
  if(c){ c.classList.toggle('selected', on); c.querySelector('.select-check').setAttribute('aria-pressed', on); }
}
function pick(e, i){
  if((e.shiftKey || rangeMode) && anchor !== null && anchor !== i){
    // Like the gallery: shift-click picks everything between the last photo clicked and this one
    // (or unpicks it all when this one was picked); the next shift-click goes on from here
    window.getSelection()?.removeAllRanges();
    const on = rangeMode || !selected.has(photos[i].path);
    const [a, b] = [Math.min(anchor, i), Math.max(anchor, i)];
    for(let k = a; k <= b; k++) setSel(k, on);
    anchor = i;
    if(rangeMode) toggleRange(false);
  } else if(rangeMode){                          // the first photo of a range is always picked
    setSel(i, true);
    anchor = i;
  } else {
    setSel(i, !selected.has(photos[i].path));
    anchor = i;
  }
  updateBox();
}
function cardTap(e, i){
  if(rangeMode || e.shiftKey){ pick(e, i); return; }
  openLb(i);
}
function toggleRange(on){
  rangeMode = typeof on === 'boolean' ? on : !rangeMode;
  anchor = rangeMode ? null : anchor;
  document.getElementById('gallery').classList.toggle('range-on', rangeMode);
  updateBox();
}
function clearSel(){
  if(STORE) selected.clear();                     // the store screen's picks span days
  photos.forEach((p, i) => { if(selected.has(p.path)) setSel(i, false); });
  anchor = null; toggleRange(false);
}
function updateBox(){
  if(STORE){ updateStoreBox(); return; }
  const n = selected.size, total = photos.length;
  const verb = SAVE_OK ? 'Save' : 'Download';
  document.getElementById('dl-main').textContent = n
    ? (SAVE_OK ? `Save ${n} selected to Photos` : `Download ${n} selected`)
    : (SAVE_OK ? `Save all ${total} to Photos` : `Download all ${total} photos`);
  document.getElementById('dl-clear').style.display = n ? '' : 'none';
  document.getElementById('dl-range').textContent = rangeMode ? 'Cancel range' : 'Select a range';
  document.getElementById('dl-text').textContent = rangeMode
    ? (anchor === null ? 'Range: tap the first photo.' : 'Range: now tap the last photo.')
    : n ? `${plural(n, 'photo')} selected. Tap ✓ on more, or ${verb.toLowerCase()} them now.`
        : `Free to ${SAVE_OK ? 'save' : 'download'}: tap ✓ on photos to pick some, or ${SAVE_OK ? 'save' : 'get'} the whole day.`;
}

// ── Downloading (computers) and saving to Photos (phones and tablets) ──
function chosenPaths(){
  if(STORE && selected.size) return [...selected];          // picked on any day
  const picked = photos.filter(p => selected.has(p.path)).map(p => p.path);
  return picked.length ? picked : photos.map(p => p.path);
}
function bulkAction(){
  const paths = chosenPaths();
  if(!paths.length) return;
  if(STORE){ openSend(paths); return; }
  if(SAVE_OK){ startSaver(paths); return; }
  if(paths.length === 1){ location.href = `/partner/${SLUG}/file?path=${encodeURIComponent(paths[0])}`; }
  else {
    const whole = !selected.size;
    document.getElementById('zip-paths').value = whole ? '[]' : JSON.stringify(paths);
    document.getElementById('zip-date').value = whole ? day.date : '';
    document.getElementById('zipform').submit();
  }
  askPrints(paths);
}
function getOne(path){
  if(SAVE_OK){ startSaver([path]); return; }
  location.href = `/partner/${SLUG}/file?path=${encodeURIComponent(path)}`;
}

// Sharing has to start from a tap, so photos are fetched first (10 at a time), then the
// "Save" tap opens the share sheet right away.
const BATCH = 10;
let job = null;                  // {paths, next, ready, busy}
async function fetchFiles(paths){
  const r = await fetch(`/partner/${SLUG}/links`, {method: 'POST', headers: {'Content-Type': 'application/json'},
                                                  body: JSON.stringify({paths})});
  if(!r.ok) throw new Error('Could not get the photos');
  const links = (await r.json()).files;
  const out = new Array(links.length);
  let i = 0, done = 0;
  async function worker(){
    while(i < links.length){
      const k = i++;
      const res = await fetch(links[k].url);
      if(!res.ok) throw new Error('Could not load ' + links[k].name);
      out[k] = new File([await res.blob()], links[k].name, {type: 'image/jpeg'});
      saverStatus(`Getting your photos ready: ${++done} of ${links.length}...`);
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  return out;
}
function saverStatus(t){ document.getElementById('saver-status').textContent = t; }
function saverButton(label, enabled){
  const b = document.getElementById('saver-btn');
  b.textContent = label; b.disabled = !enabled; b.style.display = label ? '' : 'none';
}
async function startSaver(paths){
  closeLb();
  job = {paths, next: 0, ready: null, busy: false};
  document.getElementById('saver-prints').style.display = 'none';
  document.getElementById('saver').classList.add('open');
  await prepareBatch();
}
async function prepareBatch(){
  if(!job) return;
  const total = job.paths.length, batch = job.paths.slice(job.next, job.next + BATCH);
  job.busy = true; saverButton('Getting ready...', false);
  saverStatus(total > BATCH ? `Photos ${job.next + 1}–${job.next + batch.length} of ${total}: getting them ready...` : 'Getting your photos ready...');
  try {
    job.ready = await fetchFiles(batch);
    saverStatus(total > BATCH
      ? `Photos ${job.next + 1}–${job.next + batch.length} of ${total} are ready. Tap Save, then choose "Save Images".`
      : `Ready. Tap Save, then choose "Save Image${batch.length === 1 ? '' : 's'}".`);
    saverButton(batch.length === 1 ? 'Save photo' : `Save ${batch.length} photos`, true);
  } catch(e) {
    saverStatus(e.message + '. Please try again.'); saverButton('Try again', true); job.ready = null;
  } finally { if(job) job.busy = false; }
}
async function saverTap(){
  if(!job || job.busy) return;
  if(!job.ready){ await prepareBatch(); return; }
  try {
    await navigator.share({files: job.ready});
  } catch(e) {
    if(e.name !== 'AbortError') saverStatus("Saving didn't work here. Please try again.");
    return;
  }
  job.next += job.ready.length; job.ready = null;
  const left = job.paths.length - job.next;
  if(left > 0){
    await prepareBatch();                        // the next ones get ready on their own: one tap per batch
  } else {
    saverStatus(job.paths.length === 1 ? 'Saved. It is in your Photos app.' : `All ${job.paths.length} saved. They are in your Photos app.`);
    saverButton('', false);
    const paths = job.paths; job = null;
    if(PRINT_PCT > 0){
      const box = document.getElementById('saver-prints');
      box.innerHTML = `Would you like prints of ${paths.length === 1 ? 'this photo' : 'any of these'}? ${PRINT_PCT}% off, shipped to you.
        <div class="box-foot" style="justify-content:flex-start"><button class="btn-main" id="saver-choose">Choose prints</button></div>`;
      box.style.display = '';
      document.getElementById('saver-choose').onclick = () => { closeSaver(); openPrints(paths); };
    }
  }
}
function closeSaver(){ job = null; document.getElementById('saver').classList.remove('open'); }

// After a download on a computer: offer prints of those photos (once per visit after "No thanks")
let askPaths = [];
function askPrints(paths){
  if(PRINT_PCT <= 0) return;
  try { if(sessionStorage.getItem('ci_partner_no_prints')) return; } catch(e) {}
  askPaths = paths;
  document.getElementById('ask-sub').textContent = `Your download has started. Would you like prints of ${paths.length === 1 ? 'this photo' : 'any of these photos'}? `
    + `${PRINT_PCT}% off prints, shipped to you.`;
  setTimeout(() => document.getElementById('ask').classList.add('open'), 600);
}
function noPrints(){
  document.getElementById('ask').classList.remove('open');
  try { sessionStorage.setItem('ci_partner_no_prints', '1'); } catch(e) {}
}
function choosePrints(){ document.getElementById('ask').classList.remove('open'); openPrints(askPaths); }

// ── Enlarged view ──
let lbIdx = 0, _lbWant = '';
function openLb(i){
  lbIdx = i;
  const p = photos[i];
  const img = document.getElementById('lb-photo');
  img.src = thumb(p.path);                       // the small one shows at once (already loaded)
  img.alt = p.filename;
  _lbWant = p.path;
  const big = new Image();
  big.onload = () => { if(_lbWant === p.path) img.src = big.src; };
  big.src = large(p.path);
  [i + 1, i - 1].forEach(k => { const q = photos[(k + photos.length) % photos.length]; if(q) new Image().src = large(q.path); });
  document.getElementById('lb-get').textContent = SAVE_OK ? 'Save to Photos' : 'Download';
  document.getElementById('lb-print').style.display = PRINT_PCT > 0 && !STORE ? '' : 'none';
  lbSelectLabel();
  document.getElementById('lb-fn').textContent = p.filename;
  document.getElementById('lb-ct').textContent = `${i + 1} / ${photos.length}`;
  document.getElementById('lb').classList.add('open');
}
function lbSelectLabel(){
  const on = selected.has(photos[lbIdx].path);
  const b = document.getElementById('lb-select');
  b.textContent = on ? '✓ Selected' : '+ Add to Selection';
  b.classList.toggle('selected-btn', on);
}
function lbToggleSelect(){ setSel(lbIdx, !selected.has(photos[lbIdx].path)); anchor = lbIdx; lbSelectLabel(); updateBox(); }
function lbStep(d){ if(photos.length) openLb((lbIdx + d + photos.length) % photos.length); }
function closeLb(){ document.getElementById('lb').classList.remove('open'); _lbWant = ''; }
document.addEventListener('keydown', e => {
  if(!document.getElementById('lb').classList.contains('open')) return;
  if(e.key === 'Escape') closeLb();
  if(e.key === 'ArrowRight') lbStep(1);
  if(e.key === 'ArrowLeft') lbStep(-1);
});
let _tx = null;
document.getElementById('lb').addEventListener('touchstart', e => { _tx = e.touches[0].clientX; }, {passive: true});
document.getElementById('lb').addEventListener('touchend', e => {
  if(_tx === null) return;
  const dx = e.changedTouches[0].clientX - _tx; _tx = null;
  if(Math.abs(dx) > 50) lbStep(dx < 0 ? 1 : -1);
}, {passive: true});

// ── Prints, at the partner's discount, through the store's normal checkout ──
// The gallery's shop panel (photo, sizes, logo, the frame question) with a quantity for each
// print. Prices here are what the checkout will show; the server works them out again (the
// discount only applies while this browser is signed in to this page). Prints ship.
let PRINT_PCT = 0, PRINT_SIZES = [], LOGO_FEE = 2, FREE_SHIP = 3;
// The store's frame, at its regular price (only the print gets the partner discount)
const FRAME_NAME = 'Rustic Big Sky Picture Frame';
const FRAME_PICS = ['/frames/frame_5x7_landscape_5.jpg', '/frames/frame_8x10_landscape_1.jpg',
                    '/frames/frame_10x13_landscape_1.jpg', '/frames/frame_16x20_landscape_1.jpg'];
let FRAME_PRICES = [];
const CART_KEY = `ci_partner_prints_${SLUG}`;
const MAX_QTY = 20;
// One line per photo + size + frame + logo, with how many: {photoPath, filename, sizeIdx, size,
// price (one print, logo and frame included), frame, framePrice, orientation, _logo, _logoPrice, qty}
let printCart = (() => { try { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); } catch(e) { return []; } })();
printCart.forEach(it => { it.qty = Math.min(MAX_QTY, Math.max(1, parseInt(it.qty) || 1)); });
let pm = {paths: [], at: 0, logo: false, frameFor: null};   // photos being shopped, the one showing, logo switch, a size waiting on the frame question

function money(n){ return '$' + Number(n).toFixed(2); }
function salePrice(si){ return Math.round(PRINT_SIZES[si].price * (1 - PRINT_PCT / 100) * 100) / 100; }
function cartCount(){ return printCart.reduce((a, it) => a + it.qty, 0); }
function cartTotal(){ return printCart.reduce((a, it) => a + it.price * it.qty, 0); }
function storeCart(){ try { localStorage.setItem(CART_KEY, JSON.stringify(printCart)); } catch(e) {} renderCartBar(); }
function renderCartBar(){
  const bar = document.getElementById('cart-bar');
  const on = !STORE && printCart.length > 0 && PRINT_PCT > 0;
  bar.classList.toggle('show', on);
  document.getElementById('main').style.paddingBottom = on ? '7rem' : '';
  if(!on) return;
  document.getElementById('cart-text').textContent = `${plural(cartCount(), 'print')} · ${money(cartTotal())}`;
  document.getElementById('cart-note').textContent = `${PRINT_PCT}% off prints. Shipping is added at checkout.`;
}
async function loadPrintPrices(){
  if(PRINT_SIZES.length) return;
  const [pp, sp] = await Promise.all([fetch('/api/print-pricing').then(r => r.json()), fetch('/api/shop-prices').then(r => r.json())]);
  PRINT_SIZES = pp.sizes || []; FREE_SHIP = pp.free_ship_threshold || 3;
  if(typeof sp.logo_fee === 'number') LOGO_FEE = sp.logo_fee;
  FRAME_PRICES = (sp.frame_prices || []).map(f => (f && f.landscape != null) ? Number(f.landscape) : null);
}
function photoByPath(path){
  for(const d of days){ const p = d.photos.find(x => x.path === path); if(p) return p; }
  return null;
}
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

async function openPrints(paths){
  try { await loadPrintPrices(); } catch(e) { alert('Print prices could not be loaded. Please try again.'); return; }
  closeLb();
  pm = {paths: paths || [], at: 0, logo: false, frameFor: null};
  renderPm();
  document.getElementById('pm').classList.add('open');
}
function closePrints(){ document.getElementById('pm').classList.remove('open'); }
function pmStep(d){
  if(pm.paths.length < 2) return;
  pm.at = (pm.at + d + pm.paths.length) % pm.paths.length;
  pm.frameFor = null;
  renderPm();
}
function pmLogo(){ pm.logo = !pm.logo; renderPm(); }

function renderPm(){
  const path = pm.paths[pm.at];
  document.getElementById('pm-modal').classList.toggle('cart-only', !path);
  if(path){
    const img = document.getElementById('pm-photo');
    img.src = thumb(path);
    const big = new Image();
    big.onload = () => { if(pm.paths[pm.at] === path) img.src = big.src; };
    big.src = large(path);
    const p = photoByPath(path);
    document.getElementById('pm-fn').textContent = (p ? p.filename : '') + (pm.paths.length > 1 ? ` · ${pm.at + 1} of ${pm.paths.length}` : '');
    document.getElementById('pm-prev').style.display = document.getElementById('pm-next').style.display = pm.paths.length > 1 ? '' : 'none';
  }
  let html = '';
  if(path){
    const unframed = printCart.filter(it => !it.frame || it.frame === 'No Frame').reduce((a, it) => a + it.qty, 0);
    const need = FREE_SHIP - unframed;
    html += `<div class="qs-section"><div class="qs-section-label">Prints</div>
      <div class="print-discount-banner"><strong>${PRINT_PCT}% off prints</strong> of your photos. Frames are regular price.</div>
      <div class="pm-ship">${need > 0 ? `Add ${need} more unframed print${need === 1 ? '' : 's'} for free shipping` : 'Free shipping included on your prints!'}</div>`;
    if(pm.frameFor !== null){
      const si = pm.frameFor;
      html += `<div class="pm-frame-ask">
        <img src="${FRAME_PICS[si] || FRAME_PICS[0]}" alt="${esc(FRAME_NAME)}">
        <div class="pm-frame-q">Add a frame to your ${esc(PRINT_SIZES[si].label)} print?</div>
        <div class="pm-frame-sub">${esc(FRAME_NAME)}, ${money(FRAME_PRICES[si])} (regular price). It comes in the right orientation for your photo.</div>
        <div class="pm-frame-btns"><button class="btn-ghost" onclick="pmAdd(${si}, false)">No thanks</button>
          <button class="btn-main" onclick="pmAdd(${si}, true)">Yes, add frame</button></div></div>`;
    } else {
      const lf = pm.logo ? LOGO_FEE : 0;
      html += PRINT_SIZES.map((s, si) => `<div class="qs-row"><span class="qs-row-label">${esc(s.label)} Print</span>
        <div class="qs-row-prices"><span class="qs-price-was">${money(s.price + lf)}</span>
          <span class="qs-price">${money(salePrice(si) + lf)}</span>
          <button class="qs-add-btn" onclick="pmChoose(${si})">Add</button></div></div>`).join('')
        + `<div class="qs-logo-row" onclick="pmLogo()" role="switch" aria-checked="${pm.logo}">
          <div class="qs-logo-toggle-track${pm.logo ? ' on' : ''}"></div>
          <span>${pm.logo ? 'Big Sky Resort logo on prints' : 'Add the Big Sky Resort logo'} <span class="qs-logo-accent">+${money(LOGO_FEE)} each</span></span></div>`;
    }
    html += '</div>';
  }
  // The print order: this photo's prints (shown once it has some, to change how many), or
  // everything (from the print list button)
  const lines = printCart.map((it, i) => ({it, i})).filter(x => !path || x.it.photoPath === path);
  if(lines.length || !path) html += `<div class="qs-section"><div class="qs-section-label">${path ? 'This photo\'s prints in your order' : 'Your print order'}</div>`
    + (lines.length ? lines.map(({it, i}) => `<div class="pm-line">
        ${path ? '' : `<img src="${thumb(it.photoPath)}" alt="">`}
        <div class="pm-line-txt"><div>${esc(it.size)} print${it.frame && it.frame !== 'No Frame' ? ' + frame' : ''}${it._logo ? ' + logo' : ''}</div>
          ${path ? '' : `<div class="pm-line-fn">${esc(it.filename)}</div>`}</div>
        <div class="pm-qty"><button onclick="pmQty(${i}, -1)" aria-label="One fewer">−</button><span>${it.qty}</span>
          <button onclick="pmQty(${i}, 1)" aria-label="One more">+</button></div>
        <span class="pm-line-price">${money(it.price * it.qty)}</span></div>`).join('')
      : (path ? '' : `<div class="pm-empty">No prints added yet.</div>`))
    + (lines.length || !path ? '</div>' : '');
  html += `<div class="pm-foot"><span class="pm-total">${cartCount() ? `${plural(cartCount(), 'print')} · ${money(cartTotal())}` : ''}</span>
    <button class="btn-ghost" onclick="closePrints()">Keep browsing</button>
    <button class="btn-main" onclick="printCheckout()"${cartCount() ? '' : ' disabled'}>Checkout</button></div>`;
  document.getElementById('pm-body').innerHTML = html;
}
function pmChoose(si){
  // Like the gallery: a size with a frame available asks about the frame first
  if(FRAME_PRICES[si]){ pm.frameFor = si; renderPm(); }
  else pmAdd(si, false);
}
function pmAdd(si, framed){
  const path = pm.paths[pm.at], p = photoByPath(path);
  framed = framed && !!FRAME_PRICES[si];
  const frame = framed ? FRAME_NAME : 'No Frame', framePrice = framed ? FRAME_PRICES[si] : 0, logo = pm.logo;
  const same = printCart.find(it => it.photoPath === path && it.sizeIdx === si && it.frame === frame && !!it._logo === logo);
  if(same) same.qty = Math.min(MAX_QTY, same.qty + 1);
  else printCart.push({photoPath: path, filename: p ? p.filename : path.split('/').pop(), sizeIdx: si,
                       size: PRINT_SIZES[si].label, price: salePrice(si) + (logo ? LOGO_FEE : 0) + framePrice,
                       frame, framePrice, orientation: orient[path] || 'landscape',
                       _logo: logo, _logoPrice: logo ? LOGO_FEE : 0, location: '', qty: 1});
  pm.frameFor = null;
  storeCart(); renderPm();
  showToast(`${PRINT_SIZES[si].label} print added`);
}
function pmQty(i, d){
  const it = printCart[i];
  if(!it) return;
  it.qty = Math.min(MAX_QTY, it.qty + d);
  if(it.qty <= 0) printCart.splice(i, 1);
  storeCart(); renderPm();
}
function printCheckout(){
  if(!printCart.length) return;
  // The checkout takes one entry per print, so a line with a quantity goes in that many times
  const prints = printCart.flatMap(it => { const {qty, ...one} = it; return Array.from({length: qty}, () => ({...one})); });
  localStorage.setItem('ci_checkout_cart', JSON.stringify({
    folderCarts: {}, printCart: prints, frameCart: [], returnUrl: location.href, timestamp: Date.now(),
  }));
  location.href = '/checkout';          // the checkout empties this print list once the order goes through
}

// ── Store screens: the photos picked go to the family as a link (QR code + email) ──
function updateStoreBox(){
  const n = selected.size, total = photos.length;
  const here = photos.filter(p => selected.has(p.path)).length;
  document.getElementById('dl-main').textContent = n ? `Get my ${plural(n, 'photo')}` : `Get all ${total} photos from this day`;
  document.getElementById('dl-clear').style.display = n ? '' : 'none';
  document.getElementById('dl-range').textContent = rangeMode ? 'Cancel range' : 'Select a range';
  document.getElementById('dl-text').textContent = rangeMode
    ? (anchor === null ? 'Range: tap the first photo.' : 'Range: now tap the last photo.')
    : n ? `${plural(n, 'photo')} picked${here < n ? ` (${here} on this day)` : ''}. Tap ✓ on more, or get them now: free.`
        : 'Your photos are free. Tap ✓ on the ones you want (shift-click picks a range), or get the whole day.';
}
function clearAllPicks(){ selected.clear(); anchor = null; rangeMode = false; }
let sendPaths = [], sendBusy = false;
function openSend(paths){
  closeLb();
  sendPaths = paths;
  document.getElementById('send-box').innerHTML = `
    <div class="box-title" id="send-title">Get your ${plural(paths.length, 'photo')}</div>
    <div class="box-sub">We'll send you a link to download them, free. You can also scan it here with your phone.</div>
    <div class="field-row">
      <label class="field"><span>First name</span><input id="sf-first" autocomplete="off" maxlength="40"></label>
      <label class="field"><span>Last name</span><input id="sf-last" autocomplete="off" maxlength="40"></label>
    </div>
    <label class="field"><span>Email</span><input id="sf-email" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="120"></label>
    <div class="send-err" id="sf-err" role="alert"></div>
    <div class="box-foot">
      <button class="btn-ghost" onclick="closeSend()">Cancel</button>
      <button class="btn-main" id="sf-go" onclick="sendPhotos()">Send my photos</button>
    </div>`;
  document.getElementById('send').classList.add('open');
  document.getElementById('send-box').querySelectorAll('input').forEach(inp =>
    inp.addEventListener('keydown', e => { if(e.key === 'Enter') sendPhotos(); }));
  setTimeout(() => document.getElementById('sf-first').focus(), 50);
}
function closeSend(){ document.getElementById('send').classList.remove('open'); }
async function sendPhotos(){
  if(sendBusy) return;
  const v = id => document.getElementById(id).value.trim();
  const first = v('sf-first'), last = v('sf-last'), email = v('sf-email');
  const err = document.getElementById('sf-err');
  if(!first || !last){ err.textContent = 'Please enter your first and last name.'; return; }
  if(!/^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$/.test(email)){ err.textContent = 'Please enter a valid email.'; return; }
  err.textContent = '';
  sendBusy = true;
  const btn = document.getElementById('sf-go');
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    const r = await fetch(`/api/store/partner/${SLUG}/send`, {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({paths: sendPaths, first_name: first, last_name: last, email})});
    const d = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(d.error || 'Something went wrong. Please try again.');
    document.getElementById('send-box').innerHTML = `<div class="send-done">
      <div class="box-title" id="send-title">Your photos are ready, ${esc(first)}!</div>
      <img src="/api/pos/download-qr?token=${encodeURIComponent(d.token)}" alt="QR code for your download link">
      <div class="box-sub">Scan with your phone camera to save them now.<br>We also emailed the link to <b>${esc(email)}</b>.</div>
      ${PRINT_PCT > 0 ? `<div class="send-prints"><b>${PRINT_PCT}% off prints</b> of your photos. Ask us at the counter!</div>` : ''}
      <div class="box-foot" style="justify-content:center"><button class="btn-main" onclick="sendDone()">Done</button></div></div>`;
  } catch(e) {
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = 'Send my photos';
  } finally {
    sendBusy = false;
  }
}
function sendDone(){
  // Ready for the next family
  closeSend();
  clearAllPicks();
  go('');
}
function storeStartOver(){
  if(selected.size && !confirm('Clear the photos picked and start over?')) return;
  closeSend(); clearAllPicks(); go('');
}

load();
</script>

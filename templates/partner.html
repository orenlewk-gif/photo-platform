<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>__PARTNER__ Photos — Crystal Images</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1f2d;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
header{padding:1.1rem 1rem .9rem;max-width:1400px;margin:0 auto}
.brand{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45)}
h1{color:#F2C94C;font-size:1.3rem;margin:.2rem 0 .35rem}
.welcome{font-size:.9rem;color:rgba(255,255,255,.75);line-height:1.5}
.code{margin-top:.8rem;background:rgba(242,201,76,.1);border:1px solid rgba(242,201,76,.35);border-radius:8px;
  padding:.65rem .85rem;font-size:.86rem;line-height:1.5}
.code b{color:#F2C94C;letter-spacing:.04em}
.bar{position:sticky;top:0;z-index:20;background:rgba(13,31,45,.96);backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(255,255,255,.08)}
.bar-in{max-width:1400px;margin:0 auto;padding:.6rem 1rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.count{font-size:.85rem;color:rgba(255,255,255,.7);margin-right:auto}
.btn{background:#F2C94C;color:#0d1f2d;border:none;border-radius:7px;padding:.5rem .95rem;font-weight:700;
  font-size:.84rem;cursor:pointer;white-space:nowrap}
.btn.alt{background:rgba(255,255,255,.1);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.range{display:flex;align-items:center;gap:.4rem;font-size:.82rem;color:rgba(255,255,255,.75);cursor:pointer;user-select:none}
.range input{accent-color:#F2C94C;width:16px;height:16px}
main{max-width:1400px;margin:0 auto;padding:.4rem 1rem 3rem}
.day{margin-top:1.3rem}
.day-head{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:.6rem}
.day-title{font-size:1.02rem;font-weight:700}
.day-count{font-size:.8rem;color:rgba(255,255,255,.5);margin-right:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ph{position:relative;aspect-ratio:3/2;border-radius:6px;overflow:hidden;background:#111;cursor:pointer;
  -webkit-tap-highlight-color:transparent;border:2px solid transparent}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.sel{border-color:#F2C94C}
.ph.sel img{opacity:.75}
.chk{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;
  background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.ph.sel .chk{background:#F2C94C;border-color:#F2C94C;color:#0d1f2d}
.zoom{position:absolute;bottom:6px;right:6px;border:none;border-radius:5px;background:rgba(0,0,0,.6);color:#fff;
  font-size:.7rem;font-weight:700;padding:3px 8px;cursor:pointer}
.empty{text-align:center;color:rgba(255,255,255,.6);padding:3rem 1rem;font-size:.92rem;line-height:1.6}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:50;display:none;flex-direction:column;
  align-items:center;justify-content:center}
#lb.open{display:flex}
#lb img{max-width:94vw;max-height:80vh;object-fit:contain;border-radius:4px}
#lb-bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:flex-end;gap:.6rem;padding:.8rem 1rem}
#lb-nav{display:flex;gap:.6rem;margin-top:.8rem}
.save-hint{width:100%;font-size:.8rem;color:rgba(255,255,255,.7)}
.foot{text-align:center;font-size:.75rem;color:rgba(255,255,255,.35);padding:1rem}
</style></head>
<body>
<header>
  <div class="brand">Crystal Images</div>
  <h1>__PARTNER__ Photos</h1>
  <div class="welcome">__WELCOME__</div>
  <div class="code" id="code" style="display:none"></div>
</header>
<div class="bar"><div class="bar-in">
  <span class="count" id="count">Tap photos to select them</span>
  <label class="range" title="Tap the first photo, then the last, to select everything in between">
    <input type="checkbox" id="range" onchange="rangeChanged()"> <span id="range-hint">Range select</span>
  </label>
  <button class="btn alt" id="clear" onclick="clearSel()" disabled>Clear</button>
  <button class="btn" id="save-sel" onclick="saveSelected()" disabled style="display:none">Save to Photos</button>
  <button class="btn" id="dl-sel" onclick="downloadSelected()" disabled>Download selected</button>
  <div id="save-hint" class="save-hint" style="display:none"></div>
</div></div>
<main id="days"><div class="empty">Loading photos...</div></main>
<div class="foot">Photos are for personal use. Questions? info@bigskyphotos.com</div>

<div id="lb" onclick="if(event.target.id==='lb')closeLb()">
  <div id="lb-bar">
    <button class="btn" id="lb-save" style="display:none" onclick="saveOne()">Save to Photos</button>
    <a class="btn" id="lb-dl" href="#">Download this photo</a>
    <button class="btn alt" onclick="closeLb()">Close</button>
  </div>
  <img id="lb-img" alt="Enlarged photo">
  <div id="lb-nav">
    <button class="btn alt" onclick="lbStep(-1)">Previous</button>
    <button class="btn alt" onclick="lbStep(1)">Next</button>
  </div>
</div>

<form id="zipform" method="post" action="/partner/__SLUG__/zip" style="display:none">
  <input type="hidden" name="paths" id="zip-paths"><input type="hidden" name="date" id="zip-date">
</form>

<script>
const SLUG = '__SLUG__';
let photos = [];                 // every photo in page order: {path, filename, date}
const selected = new Set();      // paths
let anchor = null;               // index of the last photo tapped (for shift-click / range select)

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function prettyDate(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
}
function thumb(path){ return `/partner/${SLUG}/thumb?path=${encodeURIComponent(path)}`; }

async function load(){
  const r = await fetch(`/api/partner/${SLUG}/photos`);
  if(r.status === 401){ location.reload(); return; }
  const d = await r.json();
  if(d.family_code_message){
    const c = document.getElementById('code');
    c.innerHTML = esc(d.family_code_message).split(esc(d.family_code)).join(`<b>${esc(d.family_code)}</b>`);
    c.style.display = '';
  }
  photos = [];
  const box = document.getElementById('days');
  if(!d.days.length){
    box.innerHTML = '<div class="empty">No photos yet. They will show up here after your next day on the mountain.</div>';
    return;
  }
  box.innerHTML = d.days.map(day => {
    const start = photos.length;
    day.photos.forEach(p => photos.push({...p, date: day.date}));
    const tiles = day.photos.map((p, k) => {
      const i = start + k;
      return `<div class="ph" id="ph${i}" onclick="tap(event,${i})">
        <img src="${thumb(p.path)}" loading="lazy" decoding="async" alt="${esc(p.filename)}">
        <div class="chk">&#10003;</div>
        <button class="zoom" onclick="event.stopPropagation();openLb(${i})">View</button>
      </div>`;
    }).join('');
    const n = day.photos.length;
    return `<section class="day">
      <div class="day-head">
        <span class="day-title">${esc(prettyDate(day.date))}</span>
        <span class="day-count">${n} photo${n === 1 ? '' : 's'}</span>
        <button class="btn alt" onclick="selectDay('${day.date}')">Select this day</button>
        ${SAVE_OK ? `<button class="btn" onclick="saveDay('${day.date}')">Save this day to Photos</button>` : ''}
        <button class="btn${SAVE_OK ? ' alt' : ''}" onclick="downloadDay('${day.date}')">Download all from this day</button>
      </div>
      <div class="grid">${tiles}</div>
    </section>`;
  }).join('');
}

function setSel(i, on){
  const p = photos[i];
  if(on) selected.add(p.path); else selected.delete(p.path);
  document.getElementById('ph' + i).classList.toggle('sel', on);
}

function tap(e, i){
  const range = e.shiftKey || document.getElementById('range').checked;
  if(range && anchor !== null && anchor !== i){
    const [a, b] = [Math.min(anchor, i), Math.max(anchor, i)];
    for(let k = a; k <= b; k++) setSel(k, true);
    anchor = null;
    document.getElementById('range-hint').textContent = 'Range select';
  } else {
    setSel(i, !selected.has(photos[i].path));
    anchor = i;
    if(document.getElementById('range').checked) document.getElementById('range-hint').textContent = 'Now tap the last photo';
  }
  updateBar();
}

function rangeChanged(){
  anchor = null;
  document.getElementById('range-hint').textContent =
    document.getElementById('range').checked ? 'Tap the first photo' : 'Range select';
}

function selectDay(date){
  photos.forEach((p, i) => { if(p.date === date) setSel(i, true); });
  updateBar();
}

function clearSel(){
  photos.forEach((p, i) => { if(selected.has(p.path)) setSel(i, false); });
  anchor = null;
  if(saveJob){ saveJob = null; document.getElementById('save-sel').textContent = 'Save to Photos'; saveHint(''); }
  updateBar();
}

function updateBar(){
  const n = selected.size;
  document.getElementById('count').textContent = n ? `${n} photo${n === 1 ? '' : 's'} selected` : 'Tap photos to select them';
  document.getElementById('dl-sel').disabled = !n;
  document.getElementById('clear').disabled = !n;
  document.getElementById('dl-sel').textContent = n === 1 ? 'Download photo' : 'Download selected';
  document.getElementById('save-sel').disabled = !n;
}

function downloadSelected(){
  const paths = photos.filter(p => selected.has(p.path)).map(p => p.path);
  if(!paths.length) return;
  if(paths.length === 1){ location.href = `/partner/${SLUG}/file?path=${encodeURIComponent(paths[0])}`; return; }
  document.getElementById('zip-paths').value = JSON.stringify(paths);
  document.getElementById('zip-date').value = '';
  document.getElementById('zipform').submit();
}

function downloadDay(date){
  document.getElementById('zip-paths').value = '[]';
  document.getElementById('zip-date').value = date;
  document.getElementById('zipform').submit();
}

let lbIdx = 0;
function openLb(i){
  lbIdx = i;
  const p = photos[i];
  document.getElementById('lb-img').src = `/partner/${SLUG}/view?path=${encodeURIComponent(p.path)}`;
  document.getElementById('lb-dl').href = `/partner/${SLUG}/file?path=${encodeURIComponent(p.path)}`;
  const sb = document.getElementById('lb-save'); sb.textContent = 'Save to Photos'; sb.dataset.ready = ''; sb._file = null;
  document.getElementById('lb').classList.add('open');
}
function lbStep(d){ if(photos.length) openLb((lbIdx + d + photos.length) % photos.length); }
function closeLb(){ document.getElementById('lb').classList.remove('open'); document.getElementById('lb-img').src = ''; }
document.addEventListener('keydown', e => {
  if(!document.getElementById('lb').classList.contains('open')) return;
  if(e.key === 'Escape') closeLb();
  if(e.key === 'ArrowRight') lbStep(1);
  if(e.key === 'ArrowLeft') lbStep(-1);
});

// ── Save to Photos (phones and tablets) ──
// A normal download lands in the Files app, where many people never find it. The share
// sheet's "Save Images" puts photos straight into Photos. Sharing has to start from a tap,
// so photos are fetched first (10 at a time), then a second tap opens the share sheet.
const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const SAVE_OK = IS_MOBILE && (() => {
  try {
    const f = new File([new Blob(['x'], {type: 'image/jpeg'})], 't.jpg', {type: 'image/jpeg'});
    return !!(navigator.canShare && navigator.canShare({files: [f]}));
  } catch(e) { return false; }
})();
const BATCH = 10;
let saveJob = null;      // {paths, next, ready, busy}

function saveHint(text){
  const h = document.getElementById('save-hint');
  h.textContent = text || ''; h.style.display = text ? '' : 'none';
}
async function fetchFiles(paths){
  const r = await fetch(`/partner/${SLUG}/links`, {method: 'POST', headers: {'Content-Type': 'application/json'},
                                                  body: JSON.stringify({paths})});
  if(!r.ok) throw new Error('Could not get the photos');
  const links = (await r.json()).files;
  const out = new Array(links.length);
  let i = 0;
  async function worker(){
    while(i < links.length){
      const k = i++;
      const res = await fetch(links[k].url);
      if(!res.ok) throw new Error('Could not load ' + links[k].name);
      out[k] = new File([await res.blob()], links[k].name, {type: 'image/jpeg'});
      saveHint(`Preparing ${out.filter(Boolean).length} of ${links.length}...`);
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  return out;
}
async function startSave(paths){
  if(!paths.length) return;
  saveJob = {paths, next: 0, ready: null, busy: false};
  await saveStep();
}
async function saveStep(){
  const job = saveJob;
  if(!job || job.busy) return;
  const btn = document.getElementById('save-sel');
  if(job.ready){                                   // second tap: open the share sheet
    const files = job.ready;
    try {
      await navigator.share({files});
      job.ready = null; job.next += files.length;
      const left = job.paths.length - job.next;
      if(left > 0){ btn.textContent = `Save next ${Math.min(BATCH, left)}`; btn.disabled = false;
                    saveHint(`${job.next} of ${job.paths.length} saved. Tap "Save next" for the rest.`); }
      else { saveHint('All saved. They are in your Photos app.'); saveJob = null; btn.textContent = 'Save to Photos';
             btn.disabled = !selected.size; }
    } catch(e) {
      if(e.name !== 'AbortError') saveHint("Saving didn't work here. Use Download instead.");
    }
    return;
  }
  job.busy = true; btn.disabled = true;            // first tap: fetch the next batch
  try {
    job.ready = await fetchFiles(job.paths.slice(job.next, job.next + BATCH));
    btn.textContent = `Tap to save ${job.ready.length} photo${job.ready.length === 1 ? '' : 's'}`;
    saveHint('Then choose "Save Images" (or "Save Image").');
  } catch(e) {
    saveHint(e.message + '. Please try again.'); saveJob = null; btn.textContent = 'Save to Photos';
  } finally { job.busy = false; btn.disabled = false; }
}
function saveSelected(){
  if(saveJob){ saveStep(); return; }
  startSave(photos.filter(p => selected.has(p.path)).map(p => p.path));
}
function saveDay(date){
  saveJob = null;
  document.getElementById('save-sel').style.display = '';
  startSave(photos.filter(p => p.date === date).map(p => p.path));
  window.scrollTo({top: 0, behavior: 'smooth'});
}
async function saveOne(){
  const b = document.getElementById('lb-save');
  const p = photos[lbIdx];
  if(b.dataset.ready === p.path && b._file){
    try { await navigator.share({files: [b._file]}); b.textContent = 'Saved'; } catch(e) {}
    return;
  }
  b.disabled = true; b.textContent = 'Preparing...';
  try {
    const [f] = await fetchFiles([p.path]);
    b._file = f; b.dataset.ready = p.path; b.textContent = 'Tap to save';
  } catch(e) { b.textContent = 'Save to Photos'; }
  b.disabled = false;
}
if(SAVE_OK){
  document.getElementById('save-sel').style.display = '';
  document.getElementById('lb-save').style.display = '';
}

load();
</script>
</body></html>

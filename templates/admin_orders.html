<!DOCTYPE html>
<html><head>
<link rel="icon" type="image/png" href="/static/favicon-32.png"><meta charset="UTF-8"><title>Orders — Crystal Images</title>
<style>
/* Orders: every sale (online and in the store) for a period, filtered any way, each with all its
   details; Reports: the same sales added up by day/week/month/season, location, product, photographer,
   seller, code, refunds, tax and tips, online vs in store, and partners. Built in the page from
   /api/admin/sales, so the list and the reports always agree. */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;font-family:'Segoe UI',sans-serif;color:#e8eaf0;min-height:100vh;display:flex;flex-direction:column}
#topbar{height:52px;background:#0a1320;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;padding:0 1.4rem;flex-shrink:0}
#topbar h1{font-size:13px;font-weight:700;letter-spacing:.5px;color:#a0aec0;margin-right:auto}
#topbar a{font-size:12px;color:rgba(255,255,255,.35);text-decoration:none;padding:.3rem .6rem;border-radius:5px}
#topbar a:hover{color:rgba(255,255,255,.65);background:rgba(255,255,255,.05)}
#layout{display:flex;flex:1;height:calc(100vh - 52px);overflow:hidden}
#sidebar{width:240px;flex-shrink:0;background:#0a1320;border-right:1px solid rgba(255,255,255,.07);overflow-y:auto}
.nav-link{display:block;padding:.52rem .9rem;border-radius:6px;margin:.05rem .45rem;font-size:16px;color:rgba(255,255,255,.55);text-decoration:none}
.nav-link:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85)}
.nav-link.active{background:rgba(245,197,24,.09);color:#F5C430;box-shadow:inset 3px 0 0 #F5C430}
#main{flex:1;overflow-y:auto;padding:1.5rem 2rem 3rem}
html.embedded #topbar,html.embedded #sidebar{display:none}
html.embedded #layout{height:100vh}

.bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.9rem}
.qbtn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6);border-radius:6px;padding:.38rem .8rem;font-size:.82rem;cursor:pointer}
.qbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.qbtn.active{background:rgba(245,197,24,.12);border-color:rgba(245,197,24,.35);color:#F5C518}
.qbtn:focus-visible,.tab-btn:focus-visible,.gold-btn:focus-visible,.link-btn:focus-visible{outline:2px solid #F5C518;outline-offset:2px}
input[type=date],input[type=search],select{background:#1a1d27;border:1px solid rgba(255,255,255,.15);color:#fff;padding:.38rem .6rem;border-radius:6px;font-size:.82rem;font-family:inherit}
input[type=search]{min-width:220px}
select{max-width:200px;cursor:pointer}
.sep{color:rgba(255,255,255,.3);font-size:.8rem}
.gold-btn{background:#F5C518;color:#0f1117;border:none;border-radius:7px;padding:.42rem 1rem;font-weight:700;cursor:pointer;font-size:.82rem}
.ghost-btn{background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);border-radius:6px;padding:.36rem .75rem;font-size:.8rem;cursor:pointer}
.ghost-btn:hover{color:#fff;border-color:rgba(255,255,255,.35)}
.tab-bar{display:flex;gap:.5rem;margin:.2rem 0 1rem}
.tab-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.55);border-radius:8px;padding:.45rem 1.2rem;font-size:.88rem;cursor:pointer}
.tab-btn:hover{color:#fff}
.tab-btn.active{background:rgba(245,197,24,.12);border-color:rgba(245,197,24,.3);color:#F5C518}
html.solo .tab-bar{display:none}
.filters{background:#151923;border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:.75rem .85rem;margin-bottom:1rem}
.filters .bar{margin:0}
.filters label{font-size:.72rem;color:rgba(255,255,255,.45);display:flex;flex-direction:column;gap:.2rem}
.filt-note{font-size:.78rem;color:#F5C518;margin-top:.55rem;display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:.7rem;margin-bottom:1.1rem}
.stat{background:#1a1d27;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:.75rem 1rem}
.stat .label{font-size:10.5px;color:rgba(255,255,255,.42);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.stat .val{font-size:1.2rem;font-weight:700;color:#F5C518}
.stat .val.red{color:#f87171}.stat .val.grn{color:#4ade80}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
#orders-table{min-width:1080px}
th{background:#1a1d27;color:rgba(255,255,255,.45);font-weight:600;font-size:.68rem;letter-spacing:.8px;text-transform:uppercase;padding:.55rem .65rem;text-align:left;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap}
th.num,td.num{text-align:right}
td{padding:.55rem .65rem;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
tbody tr.order-row{cursor:pointer}
tbody tr.order-row:hover td{background:rgba(255,255,255,.04)}
tbody tr.order-row:focus-visible td{background:rgba(245,197,24,.08)}
.mono{font-family:ui-monospace,monospace;font-size:.76rem;color:rgba(255,255,255,.65)}
.dim{color:rgba(255,255,255,.4)}
.fee{color:#f87171}.net{color:#4ade80;font-weight:600}
.what{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:2.5rem;color:rgba(255,255,255,.35)}
.badge{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.4px;border-radius:4px;padding:.1rem .4rem;white-space:nowrap}
.b-online{background:rgba(99,179,237,.15);color:#63b3ed}
.b-store{background:rgba(74,222,128,.13);color:#4ade80}
.b-ref{background:rgba(248,113,113,.15);color:#f87171}
.b-warn{background:rgba(245,197,24,.15);color:#F5C518}
.b-test{background:rgba(192,132,252,.15);color:#c084fc}
.link-btn{background:rgba(99,179,237,.12);border:1px solid rgba(99,179,237,.3);color:#63b3ed;padding:.25rem .65rem;border-radius:6px;font-size:.76rem;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.link-btn:hover{background:rgba(99,179,237,.22)}
.link-btn.regen{background:rgba(245,197,24,.1);border-color:rgba(245,197,24,.25);color:#F5C518}
.loading{padding:2.5rem;text-align:center;color:rgba(255,255,255,.4)}
.more-row td{text-align:center;padding:1rem}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#1a1d27;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:1.4rem 1.5rem;width:92%;max-width:880px;max-height:92vh;overflow-y:auto}
.modal h2{color:#F5C518;font-size:1.02rem;margin-bottom:.25rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.modal-close{margin-left:auto;background:none;border:none;color:rgba(255,255,255,.45);font-size:1.3rem;cursor:pointer;line-height:1}
.modal-close:hover{color:#fff}
.m-sub{font-size:.8rem;color:rgba(255,255,255,.5);margin-bottom:1rem}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:760px){.m-grid{grid-template-columns:1fr}}
.m-box{background:#141822;border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:.75rem .9rem}
.m-title{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:.5rem}
.m-row{display:flex;gap:.8rem;padding:.28rem 0;font-size:.84rem}
.m-row .k{color:rgba(255,255,255,.42);min-width:96px;flex-shrink:0}
.m-row .v{color:#fff;word-break:break-word}
.m-items{width:100%;font-size:.83rem;margin-top:.2rem}
.m-items td{padding:.32rem .2rem;border-bottom:1px solid rgba(255,255,255,.05)}
.m-items tr.tot td{font-weight:700;border-bottom:none;padding-top:.5rem}
.m-items tr.minor td{color:rgba(255,255,255,.55)}
.m-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.refund-box{margin-top:1rem;padding:.8rem 1rem;border:1px solid rgba(248,113,113,.25);border-radius:8px;font-size:.84rem}
.refund-in{background:#0f1117;border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#fff;padding:.4rem .55rem;font-size:.82rem}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.45rem;margin-top:.5rem}
.photo-grid img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:6px;cursor:pointer}
.photo-lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:10000;align-items:center;justify-content:center}
.photo-lb.open{display:flex}
.photo-lb img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain}

.rpt-pick{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.rpt-card{background:#1a1d27;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:1rem 1.15rem;margin-bottom:1rem}
.rpt-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem;flex-wrap:wrap}
.rpt-head h3{font-size:.95rem;color:#fff;margin-right:auto}
.rpt-note{font-size:.78rem;color:rgba(255,255,255,.45);margin:-.3rem 0 .8rem;line-height:1.5}
.barcell{min-width:220px}
.barwrap{display:flex;align-items:center;gap:.6rem}
.track{flex:1;height:9px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden}
.track div{height:100%;background:rgba(245,197,24,.55);border-radius:3px}
.barwrap span{min-width:84px;text-align:right}
.rpt-card td:first-child{white-space:nowrap}
tr.total-row td{font-weight:700;border-top:1px solid rgba(255,255,255,.15)}
#toast{position:fixed;bottom:1.5rem;right:1.5rem;padding:.6rem 1.1rem;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;z-index:10001;pointer-events:none}
#toast.show{opacity:1;background:#16a34a;color:#fff}
#toast.err{opacity:1;background:#dc2626;color:#fff}
</style>
<link rel="stylesheet" href="/static/theme-admin.css">
</head><body>
<div id="topbar">
  <h1>Crystal Images — Admin</h1>
  <a href="/admin/logout">Sign out</a>
</div>
<div id="layout">
  <nav id="sidebar" aria-label="Studio">
    <a href="/admin/dashboard" class="nav-link">Dashboard</a>
    <a href="/admin/pricing" class="nav-link">Pricing</a>
    <a href="/admin/photographers" class="nav-link">Admin</a>
    <div style="border-top:1px solid rgba(255,255,255,.07);margin:.5rem 0"></div>
    <a href="/admin/orders" class="nav-link active">Orders</a>
    <a href="/admin/links" class="nav-link">Links</a>
    <a href="/admin/settings" class="nav-link">Settings</a>
    <a href="/admin/activities" class="nav-link">Activities</a>
    <div style="border-top:1px solid rgba(255,255,255,.07);padding:.25rem 0">
      <a href="/admin/trash" class="nav-link">Trash</a>
    </div>
  </nav>
  <main id="main">
    <div class="tab-bar" role="tablist">
      <button class="tab-btn active" id="tab-orders" role="tab" aria-selected="true" onclick="showTab('orders')">Orders</button>
      <button class="tab-btn" id="tab-reports" role="tab" aria-selected="false" onclick="showTab('reports')">Reports</button>
    </div>

    <div class="bar" id="range-bar" aria-label="Period">
      <button class="qbtn" data-days="1" onclick="setDays(1)">Today</button>
      <button class="qbtn" data-days="7" onclick="setDays(7)">7 days</button>
      <button class="qbtn active" data-days="30" onclick="setDays(30)">30 days</button>
      <button class="qbtn" data-days="90" onclick="setDays(90)">90 days</button>
      <button class="qbtn" data-days="season" onclick="setSeason()">This season</button>
      <button class="qbtn" data-days="365" onclick="setDays(365)">12 months</button>
      <button class="qbtn" data-days="all" onclick="setAll()">All time</button>
      <span class="sep">or</span>
      <input type="date" id="from" aria-label="From">
      <span class="sep">to</span>
      <input type="date" id="to" aria-label="To">
      <button class="ghost-btn" onclick="applyCustom()">Show</button>
      <span class="dim" id="range-label" style="font-size:.8rem;margin-left:.3rem"></span>
    </div>

    <div class="filters">
      <div class="bar">
        <input type="search" id="f-q" placeholder="Search name, email, order #, photo file" aria-label="Search orders" oninput="filterSoon()">
        <label>Where<select id="f-channel" onchange="refresh()">
          <option value="">Online and in store</option><option value="online">Online</option><option value="store">In store</option>
        </select></label>
        <label>Location<select id="f-loc" onchange="refresh()"></select></label>
        <label>Photographer<select id="f-photog" onchange="refresh()"></select></label>
        <label>Sold by<select id="f-seller" onchange="refresh()"></select></label>
        <label>Product<select id="f-cat" onchange="refresh()"></select></label>
        <label>Code<select id="f-code" onchange="refresh()"></select></label>
        <label>Status<select id="f-status" onchange="refresh()">
          <option value="">Any</option><option value="refunded">Refunded</option><option value="ship">Ships (prints/frames)</option>
          <option value="comp">Comps</option><option value="check">Amount being checked</option>
        </select></label>
        <button class="ghost-btn" style="align-self:flex-end" onclick="clearFilters()">Clear filters</button>
      </div>
      <div class="filt-note" id="filt-note"></div>
    </div>

    <div class="stats" id="stats"></div>

    <section id="view-orders">
      <div class="bar" style="justify-content:flex-end">
        <button class="gold-btn" onclick="exportOrders()">Download these orders (spreadsheet)</button>
      </div>
      <div class="wrap">
        <table id="orders-table">
          <thead><tr>
            <th>Date</th><th>Order #</th><th>Where</th><th>Customer</th><th>Location</th><th>Ordered</th>
            <th>Photographer</th><th class="num">Total</th><th class="num">Card fee</th><th class="num">Net</th><th>Code</th><th>Link</th>
          </tr></thead>
          <tbody id="orders-body"><tr><td colspan="12" class="loading">Loading orders&hellip;</td></tr></tbody>
        </table>
      </div>
    </section>

    <section id="view-reports" style="display:none">
      <div class="rpt-pick" id="rpt-pick" role="tablist" aria-label="Report"></div>
      <div id="rpt-body"></div>
    </section>
  </main>
</div>

<div class="modal-overlay" id="detail" onclick="if(event.target===this)closeDetail()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="d-title"><div id="detail-body"></div></div>
</div>
<div class="photo-lb" id="photo-lb" onclick="this.classList.remove('open')"><img id="photo-lb-img" src="" alt="Photo, larger"></div>
<div id="toast" role="status"></div>

<script>
if (window.parent !== window) document.documentElement.classList.add('embedded');
const QS = new URLSearchParams(location.search);
if (QS.get('solo') === '1') document.documentElement.classList.add('solo');
const S = {data: null, rows: [], shown: [], tab: (QS.get('tab') === 'reports' ? 'reports' : 'orders'),
           range: {days: 30}, report: 'time', period: 'day', limit: 200, partnerCache: {}};
const CAT = {};

// ── helpers ──
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function money(n) {
  n = Number(n) || 0;
  return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function r2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
let _tt;
function toast(msg, type = 'show') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = type;
  clearTimeout(_tt); _tt = setTimeout(() => t.className = '', 2600);
}
function ymd(d) { return d.toLocaleDateString('en-CA', {timeZone: 'America/Denver'}); }
function seasonOf(day) {
  const y = +day.slice(0, 4), m = +day.slice(5, 7);
  if (m >= 11) return 'Winter ' + y + '-' + String((y + 1) % 100).padStart(2, '0');
  if (m <= 4) return 'Winter ' + (y - 1) + '-' + String(y % 100).padStart(2, '0');
  return 'Summer ' + y;
}
function seasonStart(day) {
  const y = +day.slice(0, 4), m = +day.slice(5, 7);
  if (m >= 11) return y + '-11-01';
  if (m <= 4) return (y - 1) + '-11-01';
  return y + '-05-01';
}
function weekOf(day) {
  const d = new Date(day + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
  return 'Week of ' + d.toISOString().slice(0, 10);
}
// What a sale counts for after refunds
function kept(r) { return r.refund_full ? 0 : Math.max(r2(r.total - (r.refunded || 0)), 0); }
function charged(r) { return r.charged != null ? r.charged : r.total; }
function wherePill(r) {
  if (r.channel === 'online') return '<span class="badge b-online">Online</span>';
  return '<span class="badge b-store">' + (r.provider === 'comp' ? 'Store · comp' : 'In store') + '</span>';
}
function orderNo(r) {
  if (r.channel === 'store') return r.order_no ? 'Square ' + r.order_no : '';
  return r.order_no || '';
}
function itemsText(r) {
  const names = (r.items || []).map(i => (i.qty > 1 && !/×|\(\d/.test(i.name) ? i.qty + ' × ' : '') + i.name);
  return names.length ? names.join(', ') : (r.what || '');
}
function custName(r) { return ((r.first || '') + ' ' + (r.last || '')).trim(); }

// ── loading ──
function rangeQS() {
  const g = S.range;
  if (g.all) return 'all_time=1';
  if (g.from) return 'date_from=' + g.from + '&date_to=' + g.to;
  return 'days=' + g.days;
}
function markRange(key) {
  document.querySelectorAll('#range-bar .qbtn').forEach(b => b.classList.toggle('active', b.dataset.days === String(key)));
}
function setDays(n) { S.range = {days: n}; markRange(n); load(); }
function setAll() { S.range = {all: true}; markRange('all'); load(); }
function setSeason() {
  const today = ymd(new Date());
  S.range = {from: seasonStart(today), to: today}; markRange('season'); load();
}
function applyCustom() {
  const f = document.getElementById('from').value, t = document.getElementById('to').value;
  if (!f || !t) { toast('Pick both dates', 'err'); return; }
  if (f > t) { toast('The first date is after the second', 'err'); return; }
  S.range = {from: f, to: t}; markRange(''); load();
}
async function load() {
  document.getElementById('orders-body').innerHTML = '<tr><td colspan="12" class="loading">Loading orders&hellip;</td></tr>';
  if (S.tab === 'reports') document.getElementById('rpt-body').innerHTML = '<div class="loading">Loading&hellip;</div>';
  try {
    const res = await fetch('/api/admin/sales?' + rangeQS());
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'error');
    S.data = await res.json();
  } catch (e) {
    document.getElementById('orders-body').innerHTML = '<tr><td colspan="12" class="empty">Couldn\'t load the orders. Try again in a moment.</td></tr>';
    document.getElementById('rpt-body').innerHTML = '<div class="empty">Couldn\'t load the orders. Try again in a moment.</div>';
    return;
  }
  Object.assign(CAT, S.data.categories || {});
  S.rows = S.data.rows || [];
  S.partnerCache = {};
  const a = S.data.date_from, b = S.data.date_to;
  document.getElementById('range-label').textContent = a ? (a === b ? a : a + ' to ' + b) : 'All time';
  document.getElementById('from').value = a || '';
  document.getElementById('to').value = b || '';
  fillFilterOptions();
  refresh();
}

// ── filters ──
function setOptions(id, label, values) {
  const el = document.getElementById(id), cur = el.value;
  el.innerHTML = '<option value="">' + esc(label) + '</option>' +
    values.map(v => '<option value="' + esc(v[0]) + '">' + esc(v[1]) + '</option>').join('');
  if (values.some(v => v[0] === cur)) el.value = cur;
}
function uniq(list) { return [...new Set(list.filter(Boolean))].sort((a, b) => a.localeCompare(b)); }
function fillFilterOptions() {
  const rows = S.rows;
  setOptions('f-loc', 'All locations', uniq(rows.map(r => r.location_clean)).map(v => [v, v]));
  setOptions('f-photog', 'All photographers', uniq(rows.map(r => r.photographer)).map(v => [v, v]));
  setOptions('f-seller', 'Anyone', uniq(rows.map(r => r.seller)).map(v => [v, v]));
  const cats = uniq(rows.flatMap(r => (r.items || []).map(i => i.cat)));
  setOptions('f-cat', 'All products', cats.map(c => [c, CAT[c] || c]));
  const codes = uniq(rows.map(r => (r.code || '').toLowerCase()));
  setOptions('f-code', 'Any', [['*', 'Used a code'], ...codes.map(c => [c, c])]);
}
let _ft;
function filterSoon() { clearTimeout(_ft); _ft = setTimeout(refresh, 150); }
function clearFilters() {
  ['f-q', 'f-channel', 'f-loc', 'f-photog', 'f-seller', 'f-cat', 'f-code', 'f-status'].forEach(id => document.getElementById(id).value = '');
  refresh();
}
function filtered() {
  const v = id => document.getElementById(id).value;
  const q = v('f-q').trim().toLowerCase(), ch = v('f-channel'), loc = v('f-loc'), ph = v('f-photog'),
        se = v('f-seller'), cat = v('f-cat'), code = v('f-code'), st = v('f-status');
  return S.rows.filter(r => {
    if (ch && r.channel !== ch) return false;
    if (loc && r.location_clean !== loc) return false;
    if (ph && r.photographer !== ph) return false;
    if (se && r.seller !== se) return false;
    if (cat && !(r.items || []).some(i => i.cat === cat)) return false;
    if (code === '*' && !r.code) return false;
    if (code && code !== '*' && (r.code || '').toLowerCase() !== code) return false;
    if (st === 'refunded' && !r.refunded) return false;
    if (st === 'ship' && !(r.ship_to || r.shipping)) return false;

      if (!hay.includes(q)) return false;
    }

// A table with an optional bar on one column; `cols` = [label, key, kind] (kind: money|int|text|bar)
function table(cols, rows, totalRow) {
  const barCol = cols.find(c => c[2] === 'bar');
  const max = barCol ? Math.max(0, ...rows.map(r => Number(r[barCol[1]]) || 0)) : 0;
  const cell = (c, r, isTotal) => {
    const v = r[c[1]];
    if (c[2] === 'money') return '<td class="num">' + money(v) + '</td>';
    if (c[2] === 'int') return '<td class="num">' + (v === '' ? '' : (v || 0)) + '</td>';
    if (c[2] === 'bar') {
      const w = !isTotal && max > 0 ? Math.max(0.5, (Number(v) || 0) / max * 100) : 0;
      return '<td class="num barcell"><div class="barwrap">' + (isTotal ? '<div style="flex:1"></div>' : '<div class="track">' +
             (w ? '<div style="width:' + w.toFixed(1) + '%"></div>' : '') + '</div>') + '<span>' + money(v) + '</span></div></td>';
    }
    return '<td>' + esc(v == null ? '' : v) + '</td>';
  };
  return '<div class="wrap"><table><thead><tr>' + cols.map(c => '<th' + (c[2] && c[2] !== 'text' ? ' class="num"' : '') + '>' + c[0] + '</th>').join('') +
    '</tr></thead><tbody>' + (rows.length ? rows.map(r => '<tr>' + cols.map(c => cell(c, r)).join('') + '</tr>').join('')
      : '<tr><td colspan="' + cols.length + '" class="empty">Nothing in this period.</td></tr>') +
    (totalRow && rows.length ? '<tr class="total-row">' + cols.map(c => cell(c, totalRow, true)).join('') + '</tr>' : '') +
    '</tbody></table></div>';
}
function reportCard(title, note, body, csvName, cols, rows, totalRow, extra) {
  window._rptCsv = () => downloadCsv(csvName, cols.map(c => c[0]),
    [...rows, ...(totalRow ? [totalRow] : [])].map(r => cols.map(c => (c[2] === 'money' || c[2] === 'bar') ? (Number(r[c[1]]) || 0).toFixed(2) : r[c[1]])));
  return '<div class="rpt-card"><div class="rpt-head"><h3>' + title + '</h3>' + (extra || '') +
    '<button class="gold-btn" onclick="window._rptCsv()">Download (spreadsheet)</button></div>' +
    (note ? '<div class="rpt-note">' + note + '</div>' : '') + body + '</div>';
}
function group(rows, keyFn) {
  const m = new Map();
  rows.forEach(r => {
    const keys = [].concat(keyFn(r)).filter(k => k != null);
    keys.forEach(k => {
      if (!m.has(k)) m.set(k, {name: k, orders: 0, revenue: 0, kept: 0, net: 0, fees: 0, tips: 0, tax: 0, refunds: 0, discounts: 0});
      const g = m.get(k);
      g.orders++; g.revenue += charged(r); g.kept += kept(r); g.net += r.net || 0; g.fees += r.stripe_fee || 0;
      g.tips += r.tip || 0; g.tax += r.refund_full ? 0 : (r.tax || 0); g.refunds += r.refunded || 0;
      g.discounts += (r.discount || 0) + (r.bundle_savings || 0);
    });
  });
  return [...m.values()].map(g => { for (const k in g) if (typeof g[k] === 'number' && k !== 'orders') g[k] = r2(g[k]); g.avg = g.orders ? r2(g.revenue / g.orders) : 0; return g; });
}
function sumRow(list, name) {
  const t = {name: name || 'Total'};
  list.forEach(g => { for (const k in g) if (typeof g[k] === 'number') t[k] = r2((t[k] || 0) + g[k]); });
  t.avg = t.orders ? r2(t.revenue / t.orders) : 0;
  return t;
}

    const list = group(rows.filter(r => r.date), fn).sort((a, b) => a.name.localeCompare(b.name));
    const cols = [[{day: 'Day', week: 'Week', month: 'Month', season: 'Season'}[S.period], 'name'], ['Orders', 'orders', 'int'],
      ['Revenue', 'revenue', 'bar'], ['Card fees', 'fees', 'money'], ['Net', 'net', 'money'], ['Tips', 'tips', 'money'],
      ['Resort tax', 'tax', 'money'], ['Refunds', 'refunds', 'money'], ['Avg order', 'avg', 'money']];
    const per = ['day', 'week', 'month', 'season'].map(p => '<button class="qbtn' + (S.period === p ? ' active' : '') +
      '" onclick="S.period=\'' + p + '\';renderReport()">' + {day: 'By day', week: 'By week', month: 'By month', season: 'By season'}[p] + '</button>').join('');
    html = reportCard('Sales over time', 'Seasons: winter is November through April, summer is May through October. Revenue is what customers paid (tax and tips included, refunds taken off).',
      table(cols, list, sumRow(list)), 'sales-by-' + S.period, cols, list, sumRow(list), per);
  } else if (k === 'dow') {
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const got = group(rows.filter(r => r.date), r => days[(new Date(r.date + 'T12:00:00Z').getUTCDay() + 6) % 7]);
    const list = days.map(d => got.find(g => g.name === d) || {name: d, orders: 0, revenue: 0, net: 0, avg: 0});
    const cols = [['Day', 'name'], ['Orders', 'orders', 'int'], ['Revenue', 'revenue', 'bar'], ['Net', 'net', 'money'], ['Avg order', 'avg', 'money']];
    html = reportCard('Sales by day of the week', '', table(cols, list, sumRow(list)), 'sales-by-weekday', cols, list, sumRow(list));
  } else if (k === 'locations') {
    const list = group(rows, r => r.location_clean || 'No location').sort((a, b) => b.revenue - a.revenue);
    const cols = [['Location', 'name'], ['Orders', 'orders', 'int'], ['Revenue', 'revenue', 'bar'], ['Net', 'net', 'money'], ['Avg order', 'avg', 'money']];
    html = reportCard('Sales by location', '', table(cols, list, sumRow(list)), 'sales-by-location', cols, list, sumRow(list));
  } else if (k === 'products') {
    const m = new Map();
    rows.forEach(r => {
      if (r.refund_full) return;
      const seen = new Set();
      (r.items || []).forEach(it => {
        if (!m.has(it.cat)) m.set(it.cat, {name: CAT[it.cat] || it.cat, items: 0, orders: 0, amount: 0});
        const g = m.get(it.cat); g.items += it.qty || 1; g.amount += it.amount || 0;
        if (!seen.has(it.cat)) { g.orders++; seen.add(it.cat); }
      });
    });
    const list = [...m.values()].map(g => ({...g, amount: r2(g.amount)})).sort((a, b) => b.amount - a.amount);
    const cols = [['Product', 'name'], ['Orders', 'orders', 'int'], ['Items', 'items', 'int'], ['Sales', 'amount', 'bar']];
    const tot = {name: 'Total', orders: '', items: list.reduce((s, g) => s + g.items, 0), amount: r2(list.reduce((s, g) => s + g.amount, 0))};
    html = reportCard('Sales by product', 'Item prices before discount codes, shipping, tax and tips; fully refunded orders left out. Photo items count each photo.',
      table(cols, list, tot), 'sales-by-product', cols, list, tot);
  } else if (k === 'photographers') {
    const list = group(rows, r => r.photographer || 'Unknown').sort((a, b) => b.kept - a.kept);
    const cols = [['Photographer', 'name'], ['Orders', 'orders', 'int'], ['Sales (before tax and tips)', 'kept', 'bar'], ['Revenue', 'revenue', 'money']];
    html = reportCard('Sales by photographer', 'Credited by the photo\'s JPEG code, the same way as commission (refunds taken off). Commission pay and hours are in Admin &gt; Commission.',
      table(cols, list, sumRow(list)), 'sales-by-photographer', cols, list, sumRow(list));
  } else if (k === 'sellers') {
    const list = group(rows.filter(r => r.channel === 'store'), r => r.seller || 'Unknown').sort((a, b) => b.revenue - a.revenue);
    const cols = [['Sold by', 'name'], ['Sales', 'orders', 'int'], ['Revenue', 'revenue', 'bar'], ['Tips', 'tips', 'money'], ['Avg sale', 'avg', 'money']];
    html = reportCard('Store sales by who rang them up', 'In-store sales only (online orders have no seller).',
      table(cols, list, sumRow(list)), 'store-sales-by-seller', cols, list, sumRow(list));
  } else if (k === 'codes') {
    const withCode = rows.filter(r => r.code);
    const list = group(withCode, r => r.code.toLowerCase()).map(g => ({...g,
      off: r2(withCode.filter(r => r.code.toLowerCase() === g.name).reduce((s, r) => s + (r.discount || 0), 0))}))
      .sort((a, b) => b.orders - a.orders);
    const bundles = rows.filter(r => r.bundle_savings);
    if (bundles.length) list.push({name: 'Bundle discounts (no code)', orders: bundles.length,
      off: r2(bundles.reduce((s, r) => s + r.bundle_savings, 0)), revenue: r2(bundles.reduce((s, r) => s + charged(r), 0))});
    const cols = [['Code', 'name'], ['Orders', 'orders', 'int'], ['Discount given', 'off', 'bar'], ['Revenue from these orders', 'revenue', 'money']];
    html = reportCard('Discount codes and bundles', '', table(cols, list, sumRow(list)), 'discount-codes', cols, list, sumRow(list));
  } else if (k === 'refunds') {
    const list = rows.filter(r => r.refunded).map(r => ({name: r.date, order: orderNo(r), where: r.channel === 'online' ? 'Online' : 'In store',
      customer: custName(r), refunded: r.refunded, on: r.refund_date || '', kind: r.refund_full ? 'Full' : 'Partial', note: r.refund_note || ''}));
    const cols = [['Sale date', 'name'], ['Order #', 'order'], ['Where', 'where'], ['Customer', 'customer'], ['Refunded', 'refunded', 'money'],
      ['Refunded on', 'on'], ['Full or partial', 'kind'], ['Note', 'note']];
    const tot = {name: 'Total', refunded: r2(list.reduce((s, r) => s + r.refunded, 0))};
    html = reportCard('Refunds', 'Sales in this period that were refunded (Stripe refunds appear by themselves; Square and WooCommerce ones once recorded on the order).',
      table(cols, list, tot), 'refunds', cols, list, tot);
  } else if (k === 'tax') {
    const store = rows.filter(r => r.channel === 'store' && !r.is_comp);
    const list = group(store, r => r.date.slice(0, 7)).sort((a, b) => a.name.localeCompare(b.name))
      .map(g => ({...g, before: r2(g.revenue - g.tax - g.tips)}));
    const cols = [['Month', 'name'], ['Store sales', 'orders', 'int'], ['Sales before tax and tips', 'before', 'money'], ['Resort tax collected', 'tax', 'bar'], ['Tips', 'tips', 'money']];
    html = reportCard('Resort tax and tips (store sales)', 'Resort tax is charged in the store through Square; online orders don\'t charge it. Fully refunded sales count no tax.',
      table(cols, list, sumRow(list)), 'resort-tax-and-tips', cols, list, sumRow(list));
  } else if (k === 'channels') {
    const list = group(rows, r => (r.channel === 'online' ? 'Online' : 'In store') + ' · ' + provName(r)).sort((a, b) => b.revenue - a.revenue);
    const cols = [['Where and how paid', 'name'], ['Orders', 'orders', 'int'], ['Revenue', 'revenue', 'bar'], ['Card fees', 'fees', 'money'], ['Net', 'net', 'money'], ['Avg order', 'avg', 'money']];
    html = reportCard('Online vs in store', '', table(cols, list, sumRow(list)), 'online-vs-store', cols, list, sumRow(list));
  } else if (k === 'partners') {
    html = '<div class="loading">Loading partner reports&hellip;</div>';
    loadPartners();
  }
  el.innerHTML = html;
}
async function loadPartners() {
  const el = document.getElementById('rpt-body');
  const partners = (S.data && S.data.partners) || [];
  if (!partners.length) { el.innerHTML = '<div class="rpt-card"><div class="empty">No partners are set up (Settings).</div></div>'; return; }
  const a = S.data.date_from || '', b = S.data.date_to || '';
  const qs = p => 'partner=' + encodeURIComponent(p.id) + '&date_from=' + a + '&date_to=' + b;
  const reps = await Promise.all(partners.map(async p => {
    const key = qs(p);
    if (!S.partnerCache[key]) {
      try { const res = await fetch('/api/admin/partner-report?' + key); S.partnerCache[key] = res.ok ? await res.json() : null; }
      catch (e) { S.partnerCache[key] = null; }
    }
    return [p, S.partnerCache[key]];
  }));
  if (S.report !== 'partners') return;
  el.innerHTML = reps.map(([p, rep]) => {
    if (!rep) return '<div class="rpt-card"><div class="rpt-head"><h3>' + esc(p.name) + '</h3></div><div class="empty">Couldn\'t load this report.</div></div>';
    const pr = rep.prints || {};
    return '<div class="rpt-card"><div class="rpt-head"><h3>' + esc(rep.partner) + '</h3>' +
      '<a class="gold-btn" style="text-decoration:none" href="/admin/partner-report.csv?' + qs(p) + '">Download (spreadsheet)</a></div>' +
      '<div class="rpt-note">Free photos downloaded (the in-kind donation) and prints of their photos sold at the partner discount, for this period. Filters don\'t apply here.</div>' +
      '<div class="stats" style="margin:0">' +
      '<div class="stat"><div class="label">Photos downloaded</div><div class="val">' + (rep.photos || 0) + '</div></div>' +
      '<div class="stat"><div class="label">Donated value</div><div class="val">' + money(rep.total_value) + '</div></div>' +
      '<div class="stat"><div class="label">Prints sold</div><div class="val">' + (pr.count || 0) + '</div></div>' +
      '<div class="stat"><div class="label">Prints paid</div><div class="val">' + money(pr.paid) + '</div></div>' +
      '<div class="stat"><div class="label">Print discount given</div><div class="val">' + money(pr.discount) + '</div></div></div></div>';
  }).join('');
}

// ── tabs ──
function showTab(t) {
  S.tab = t;
  ['orders', 'reports'].forEach(x => {
    document.getElementById('view-' + x).style.display = x === t ? '' : 'none';
    const b = document.getElementById('tab-' + x);
    b.classList.toggle('active', x === t); b.setAttribute('aria-selected', x === t);
  });
  if (S.data) { if (t === 'orders') renderOrders(); else renderReport(); }
}
showTab(S.tab);
load();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/static/favicon-32.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Thank you — Crystal Images</title>
<link href="/static/fonts/fonts.css" rel="stylesheet">
__REFRESH__
<style>
/* After paying: the download right here (the email has it too), prints' next step, and the
   Google review link. Same look as the checkout page. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #093A52; font-family: 'DM Sans', sans-serif; color: #e8eaf0; min-height: 100vh; }
.co-header { background: #062b3e; border-bottom: 1px solid rgba(255,255,255,.07); padding: 0 2rem; height: 60px;
  display: flex; align-items: center; }
.co-logo { color: #F5C518; font-size: 1.15rem; font-weight: 700; text-decoration: none; }
.wrap { max-width: 620px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
.card { background: #0b2f42; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 2rem 1.75rem; text-align: center; }
h1 { font-size: 1.5rem; color: #fff; margin-bottom: .4rem; }
.sub { color: rgba(255,255,255,.6); font-size: .9rem; margin-bottom: 1.6rem; }
.btn { display: inline-block; background: #F5C518; color: #07151f; font-weight: 700; text-decoration: none;
  padding: .85rem 1.8rem; border-radius: 8px; font-size: 1rem; }
.btn:hover { background: #f0bc00; }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.note { margin-top: 1.1rem; font-size: .85rem; color: rgba(255,255,255,.6); line-height: 1.6; }
.block { margin-top: 1.4rem; padding-top: 1.2rem; border-top: 1px solid rgba(255,255,255,.08); font-size: .92rem; line-height: 1.6; }
.review { display: inline-block; margin-top: .6rem; color: #F5C518; font-weight: 600; text-decoration: none;
  border: 1px solid rgba(245,197,24,.5); border-radius: 8px; padding: .55rem 1.2rem; }
.review:hover { background: rgba(245,197,24,.1); }
.back { display: inline-block; margin-top: 1.6rem; color: rgba(255,255,255,.7); font-size: .88rem; }
</style>
</head>
<body>
<header class="co-header"><a class="co-logo" href="/">Crystal Images</a></header>
<main class="wrap">
  <div class="card">
    __CONTENT__
    <a class="back" href="/">Back to the photos</a>
  </div>
</main>
<script>
// The cart has been ordered (also cleared when leaving the checkout page)
try {
  localStorage.removeItem('ci_checkout_cart'); localStorage.removeItem('bsp_cart_v1');
  Object.keys(localStorage).filter(k => k.startsWith('ci_partner_prints_')).forEach(k => localStorage.removeItem(k));
} catch (e) {}
</script>
</body>
</html>

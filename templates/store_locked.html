<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Store Mode</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0c2336;color:#fff;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.card{background:#0a1e2e;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:400px}
h1{color:#F5C518;font-size:1.3rem;margin-bottom:.8rem;text-align:center}
p{color:rgba(255,255,255,.75);font-size:.92rem;line-height:1.55;text-align:center;margin-bottom:1.2rem}
label{display:block;font-size:.8rem;color:rgba(255,255,255,.6);margin-bottom:.35rem}
input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:8px;
  padding:.75rem 1rem;color:#fff;font-size:1rem;margin-bottom:1rem;outline:none;font-family:inherit}
input:focus{border-color:#F5C518}
input.code{text-align:center;letter-spacing:.4rem;font-size:1.3rem}
button{width:100%;background:#F5C518;color:#0c2336;border:none;border-radius:8px;
  padding:.75rem;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,.link:focus-visible{outline:3px solid #fff;outline-offset:2px}
.link{background:none;border:none;color:rgba(255,255,255,.5);font-size:.8rem;text-decoration:underline;width:auto;padding:0;margin-top:1rem;font-weight:400}
.msg{font-size:.85rem;text-align:center;margin-top:.6rem;min-height:1.2em;color:rgba(255,255,255,.7)}
.msg.err{color:#ff8a80}
[hidden]{display:none !important}
</style></head><body>
<main class="card">
  <h1>Store mode</h1>

  <div id="step-ask">
    <p>This screen isn't approved for store mode yet. Give it a name, then ask for a code. The code is emailed to the owner.</p>
    <label for="screen-name">Screen name</label>
    <input id="screen-name" maxlength="40" placeholder="e.g. Front counter iMac" autocomplete="off">
    <button id="ask-btn" type="button">Ask for a code</button>
  </div>

  <div id="step-code" hidden>
    <p id="code-note">We emailed a 6-digit code to the owner. Type it here.</p>
    <label for="code">Code</label>
    <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code">
    <button id="verify-btn" type="button">Approve this screen</button>
    <div style="text-align:center"><button class="link" id="restart-btn" type="button">Start over</button></div>
  </div>

  <div class="msg" id="msg" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
  const $ = id => document.getElementById(id);
  let challenge = '';
  function say(t, err) { $('msg').textContent = t || ''; $('msg').className = 'msg' + (err ? ' err' : ''); }
  function showStep(code) {
    $('step-ask').hidden = code; $('step-code').hidden = !code;
    (code ? $('code') : $('screen-name')).focus();
  }
  async function post(url, body) {
    const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    return [r, await r.json().catch(() => ({}))];
  }
  async function ask() {
    const name = $('screen-name').value.trim();
    if (!name) { say('Give this screen a name first.', true); return; }
    $('ask-btn').disabled = true; say('Sending…');
    try {
      const [r, d] = await post('/api/store/request', {name});
      if (d.approved) { location.reload(); return; }
      if (!r.ok) { say(d.error || 'Something went wrong — try again', true); return; }
      challenge = d.challenge;
      $('code-note').textContent = `We emailed a 6-digit code to ${d.email}. Type it here. It works for ${d.minutes} minutes.`;
      say(''); $('code').value = ''; showStep(true);
    } catch (e) { say('Could not connect — check the internet connection', true); }
    finally { $('ask-btn').disabled = false; }
  }
  async function verify() {
    const code = $('code').value.trim();
    if (!/^\d{6}$/.test(code)) { say('Enter the 6-digit code.', true); return; }
    $('verify-btn').disabled = true; say('Checking…');
    try {
      const [r, d] = await post('/api/store/verify', {challenge, code});
      if (r.ok) { say('Approved. Opening store mode…'); location.reload(); return; }
      say(d.error || 'Incorrect code', true);
      if (d.restart) { challenge = ''; showStep(false); }
    } catch (e) { say('Could not connect — check the internet connection', true); }
    finally { $('verify-btn').disabled = false; }
  }
  $('ask-btn').addEventListener('click', ask);
  $('verify-btn').addEventListener('click', verify);
  $('restart-btn').addEventListener('click', () => { challenge = ''; say(''); showStep(false); });
  $('screen-name').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
  $('code').addEventListener('keydown', e => { if (e.key === 'Enter') verify(); });
})();
</script>
</body></html>
